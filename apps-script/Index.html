          const { A1, B1, A2, B2, vectors } = pickChainSides(r, s, '||', '&&');
          const [m1, m2, m3] = s.outcomes;
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              `If ${say(A1)} or ${say(B1)}, print "${m1}".`,
              `Otherwise, if ${say(A2)} and ${say(B2)}, print "${m2}".`,
              `In every other case, print "${m3}".`,
            ])}`,
            prefix: sceneFixedLets(r, s),
            movable: chainLines(
              [{ cond: join(A1, '||', B1), body: log(m1) }, { cond: join(A2, '&&', B2), body: log(m2) }],
              log(m3),
            ),
            spec: { kind: 'snippet', vectors },
            explain: 'An if comes first, then else if, then else. Each message goes right after the condition it belongs to.',
          });
        },
      },
      {
        id: 'change-the-value-first',
        make(r) {
          const s = kit.pickScene(r);
          const v = s.a;
          const change = v.step * r.int(1, 3);
          const A = side(v, r.pick(['>', '>=']), v.t);
          const B = side(s.b, pickOp(r), s.b.t);
          const [m1, m2] = s.outcomes;
          const vectors = kit.sceneVectors([A, side(v, '>=', v.t - change), B]);
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              `Add ${change} to ${v.name}.`,
              `Then, if ${say(A)} and ${say(B)}, print "${m1}".`,
              `In every other case, print "${m2}".`,
              'At the very end, always print "Finished".',
            ])}`,
            prefix: sceneFixedLets(r, s),
            movable: [`${v.name} = ${v.name} + ${change}`].concat(
              chainLines([{ cond: join(A, '&&', B), body: log(m1) }], log(m2)),
              [log('Finished')],
            ),
            spec: { kind: 'snippet', vectors },
            explain: 'Code runs top to bottom, so the value has to change before the if checks it. "Finished" goes after the whole if / else.',
          });
        },
      },
      {
        id: 'inside-a-function',
        make(r) {
          const s = kit.pickScene(r);
          const fn = r.pick(kit.FUNCTION_NAMES);
          let A1;
          let B1;
          let A2;
          do {
            A1 = side(s.a, pickOp(r), s.a.t);
            B1 = side(s.b, pickOp(r), s.b.t);
            A2 = side(s.a, pickOp(r), r.pick(s.a.thresholds));
          } while (!chainMatters([join(A1, '&&', B1), A2.text], kit.sceneVectors([A1, B1, A2])));
          const [m1, m2, m3] = s.outcomes;
          const callArgs = [s.a, s.b].map((v) => r.pick(kit.valuesOf(v)));
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              `Inside ${fn}, if ${say(A1)} and ${say(B1)}, print "${m1}".`,
              `Otherwise, if ${say(A2)}, print "${m2}".`,
              `In every other case, print "${m3}".`,
            ])}`,
            prefix: [{ text: `function ${fn}(${s.a.name}, ${s.b.name}){` }],
            movable: chainLines(
              [{ cond: join(A1, '&&', B1), body: log(m1) }, { cond: A2.text, body: log(m2) }],
              log(m3),
            ),
            suffix: [
              { text: '}' },
              { text: `${fn}(${callArgs.join(', ')})`, run: `${fn}(__in.${s.a.name}, __in.${s.b.name})` },
            ],
            spec: { kind: 'snippet', vectors: kit.sceneVectors([A1, B1, A2]) },
            explain: 'An if comes first, then else if, then else. Each message goes right after the condition it belongs to.',
          });
        },
      },
    ],
  };

  // ---- Slot: put a scrambled sketch in order ----

  const DRAW_PREFIX = [{ text: 'function draw(){' }];
  const DRAW_SUFFIX = [{ text: '}' }];

  const parsonsCanvasSlot = {
    id: 'parsonsCanvas',
    skill: 'build',
    concept: 'Ordering a p5 sketch that reacts to the mouse',
    patterns: [
      {
        id: 'background-by-corner',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const [q1, q2] = pickQuadrantSet(r);
          const [c1, c2, c3] = r.sample(kit.COLORS, 3);
          const V = r.pick(kit.COLOR_VARS.background);
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              `On ${kit.canvasName(c)}, if the mouse is in the ${q1} part, make ${V} ${c1.name}.`,
              `Otherwise, if the mouse is in the ${q2} part, make ${V} ${c2.name}.`,
              `In every other case, make ${V} ${c3.name}.`,
              `Paint the background with ${V}.`,
            ])}`,
            prefix: DRAW_PREFIX,
            movable: chainLines(
              [{ cond: kit.quadCond(q1, c), body: kit.setColor(V, c1) }, { cond: kit.quadCond(q2, c), body: kit.setColor(V, c2) }],
              kit.setColor(V, c3),
            ).concat([`background(${V})`]),
            suffix: DRAW_SUFFIX,
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${V}`, 'function setup(){', `  createCanvas(${c.w}, ${c.h})`, `  ${V} = color(255, 255, 255)`, '}'],
              vectors: kit.mouseVectors(c.w, c.h, [c.cx], [c.cy]),
            },
            explain: 'The if, else if, and else stay together, with each color right after its condition. background() can go before or after them because draw() keeps repeating.',
          });
        },
      },
      {
        id: 'circle-color',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          const xOp = r.pick(['>', '<']);
          const yOp = r.pick(['>', '<']);
          const cond = `mouseX ${xOp} ${c.cx} || mouseY ${yOp} ${c.cy}`;
          const xWord = xOp === '>' ? 'right side' : 'left side';
          const yWord = yOp === '>' ? 'bottom half' : 'top half';
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              'Paint a gray background behind everything.',
              `On ${kit.canvasName(c)}, if the mouse is on the ${xWord} or in the ${yWord}, make ${V} ${c1.name}.`,
              `In every other case, make ${V} ${c2.name}.`,
              `Fill with ${V} and draw the circle on top of the background.`,
            ])}`,
            prefix: DRAW_PREFIX,
            movable: ['background(220)'].concat(
              chainLines([{ cond, body: kit.setColor(V, c1) }], kit.setColor(V, c2)),
              [`fill(${V})`, `ellipse(${c.cx}, ${c.cy}, 100, 100)`],
            ),
            suffix: DRAW_SUFFIX,
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${V}`, 'function setup(){', `  createCanvas(${c.w}, ${c.h})`, `  ${V} = color(255, 255, 255)`, '}'],
              vectors: kit.mouseVectors(c.w, c.h, [c.cx], [c.cy]),
            },
            explain: 'background() has to come before ellipse(), or it paints over the circle. Each color goes right after its condition.',
          });
        },
      },
      {
        id: 'background-by-thirds',
        make(r) {
          const h = r.pick([300, 450, 600]);
          const a = h / 3;
          const b = (2 * h) / 3;
          const [c1, c2, c3] = r.sample(kit.COLORS, 3);
          const V = r.pick(kit.COLOR_VARS.light);
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              `On a canvas that is ${h} tall, if the mouse is above the line at y = ${a}, make ${V} ${c1.name}.`,
              `Otherwise, if the mouse is between y = ${a} and y = ${b}, make ${V} ${c2.name}.`,
              `In every other case, make ${V} ${c3.name}.`,
              `Paint the background with ${V}.`,
            ])}`,
            prefix: DRAW_PREFIX,
            movable: chainLines(
              [{ cond: `mouseY < ${a}`, body: kit.setColor(V, c1) }, { cond: `mouseY > ${a} && mouseY < ${b}`, body: kit.setColor(V, c2) }],
              kit.setColor(V, c3),
            ).concat([`background(${V})`]),
            suffix: DRAW_SUFFIX,
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${V}`, 'function setup(){', `  createCanvas(400, ${h})`, `  ${V} = color(255, 255, 255)`, '}'],
              vectors: kit.mouseVectors(400, h, [], [a, b]),
            },
            explain: 'A smaller mouseY is higher on the canvas. Each color goes right after its condition, and the else comes last.',
          });
        },
      },
      {
        id: 'circle-size',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const S = r.pick(kit.COLOR_VARS.size);
          const name = r.pick(kit.quadrantNames);
          const [big, small] = r.pick([[150, 50], [200, 80], [120, 40]]);
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              'Paint a gray background behind everything.',
              `On ${kit.canvasName(c)}, if the mouse is in the ${name} part, make ${S} equal ${big}.`,
              `In every other case, make ${S} equal ${small}.`,
              `Draw a circle that is ${S} wide and ${S} tall on top of the background.`,
            ])}`,
            prefix: DRAW_PREFIX,
            movable: ['background(220)'].concat(
              chainLines([{ cond: kit.quadCond(name, c), body: `${S} = ${big}` }], `${S} = ${small}`),
              [`ellipse(${c.cx}, ${c.cy}, ${S}, ${S})`],
            ),
            suffix: DRAW_SUFFIX,
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${S}`, 'function setup(){', `  createCanvas(${c.w}, ${c.h})`, `  ${S} = 100`, '}'],
              vectors: kit.mouseVectors(c.w, c.h, [c.cx], [c.cy]),
            },
            explain: 'background() has to come before ellipse(), or it paints over the circle. Each size goes right after its condition.',
          });
        },
      },
    ],
  };

  CC.defineLesson({
    id: 'U2LA1.3',
    title: 'Logical Operators And/Or',
    unit: 2,
    source: 'curriculum/02-unit-2/04-U2LA1.3-Logical-Operators-And-Or.md',
    defaults: {
      minutes: 20, questions: 12, attempts: 2, practice: true,
    },
    notYetTaught: [
      [/\breturn\b/, 'return values (U2LA3.2)'],
      [/\bfor\b\s*\(|\bwhile\b\s*\(/, 'loops (Unit 3)'],
      [/\[/, 'arrays (Unit 3)'],
      [/!\w/, 'the ! operator'],
      [/\btrue\b|\bfalse\b/, 'boolean values in code'],
    ],
    slots: [
      truthSlot, translateSlot, explainSlot, regionSlot,
      traceChainSlot, traceMouseSlot, flowSlot, bugSlot,
      blanksCondSlot, blanksChainSlot, parsonsOffSlot, parsonsCanvasSlot,
    ],
    // When a teacher asks for fewer questions, slots are used in this order so a short
    // test still covers concepts, code flow, and writing code.
    priority: [
      'parsonsOff', 'blanksCond', 'traceChain', 'truth', 'region', 'flow',
      'blanksChain', 'bug', 'translate', 'traceMouse', 'parsonsCanvas', 'explain',
    ],
  });
})(CodeCheck);


// ---- src/lessons/u2la2-1.js ----
// U2LA2.1: Draw with Mouse
// curriculum/02-unit-2/06-U2LA2.1-Draw-with-Mouse.md
//
// Students at this point have seen: everything through U2LA1.3, plus setup() running once
// and draw() repeating, frameCount, background in setup versus draw, pmouseX/pmouseY, and
// object literals with dot notation.
// They have NOT seen: map(), typeof, return values, mouseIsPressed, key presses, loops, or arrays.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const {
    tok, log, chainLines, ifBlock, numberedRules, WHY,
  } = kit;

  const COUNTER_NAMES = ['counter', 'total', 'tally', 'steps'];
  const report = (expr) => `function __report(){\n  console.log(${expr})\n}`;
  const nFrames = (n) => Array.from({ length: n }, () => ({}));

  const framesSlot = {
    id: 'frames',
    skill: 'flow',
    concept: 'Knowing that setup() runs once and draw() keeps repeating',
    patterns: [
      {
        id: 'count-in-draw',
        make(r) {
          const name = r.pick(COUNTER_NAMES);
          const step = r.int(2, 5);
          const n = r.int(3, 6);
          const code = [`let ${name} = 0`, '', 'function setup(){', '  createCanvas(400, 400)', '}', '', 'function draw(){', `  ${name} = ${name} + ${step}`, '}'];
          return kit.printedNumber({
            prompt: `p5 has run setup() and then run draw() ${n} times. What does ${name} hold now?`,
            code,
            run: `${code.join('\n')}\n${report(name)}`,
            vec: { frames: nFrames(n) },
            kind: 'sketch',
            explain: `draw() adds ${step} each time it runs, and it has run ${n} times: ${n} × ${step} = ${n * step}.`,
          });
        },
      },
      {
        id: 'start-in-setup',
        make(r) {
          const name = r.pick(COUNTER_NAMES);
          const start = 10 * r.int(1, 5);
          const step = r.int(2, 5);
          const n = r.int(3, 6);
          const code = [`let ${name}`, '', 'function setup(){', '  createCanvas(400, 400)', `  ${name} = ${start}`, '}', '', 'function draw(){', `  ${name} = ${name} + ${step}`, '}'];
          return kit.printedNumber({
            prompt: `p5 has run setup() and then run draw() ${n} times. What does ${name} hold now?`,
            code,
            run: `${code.join('\n')}\n${report(name)}`,
            vec: { frames: nFrames(n) },
            kind: 'sketch',
            explain: `setup() runs once and sets ${name} to ${start}. Then draw() adds ${step} a total of ${n} times.`,
          });
        },
      },
      {
        id: 'made-new-inside-draw',
        make(r) {
          const name = r.pick(COUNTER_NAMES);
          const start = r.int(1, 9);
          const step = r.int(2, 5);
          const n = r.int(3, 6);
          const code = ['function draw(){', `  let ${name} = ${start}`, `  ${name} = ${name} + ${step}`, `  console.log(${name})`, '}'];
          return kit.printedNumber({
            prompt: `p5 has run draw() ${n} times. What is the last number printed?`,
            code,
            vec: { frames: nFrames(n) },
            kind: 'sketch',
            explain: `The variable is created again each time draw() runs, so it starts over at ${start} on every frame.`,
          });
        },
      },
      {
        id: 'waits-for-frame-count',
        make(r) {
          const name = r.pick(COUNTER_NAMES);
          const wait = r.int(1, 3);
          const n = wait + r.int(2, 4);
          const code = [`let ${name} = 0`, '', 'function draw(){'].concat(ifBlock(`frameCount > ${wait}`, `${name} = ${name} + 1`).map((l) => `  ${l}`), ['}']);
          return kit.printedNumber({
            prompt: `p5 has run draw() ${n} times. What does ${name} hold now?`,
            code,
            run: `${code.join('\n')}\n${report(name)}`,
            vec: { frames: nFrames(n) },
            kind: 'sketch',
            explain: `frameCount goes up by 1 each frame, starting at 1. The condition is only true on frames after ${wait}, which is ${n - wait} of them.`,
          });
        },
      },
    ],
  };

  const ONE = 'One shape that follows the mouse';
  const TRAIL = 'A trail of shapes that builds up as the mouse moves';
  const STILL = 'One shape that stays in the same place';
  const NOTHING = 'Only the background, with no shape showing';
  const SEE_PROMPT = 'What do you see on the canvas as the mouse moves around?';
  const moving = [{ mouseX: 50, mouseY: 60 }, { mouseX: 120, mouseY: 90 }, { mouseX: 200, mouseY: 150 }, { mouseX: 260, mouseY: 40 }];
  const pickShape = (r, x, y) => {
    const size = 5 * r.int(2, 10);
    return r.chance(0.5) ? `ellipse(${x}, ${y}, ${size}, ${size})` : `rect(${x}, ${y}, ${size}, ${size})`;
  };
  const sketch = (setupLines, drawLines) => ['function setup(){', '  createCanvas(400, 400)']
    .concat(setupLines.map((l) => `  ${l}`), ['}', '', 'function draw(){'], drawLines.map((l) => `  ${l}`), ['}']);

  // The answer comes from playing the sketch with a moving mouse and looking at what is left.
  function seeQuestion(r, code, explain) {
    const { shapes, error } = CC.runCode(code.join('\n'), { mouseX: 10, mouseY: 10, frames: moving }, 'sketch');
    if (error) throw new Error(`Sketch failed: ${error}\n${code.join('\n')}`);
    const follows = shapes.length > 0 && shapes[shapes.length - 1][1][0] === moving[moving.length - 1].mouseX;
    let correct = NOTHING;
    if (shapes.length > 1) correct = TRAIL;
    else if (shapes.length === 1) correct = follows ? ONE : STILL;
    return kit.choiceQuestion(r, {
      prompt: SEE_PROMPT,
      code,
      correct,
      wrong: [ONE, TRAIL, STILL, NOTHING].filter((text) => text !== correct),
      explain,
    });
  }

  const backgroundSlot = {
    id: 'background',
    skill: 'concepts',
    concept: 'Knowing what background() does in setup() versus draw()',
    patterns: [
      {
        id: 'background-in-setup',
        make(r) {
          return seeQuestion(r, sketch([`background(${r.int(1, 25) * 10})`], [pickShape(r, 'mouseX', 'mouseY')]),
            'The background only paints once, so every shape draw() makes stays on the canvas.');
        },
      },
      {
        id: 'background-in-draw',
        make(r) {
          return seeQuestion(r, sketch([], [`background(${r.int(1, 25) * 10})`, pickShape(r, 'mouseX', 'mouseY')]),
            'Each frame paints a fresh background over the old shape, then draws one new shape at the mouse.');
        },
      },
      {
        id: 'shape-does-not-use-the-mouse',
        make(r) {
          return seeQuestion(r, sketch([], [`background(${r.int(1, 25) * 10})`, pickShape(r, 10 * r.int(5, 30), 10 * r.int(5, 30))]),
            'The shape is drawn over and over, but always with the same numbers, so it never appears to move.');
        },
      },
      {
        id: 'background-after-the-shape',
        make(r) {
          return seeQuestion(r, sketch([], [pickShape(r, 'mouseX', 'mouseY'), `background(${r.int(1, 25) * 10})`]),
            'Code runs top to bottom. The background gets painted after the shape, so it covers the shape on every frame.');
        },
      },
    ],
  };

  const ONCE = 'Once';
  const REPEATS = 'Every frame';
  const WHEN_OPTIONS = [{ text: ONCE }, { text: REPEATS }];

  function whenRows(r, { setupLines, drawLines, explain }) {
    const rows = setupLines.map((line) => ({ cells: [line], answer: 0 }))
      .concat(drawLines.map((line) => ({ cells: [line], answer: 1 })));
    return kit.rowsQuestion({
      prompt: 'How often does each line run?',
      code: sketch(setupLines.slice(1), drawLines),
      columns: ['Line of code'],
      rows: r.shuffle(rows),
      options: WHEN_OPTIONS,
      explain,
    });
  }

  const whenSlot = {
    id: 'whenItRuns',
    skill: 'concepts',
    concept: 'Telling what runs once from what runs every frame',
    patterns: [
      {
        id: 'background-in-setup',
        make(r) {
          return whenRows(r, {
            setupLines: ['createCanvas(400, 400)', `background(${r.int(1, 25) * 10})`],
            drawLines: [pickShape(r, 'mouseX', 'mouseY'), `strokeWeight(${r.int(2, 9)})`],
            explain: 'p5 calls setup() once when the sketch starts. It calls draw() over and over after that.',
          });
        },
      },
      {
        id: 'background-in-draw',
        make(r) {
          return whenRows(r, {
            setupLines: ['createCanvas(400, 400)', `strokeWeight(${r.int(2, 9)})`],
            drawLines: [`background(${r.int(1, 25) * 10})`, pickShape(r, 'mouseX', 'mouseY')],
            explain: 'p5 calls setup() once when the sketch starts. It calls draw() over and over after that.',
          });
        },
      },
      {
        id: 'line-tool',
        make(r) {
          return whenRows(r, {
            setupLines: ['createCanvas(400, 400)', `background(${r.int(1, 25) * 10})`],
            drawLines: [`strokeWeight(${r.int(2, 9)})`, 'line(mouseX, mouseY, pmouseX, pmouseY)'],
            explain: 'Only lines inside draw() repeat. That is why the line keeps following the mouse.',
          });
        },
      },
    ],
  };

  // ---- pmouseX and pmouseY ----

  const pathOf = (r) => {
    const value = () => 10 * r.int(1, 39);
    return [{ mouseX: value(), mouseY: value() }, { mouseX: value(), mouseY: value() }, { mouseX: value(), mouseY: value() }];
  };
  const pathText = (path) => path.map((p, i) => `Frame ${i + 1}: mouseX = ${p.mouseX}, mouseY = ${p.mouseY}`).join('\n');

  const pmouseSlot = {
    id: 'pmouse',
    skill: 'flow',
    concept: 'Using pmouseX and pmouseY, the mouse position from the frame before',
    patterns: [
      {
        id: 'value-of-pmouse',
        make(r) {
          const path = pathOf(r);
          const name = r.pick(['pmouseX', 'pmouseY']);
          return kit.printedNumber({
            prompt: `The mouse was at these positions on three frames in a row:\n${pathText(path)}\nWhat is ${name} during frame 3?`,
            code: ['function draw(){', `  console.log(${name})`, '}'],
            vec: { mouseX: path[0].mouseX, mouseY: path[0].mouseY, frames: path },
            kind: 'sketch',
            explain: `${name} holds the position from the frame before, so on frame 3 it holds the value from frame 2.`,
          });
        },
      },
      {
        id: 'how-far-it-moved',
        make(r) {
          const path = pathOf(r);
          const axis = r.pick(['X', 'Y']);
          return kit.printedNumber({
            prompt: `The mouse was at these positions on three frames in a row:\n${pathText(path)}\nWhat is the last number printed?`,
            code: ['function draw(){', `  console.log(mouse${axis} - pmouse${axis})`, '}'],
            vec: { mouseX: path[0].mouseX, mouseY: path[0].mouseY, frames: path },
            kind: 'sketch',
            explain: `On frame 3, mouse${axis} is the value from frame 3 and pmouse${axis} is the value from frame 2. The answer can be negative.`,
          });
        },
      },
      {
        id: 'ends-of-the-line',
        make(r) {
          const path = pathOf(r);
          const [, b, c] = path;
          const point = (p) => `(${p.mouseX}, ${p.mouseY})`;
          const correct = `From ${point(c)} to ${point(b)}`;
          return kit.choiceQuestion(r, {
            prompt: `The mouse was at these positions on three frames in a row:\n${pathText(path)}\nWhat line does this code draw during frame 3?`,
            code: ['line(mouseX, mouseY, pmouseX, pmouseY)'],
            correct,
            wrong: [`From ${point(c)} to ${point(c)}`, `From ${point(b)} to ${point(path[0])}`, `From ${point(c)} to ${point(path[0])}`],
            explain: 'It connects where the mouse is now to where it was one frame ago. Doing that on every frame makes a smooth line.',
          });
        },
      },
      {
        id: 'why-a-line',
        make(r) {
          const size = 5 * r.int(1, 4);
          const weight = r.int(2, 8);
          return kit.choiceQuestion(r, {
            prompt: 'A student moves the mouse quickly. Which of these keeps the drawing connected with no gaps, and why?',
            code: ['function draw(){', `  strokeWeight(${weight})`, `  ellipse(mouseX, mouseY, ${size}, ${size})`, '  /\/ or', '  line(mouseX, mouseY, pmouseX, pmouseY)', '}'],
            correct: 'The line, because it connects the mouse\'s last position to its current one',
            wrong: [
              'The ellipse, because it is drawn at the exact mouse position',
              'The line, because it is drawn more often than the ellipse',
              'Both, because draw() runs fast enough that the mouse can never skip anywhere',
            ],
            explain: 'A fast mouse jumps between frames, so single shapes leave gaps. A line fills the space between the two positions.',
          });
        },
      },
    ],
  };

  // ---- Object literals ----

  const OBJECTS = [
    { names: ['theLine', 'myLine', 'penLine'], props: [['weight', [2, 3, 5, 8, 10]], ['red', [0, 100, 255]], ['green', [0, 100, 255]], ['blue', [0, 100, 255]], ['opacity', [50, 100, 200]]] },
    { names: ['theCircle', 'myCircle', 'dot'], props: [['size', [20, 50, 80, 100]], ['x', [100, 150, 200]], ['y', [100, 150, 200]], ['gray', [0, 100, 200]]] },
    { names: ['brush', 'myBrush', 'marker'], props: [['thickness', [2, 4, 6, 8]], ['red', [0, 100, 255]], ['alpha', [50, 100, 200]], ['size', [10, 20, 30]]] },
    { names: ['player', 'hero', 'runner'], props: [['score', [10, 20, 30, 40]], ['lives', [1, 2, 3]], ['level', [1, 2, 3, 4]], ['coins', [5, 10, 15]]] },
    { names: ['sneaker', 'myShoe', 'kick'], props: [['size', [7, 8, 9, 10]], ['laces', [2, 4, 6]], ['price', [40, 60, 80]]] },
  ];

  function pickObject(r, count) {
    const base = r.pick(OBJECTS);
    const props = r.sample(base.props, count).map(([key, values]) => ({ key, value: r.pick(values), values }));
    return { name: r.pick(base.names), props, keys: base.props.map((p) => p[0]) };
  }

  const objectLines = (o) => [`let ${o.name} = {`]
    .concat(o.props.map((p, i) => `  ${p.key}: ${p.value}${i < o.props.length - 1 ? ',' : ''}`), ['}']);

  const readSlot = {
    id: 'objectRead',
    skill: 'flow',
    concept: 'Reading and changing values in an object',
    patterns: [
      {
        id: 'read-one-key',
        make(r) {
          const o = pickObject(r, 3);
          const p = r.pick(o.props);
          return kit.printedNumber({
            prompt: 'What number does this code print?',
            code: objectLines(o).concat([`console.log(${o.name}.${p.key})`]),
            explain: `${o.name}.${p.key} gets the value stored with the key ${p.key}.`,
          });
        },
      },
      {
        id: 'change-then-read',
        make(r) {
          const o = pickObject(r, 3);
          const p = r.pick(o.props);
          const next = p.value + 5 * r.int(1, 4);
          return kit.printedNumber({
            prompt: 'What number does this code print?',
            code: objectLines(o).concat([`${o.name}.${p.key} = ${next}`, `console.log(${o.name}.${p.key})`]),
            explain: `The value starts as ${p.value}, then ${o.name}.${p.key} = ${next} replaces it.`,
          });
        },
      },
      {
        id: 'math-with-two-keys',
        make(r) {
          const o = pickObject(r, 3);
          const [a, b] = r.sample(o.props, 2);
          return kit.printedNumber({
            prompt: 'What number does this code print?',
            code: objectLines(o).concat([`console.log(${o.name}.${a.key} + ${o.name}.${b.key})`]),
            explain: `Each key gives its own value: ${a.value} + ${b.value}.`,
          });
        },
      },
      {
        id: 'changed-by-the-mouse',
        make(r) {
          const o = pickObject(r, 2);
          const p = o.props[0];
          const c = r.pick(kit.CANVASES);
          const [low, high] = r.pick([[5, 10], [2, 8], [20, 50]]);
          const mouseX = c.cx + 10 * r.pick([-5, -3, 3, 5]);
          return kit.printedNumber({
            prompt: `The mouse is at mouseX = ${mouseX}. What number does this code print?`,
            code: objectLines(o).concat(
              chainLines([{ cond: `mouseX > ${c.cx}`, body: `${o.name}.${p.key} = ${high}` }], `${o.name}.${p.key} = ${low}`),
              [`console.log(${o.name}.${p.key})`],
            ),
            vec: { mouseX },
            explain: `Check mouseX > ${c.cx}, and then the matching line replaces the value of ${p.key}.`,
          });
        },
      },
    ],
  };

  const ROLE_OPTIONS = [{ text: 'object name' }, { text: 'key' }, { text: 'value' }];

  const objectConceptSlot = {
    id: 'objectConcept',
    skill: 'concepts',
    concept: 'Knowing how object literals are written',
    patterns: [
      {
        id: 'name-the-parts',
        make(r) {
          const o = pickObject(r, 2);
          const [a, b] = o.props;
          return kit.rowsQuestion({
            prompt: 'What is each of these in the object below?',
            code: objectLines(o),
            columns: ['Part'],
            rows: r.shuffle([
              { cells: [o.name], answer: 0 },
              { cells: [a.key], answer: 1 },
              { cells: [String(a.value)], answer: 2 },
              { cells: [b.key], answer: 1 },
            ]),
            options: ROLE_OPTIONS,
            explain: 'An object is a list of key and value pairs in curly brackets, stored in a variable. Each key is followed by a colon and its value.',
          });
        },
      },
      {
        id: 'get-a-value',
        make(r) {
          const o = pickObject(r, 2);
          const { key } = o.props[0];
          return kit.choiceQuestion(r, {
            prompt: `Which of these gets the value of ${key} from this object?`,
            code: objectLines(o),
            correct: `${o.name}.${key}`,
            wrong: [`${key}.${o.name}`, `${o.name}(${key})`, `${key}`],
            codeOptions: true,
            explain: 'Use dot notation: the object name, a dot, and then the key.',
          });
        },
      },
      {
        id: 'change-a-value',
        make(r) {
          const o = pickObject(r, 2);
          const { key } = o.props[0];
          const next = 5 * r.int(5, 20);
          return kit.choiceQuestion(r, {
            prompt: `Which line changes ${key} to ${next}?`,
            code: objectLines(o),
            correct: `${o.name}.${key} = ${next}`,
            wrong: [`${o.name}.${key} == ${next}`, `${key} = ${next}`, `${o.name} = ${next}`],
            codeOptions: true,
            explain: `Assign to the key the same way as a variable. ${o.name} = ${next} would replace the whole object with a number.`,
          });
        },
      },
      {
        id: 'correctly-written',
        make(r) {
          const o = pickObject(r, 2);
          const [a, b] = o.props;
          return kit.choiceQuestion(r, {
            prompt: 'Which of these is written correctly?',
            correct: `let ${o.name} = {\n  ${a.key}: ${a.value},\n  ${b.key}: ${b.value}\n}`,
            wrong: [
              `let ${o.name} = {\n  ${a.key} = ${a.value},\n  ${b.key} = ${b.value}\n}`,
              `let ${o.name} = {\n  ${a.key}: ${a.value}\n  ${b.key}: ${b.value}\n}`,
              `let ${o.name} = (\n  ${a.key}: ${a.value},\n  ${b.key}: ${b.value}\n)`,
            ],
            codeOptions: true,
            explain: 'Objects use curly brackets. A colon goes between each key and its value, and a comma goes between pairs.',
          });
        },
      },
    ],
  };

  const FIND_BUG = 'Tap the line with the bug, then choose why it is wrong.';
  const BACKGROUND_WHY = 'background() repaints the whole canvas on every frame here, which erases the earlier shapes.';
  const REASONS = [WHY.objectEquals, WHY.objectComma, WHY.wrongKey, WHY.dotOrder, BACKGROUND_WHY];
  const others = (r, why) => r.sample(REASONS.filter((reason) => reason !== why), 3);

  const bugSlot = {
    id: 'bug',
    skill: 'flow',
    concept: 'Finding and explaining bugs with objects and drawing',
    patterns: [
      {
        id: 'equals-in-object',
        make(r) {
          const o = pickObject(r, 2);
          const [a, b] = o.props;
          const print = `console.log(${o.name}.${a.key})`;
          return kit.bugQuestion(r, {
            prompt: `This code should print ${a.value}. ${FIND_BUG}`,
            code: [`let ${o.name} = {`, `  ${a.key} = ${a.value},`, `  ${b.key}: ${b.value}`, '}', print],
            bugLines: [1],
            why: WHY.objectEquals,
            others: others(r, WHY.objectEquals),
            fixed: objectLines(o).concat([print]),
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `It should be ${a.key}: ${a.value},`,
          });
        },
      },
      {
        id: 'missing-comma',
        make(r) {
          const o = pickObject(r, 2);
          const [a, b] = o.props;
          const print = `console.log(${o.name}.${b.key})`;
          return kit.bugQuestion(r, {
            prompt: `This code should print ${b.value}. ${FIND_BUG}`,
            code: [`let ${o.name} = {`, `  ${a.key}: ${a.value}`, `  ${b.key}: ${b.value}`, '}', print],
            bugLines: [1, 2],
            why: WHY.objectComma,
            others: others(r, WHY.objectComma),
            fixed: objectLines(o).concat([print]),
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `Pairs are separated by commas: ${a.key}: ${a.value},`,
          });
        },
      },
      {
        id: 'wrong-key',
        make(r) {
          const o = pickObject(r, 2);
          const { key, value } = o.props[0];
          const wrongCase = key[0].toUpperCase() + key.slice(1);
          return kit.bugQuestion(r, {
            prompt: `This code should print ${value}, but it prints undefined. ${FIND_BUG}`,
            code: objectLines(o).concat([`console.log(${o.name}.${wrongCase})`]),
            bugLines: [objectLines(o).length],
            why: WHY.wrongKey,
            others: others(r, WHY.wrongKey),
            fixed: objectLines(o).concat([`console.log(${o.name}.${key})`]),
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `Capital letters count. The key is ${key}, not ${wrongCase}.`,
          });
        },
      },
      {
        id: 'backwards-dot',
        make(r) {
          const o = pickObject(r, 2);
          const { key, value } = o.props[0];
          return kit.bugQuestion(r, {
            prompt: `This code should print ${value}. ${FIND_BUG}`,
            code: objectLines(o).concat([`console.log(${key}.${o.name})`]),
            bugLines: [objectLines(o).length],
            why: WHY.dotOrder,
            others: others(r, WHY.dotOrder),
            fixed: objectLines(o).concat([`console.log(${o.name}.${key})`]),
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `It should be ${o.name}.${key}`,
          });
        },
      },
      {
        id: 'background-erases-the-drawing',
        make(r) {
          const gray = r.int(1, 25) * 10;
          const fixed = sketch([`background(${gray})`], ['line(mouseX, mouseY, pmouseX, pmouseY)']);
          const code = sketch([], [`background(${gray})`, 'line(mouseX, mouseY, pmouseX, pmouseY)']);
          return kit.bugQuestion(r, {
            prompt: `This drawing tool should leave a line behind as the mouse moves, but only a tiny piece of line ever shows. ${FIND_BUG}`,
            code,
            bugLines: [code.indexOf(`  background(${gray})`)],
            why: BACKGROUND_WHY,
            others: others(r, BACKGROUND_WHY),
            fixed,
            spec: { kind: 'sketch', vectors: [{ mouseX: 10, mouseY: 10, frames: moving }] },
            explain: 'Move background() into setup(), so it only paints once.',
          });
        },
      },
    ],
  };

  const blanksSlot = {
    id: 'blanks',
    skill: 'build',
    concept: 'Completing code that uses an object',
    patterns: [
      {
        id: 'write-an-object',
        make(r) {
          const o = pickObject(r, 2);
          const [a, b] = o.props;
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so the object holds ${a.key} as ${a.value} and ${b.key} as ${b.value}, and it prints ${a.key}.`,
            lines: [
              [`let ${o.name} = {`],
              ['  ', tok(a.key, 'key'), tok(':', 'punct'), ` ${a.value}`, tok(',', 'punct')],
              ['  ', tok(b.key, 'key'), tok(':', 'punct'), ` ${b.value}`],
              ['}'],
              ['console.log(', tok(o.name, 'obj'), tok('.', 'punct'), tok(a.key, 'key'), ')'],
            ],
            must: ['punct', 'key'],
            count: 3,
            pools: { punct: [':', ',', '.', '='], key: o.keys, obj: ['size', 'value', o.name] },
            spec: { kind: 'snippet', vectors: [{}] },
            explain: 'Each pair is key: value, with commas between pairs. To read one, use the object name, a dot, and the key.',
          });
        },
      },
      {
        id: 'change-and-use',
        make(r) {
          const o = pickObject(r, 2);
          const [a, b] = o.props;
          const next = a.value + 5 * r.int(1, 4);
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so ${a.key} changes to ${next}, and then it prints ${a.key}.`,
            lines: objectLines(o).map((text) => ({ text })).concat([
              [tok(o.name, 'obj'), tok('.', 'punct'), tok(a.key, 'key'), ' ', tok('=', 'punct'), ' ', tok(next, 'num')],
              ['console.log(', tok(o.name, 'obj'), '.', tok(a.key, 'key'), ')'],
            ]),
            must: ['key', 'obj'],
            count: 3,
            pools: {
              punct: ['==', ':', ','], key: [a.key, b.key], obj: [o.name, a.key], num: [a.value, next + 5],
            },
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `${o.name}.${a.key} = ${next} replaces the value. Then reading it gives the new value.`,
          });
        },
      },
      {
        id: 'drawing-tool',
        make(r) {
          const gray = r.int(1, 25) * 10;
          const weight = r.int(2, 9);
          return kit.blanksQuestion(r, {
            prompt: `Complete this drawing tool. It should paint the background once, and then draw a line from the mouse to where it was one frame ago.`,
            lines: [
              ['function ', tok('setup', 'fn'), '(){'],
              ['  createCanvas(400, 400)'],
              [`  background(${gray})`],
              ['}'],
              ['function ', tok('draw', 'fn'), '(){'],
              [`  strokeWeight(${weight})`],
              ['  line(', tok('mouseX', 'pos'), ', ', tok('mouseY', 'pos'), ', ', tok('pmouseX', 'pos'), ', ', tok('pmouseY', 'pos'), ')'],
              ['}'],
            ],
            must: ['fn', 'pos'],
            count: 4,
            pools: { fn: ['setup', 'draw'], pos: ['mouseX', 'mouseY', 'pmouseX', 'pmouseY'] },
            spec: { kind: 'sketch', vectors: [{ mouseX: 10, mouseY: 10, frames: moving }] },
            explain: 'setup() runs once, so the background belongs there. pmouseX and pmouseY hold where the mouse was on the frame before.',
          });
        },
      },
      {
        id: 'weight-by-the-mouse',
        make(r) {
          const o = pickObject(r, 2);
          const p = o.props[0];
          const c = r.pick(kit.CANVASES);
          const [low, high] = r.pick([[5, 10], [2, 8], [20, 50]]);
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so ${p.key} becomes ${high} when the mouse is on the right side of ${kit.canvasName(c)}, and ${low} otherwise.`,
            lines: objectLines(o).map((text) => ({ text })).concat([
              ['if(', tok('mouseX', 'pos'), ' ', tok('>', 'op'), ' ', tok(c.cx, 'num'), '){'],
              ['  ', tok(o.name, 'obj'), tok('.', 'punct'), tok(p.key, 'key'), ` = ${high}`],
              ['}'],
              ['else{'],
              ['  ', tok(o.name, 'obj'), '.', tok(p.key, 'key'), ` = ${low}`],
              ['}'],
            ]),
            must: ['key', 'op'],
            count: 4,
            pools: {
              pos: ['mouseX', 'mouseY'], op: ['<', '=='], num: [c.cx, c.cx + 50, c.cx + 100], obj: [o.name, p.key], punct: [':', ','], key: o.keys,
            },
            spec: {
              kind: 'snippet',
              hiddenSuffix: [`console.log(${o.name}.${p.key})`],
              vectors: kit.mouseVectors(c.w, c.h, [c.cx], [c.cy]),
            },
            explain: `A bigger mouseX is further right, and ${o.name}.${p.key} = changes the value of that key.`,
          });
        },
      },
    ],
  };

  const scramble = (rules) => `Put these lines in order so the code does this:\n${numberedRules(rules)}`;

  const parsonsSlot = {
    id: 'parsons',
    skill: 'build',
    concept: 'Putting a sketch with an object in order',
    patterns: [
      {
        id: 'object-in-setup',
        make(r) {
          const name = r.pick(['theLine', 'myLine', 'penLine']);
          const weight = r.int(2, 9);
          const red = r.pick([100, 150, 255]);
          const gray = r.int(1, 25) * 10;
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `In setup(), make the canvas and paint a background of ${gray} once.`,
              `Also in setup(), make ${name} an object with a weight of ${weight} and a red of ${red}.`,
              `In draw(), set the stroke weight from ${name}, then draw a line from the mouse to where it was one frame ago.`,
            ]),
            prefix: [{ text: `let ${name}` }, { text: 'function setup(){' }],
            movable: [
              'createCanvas(400, 400)',
              `background(${gray})`,
              `${name} = {`,
              `weight: ${weight},`,
              `red: ${red}`,
              '}',
              '}',
              'function draw(){',
              `strokeWeight(${name}.weight)`,
              'line(mouseX, mouseY, pmouseX, pmouseY)',
            ],
            suffix: [{ text: '}' }],
            spec: { kind: 'sketch', vectors: [{ mouseX: 10, mouseY: 10, frames: moving }] },
            explain: 'Things that happen once go in setup(). The object has to exist before draw() uses it, and the stroke weight gets set before the line is drawn.',
          });
        },
      },
      {
        id: 'weight-changes-with-the-mouse',
        make(r) {
          const name = r.pick(['theLine', 'myLine', 'penLine']);
          const c = r.pick(kit.CANVASES);
          const [low, high] = r.pick([[5, 10], [2, 8], [3, 12]]);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `On ${kit.canvasName(c)}, if the mouse is on the right side, make ${name}.weight ${high}. Otherwise, make it ${low}.`,
              `Then set the stroke weight from ${name}.`,
              'Then draw a line from the mouse to where it was one frame ago.',
            ]),
            prefix: [{ text: 'function draw(){' }],
            movable: chainLines(
              [{ cond: `mouseX > ${c.cx}`, body: `${name}.weight = ${high}` }],
              `${name}.weight = ${low}`,
            ).concat([`strokeWeight(${name}.weight)`, 'line(mouseX, mouseY, pmouseX, pmouseY)']),
            suffix: [{ text: '}' }],
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${name} = {`, '  weight: 1', '}'],
              vectors: [
                { mouseX: 10, mouseY: 10, frames: [{ mouseX: c.cx + 20, mouseY: 30 }, { mouseX: c.cx - 20, mouseY: 40 }, { mouseX: c.cx + 40, mouseY: 50 }] },
              ],
            },
            explain: 'Change the value first, then use it. The line needs the stroke weight set before it is drawn.',
          });
        },
      },
      {
        id: 'circle-from-an-object',
        make(r) {
          const name = r.pick(['theCircle', 'myCircle', 'dot']);
          const size = r.pick([20, 30, 40, 60]);
          const gray = r.int(1, 25) * 10;
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `Make ${name} an object with a size of ${size} and a gray of ${gray}.`,
              'In setup(), make the canvas.',
              `In draw(), paint a white background, fill with ${name}.gray, and draw a circle at the mouse that is ${name}.size wide and tall.`,
            ]),
            prefix: [],
            movable: [
              `let ${name} = {`,
              `size: ${size},`,
              `gray: ${gray}`,
              '}',
              'function setup(){',
              'createCanvas(400, 400)',
              '}',
            ],
            suffix: [
              { text: 'function draw(){' },
              { text: '  background(255)' },
              { text: `  fill(${name}.gray)` },
              { text: `  ellipse(mouseX, mouseY, ${name}.size, ${name}.size)` },
              { text: '}' },
            ],
            spec: { kind: 'sketch', vectors: [{ mouseX: 10, mouseY: 10, frames: moving }] },
            explain: 'An object is written with a colon between each key and value, and commas between pairs. setup() gets its own brackets.',
          });
        },
      },
      {
        id: 'clear-each-frame',
        make(r) {
          const name = r.pick(['theCircle', 'myCircle', 'dot']);
          const a = r.pick([20, 30, 40]);
          const b = a + r.pick([20, 40, 60]);
          const c = r.pick(kit.CANVASES);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `Paint a gray background on every frame, so only one circle ever shows.`,
              `On ${kit.canvasName(c)}, if the mouse is in the bottom half, make ${name}.size ${b}. Otherwise, make it ${a}.`,
              `Draw a circle at the mouse using ${name}.size for its width and height.`,
            ]),
            prefix: [{ text: 'function draw(){' }],
            movable: ['background(220)'].concat(
              chainLines([{ cond: `mouseY > ${c.cy}`, body: `${name}.size = ${b}` }], `${name}.size = ${a}`),
              [`ellipse(mouseX, mouseY, ${name}.size, ${name}.size)`],
            ),
            suffix: [{ text: '}' }],
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${name} = {`, '  size: 1', '}'],
              vectors: [{ mouseX: 10, mouseY: 10, frames: [{ mouseX: 30, mouseY: c.cy + 20 }, { mouseX: 40, mouseY: c.cy - 20 }, { mouseX: 50, mouseY: c.cy + 40 }] }],
            },
            explain: 'background() has to come before the circle, or it covers it. The size has to be set before the circle uses it.',
          });
        },
      },
    ],
  };

  CC.defineLesson({
    id: 'U2LA2.1',
    title: 'Draw with Mouse',
    unit: 2,
    source: 'curriculum/02-unit-2/06-U2LA2.1-Draw-with-Mouse.md',
    defaults: {
      minutes: 20, questions: 12, attempts: 2, practice: false,
    },
    notYetTaught: [
      [/\bmap\(/, 'map() (U2LA2.2)'],
      [/typeof/, 'typeof (U2LA3.1)'],
      [/\breturn\b/, 'return values (U2LA3.2)'],
      [/mouseIsPressed|mousePressed|keyIsPressed/, 'clicks and keys (U2LA4.2 and U2LA5.1)'],
      [/\bfor\b\s*\(|\bwhile\b\s*\(/, 'loops (Unit 3)'],
      [/\[/, 'arrays (Unit 3)'],
    ],
    slots: [backgroundSlot, whenSlot, objectConceptSlot, framesSlot, pmouseSlot, readSlot, bugSlot, blanksSlot, parsonsSlot],
    priority: ['parsons', 'frames', 'background', 'blanks', 'objectRead', 'pmouse', 'bug', 'objectConcept', 'whenItRuns'],
  });
})(CodeCheck);


// ---- src/lessons/u2la2-2.js ----
// U2LA2.2: The Map Function
// curriculum/02-unit-2/07-U2LA2.2-The-Map-Function.md
//
// Students at this point have seen: everything through U2LA2.1, plus map() converting a
// value from one range to another, and mapped values stored in variables or objects.
// They have NOT seen: typeof, return values, mouseIsPressed, key presses, loops, or arrays.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const { tok, numberedRules } = kit;

  // Canvas sizes and output ranges that divide evenly, so students can work the answers out.
  const WIDTHS = [400, 500, 600, 800];
  const OUTPUTS = [100, 200, 400, 60, 80, 1000];
  const FRACTIONS = [[1, 4], [1, 2], [3, 4]];
  const VAR_NAMES = ['bright', 'shade', 'level', 'amount'];
  const SIZE_NAMES = ['circleSize', 'dotSize', 'ballSize'];

(function (CC) {

  const kit = CC.kit;

  const TYPES = ['string', 'number', 'boolean', 'object'];

  const typeOf = (expr, vars) => CC.evalExpr(`typeof (${expr})`, vars || {});

  const WORDS = ['Rebecca', 'cat', 'Hello', 'p5', 'blue', 'Saturday', 'CS rocks', 'dog'];
  const NUMBER_WORDS = [['5', 5], ['42', 42], ['100', 100], ['3.14', 3.14], ['0', 0]];

  const makeObject = (r) => r.pick([
    `{ size: ${r.int(1, 20)} }`,
    `{ x: ${r.int(1, 99)}, y: ${r.int(1, 99)} }`,

    prompt, code, items, vars, explain, column,
  }) {
    return kit.rowsQuestion({
      prompt: prompt || 'What data type is each of these?',
      code,
      columns: [column || 'Data'],
      rows: r.shuffle(items).map((expr) => ({ cells: [expr], answer: TYPES.indexOf(typeOf(expr, vars)) })),
      options: TYPE_OPTIONS,
      explain,

          const lines = (returned) => [`function ${fn}(${a}, ${b}){`, `  let ${ans} = ${a} + ${b}`, `  return ${returned}`, '}', `console.log(${fn}(${x}, ${y}))`];
          return kit.bugQuestion(r, {
            prompt: `This function should return the sum of its inputs, so this code should print ${x + y}. ${FIND_BUG}`,
            code: lines(a),
            bugLines: [2],
            why: WRONG_VALUE,
            others: others(r, WRONG_VALUE),
            fixed: lines(ans),
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `It should be return ${ans}.`,
          });
        },
      },
      {
        id: 'arguments-out-of-order',
        make(r) {
          const fn = r.pick(['subtract', 'takeAway', 'difference']);
          const [a, b] = r.pick(PARAM_SETS);
          const x = r.int(11, 20);
          const y = r.int(2, 9);
          const lines = (first, second) => [`function ${fn}(${a}, ${b}){`, `  return ${a} - ${b}`, '}', `console.log(${fn}(${first}, ${second}))`];
          return kit.bugQuestion(r, {
            prompt: `This code should print ${x - y} by taking ${y} away from ${x}. ${FIND_BUG}`,
            code: lines(y, x),
            bugLines: [3],
            why: WHY.argOrder,
            others: others(r, WHY.argOrder),
            fixed: lines(x, y),
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `${a} is first and ${b} is second, so the call should be ${fn}(${x}, ${y}).`,

        },
      },
      {
        id: 'variable-used-outside',
        make(r) {
          const m = mystery(r);
          const head = [`function ${m.fn}(${m.list}){`, `  let ${m.ans} = ${m.formula}`, `  return ${m.ans}`, '}'];
          return kit.bugQuestion(r, {
            prompt: `This code should print the value the function returns. ${FIND_BUG}`,
            code: head.concat([`${m.fn}(${m.args.join(', ')})`, `console.log(${m.ans})`]),
            bugLines: [5],
            why: WHY.outOfScope,
            others: others(r, WHY.outOfScope),
            fixed: head.concat([`let answer = ${m.fn}(${m.args.join(', ')})`, 'console.log(answer)']),
            spec: { kind: 'snippet', vectors: [{}] },
            explain: `${m.ans} only exists inside the function. Store what the function returns, and print that instead.`,
          });
        },
      },
    ],
  };

  const blanksSlot = {
    id: 'blanks',
    skill: 'build',
    concept: 'Completing a function that returns a value',
    patterns: [
      {
        id: 'finish-the-function',

            must: ['word'],
            count: 3,
            pools: { word: ['console.log', 'let', 'function'], name: ['answer', a], param: [m.params[2], x] },
            spec: { kind: 'snippet', vectors: [{}] },

  const scramble = (rules) => `Put these lines in order so the code does this:\n${numberedRules(rules)}`;
  const inputsOf = (a, b) => [{ inputs: { a: 3, b: 8 } }, { inputs: { a: 9, b: 2 } }, { inputs: { a: 5, b: 5 } }].map((vec) => ({
    inputs: { [a]: vec.inputs.a, [b]: vec.inputs.b },

    id: 'parsons',

        id: 'two-steps',
        make(r) {
          const m = mystery(r);
          const [a, b] = m.params;

            prompt: scramble([
              `Inside ${m.fn}, store ${a} + ${b} in ${m.ans}.`,
              `Then change ${m.ans} to ${m.ans} * ${step}.`,
              `Then return ${m.ans}.`,
              'Outside the function, print what it returns.',
            ]),
            prefix: [{ text: `function ${m.fn}(${a}, ${b}){` }],
            movable: [`let ${m.ans} = ${a} + ${b}`, `${m.ans} = ${m.ans} * ${step}`, `return ${m.ans}`, '}', { text: `console.log(${m.fn}(4, 6))`, run: `console.log(${m.fn}(__in.${a}, __in.${b}))` }],
            spec: { kind: 'snippet', vectors: inputsOf(a, b) },
            explain: 'A variable has to exist before it can change. Any line after return would never run.',
          });
        },
      },
      {
        id: 'if-with-returns',
        make(r) {
          const fn = r.pick(['bigger', 'larger', 'maxOfTwo']);
          const [a, b] = r.pick(PARAM_SETS);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `If ${a} is greater than ${b}, return ${a}.`,
              `Otherwise, return ${b}.`,
              `Outside the function, print what it returns.`,
            ]),
            prefix: [{ text: `function ${fn}(${a}, ${b}){` }],
            movable: [`if(${a} > ${b}){`, `return ${a}`, '}', 'else{', `return ${b}`, '}', '}', { text: `console.log(${fn}(4, 6))`, run: `console.log(${fn}(__in.${a}, __in.${b}))` }],
            spec: { kind: 'snippet', vectors: inputsOf(a, b) },
            explain: 'Each return goes inside its own branch. The function closes after the whole if and else.',
          });
        },
      },
      {
        id: 'use-the-answer-twice',
        make(r) {
          const m = mystery(r);
          const [a] = m.params;
          const step = r.int(2, 6);
          const x = r.int(2, 9);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `Define ${m.fn}, which returns ${a} * ${step}.`,
              `Store ${m.fn}(${x}) in first.`,
              `Store ${m.fn}(first) in second.`,
              'Print second.',
            ]),
            movable: [`function ${m.fn}(${a}){`, `return ${a} * ${step}`, '}', `let first = ${m.fn}(${x})`, `let second = ${m.fn}(first)`, 'console.log(second)'],
            spec: { kind: 'snippet', vectors: [{}] },
            explain: 'first has to be stored before it can be passed in, and second has to be stored before it can print.',
          });
        },
      },
    ],
  };

  CC.defineLesson({
    id: 'U2LA3.2',
    title: 'Functions that Return Values',
    unit: 2,
    source: 'curriculum/02-unit-2/09-U2LA3.2-Functions-that-Return-Values.md',

      [/mouseIsPressed|mousePressed|keyIsPressed/, 'clicks and keys (U2LA4.2 and U2LA5.1)'],

})(CodeCheck);


// ---- src/lessons/u2la3-3.js ----
// U2LA3.3: Functions with Purpose
// curriculum/02-unit-2/10-U2LA3.3-Functions-with-Purpose.md
//
// Students at this point have seen: everything through U2LA3.2, plus writing functions from a
// prompt (like updateLight) and testing them with different inputs, in the CodeWars style.
// They have NOT seen: mouseIsPressed, key presses, loops, or arrays.
// The lesson marks itself as optional, so teachers may skip this test.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const { tok, WHY } = kit;

  const q = (word) => `"${word}"`;

  // Each kind of function: what it should do, its correct body, versions with a mistake, inputs
  // that exercise it, and specific bugs to hide in it.
  const SPECS = [
    {
      id: 'next-light',
      make(r) {
        const fn = r.pick(['updateLight', 'nextLight', 'changeLight']);
        const p = r.pick(['current', 'light', 'nowShowing']);
        const [a, b, c] = ['green', 'yellow', 'red'];
        const chain = (first, second, third) => [
          `if(${p} == ${q(a)}){`, `  return ${q(first)}`, '}',
          `else if(${p} == ${q(b)}){`, `  return ${q(second)}`, '}',
          `else if(${p} == ${q(c)}){`, `  return ${q(third)}`, '}',
        ];
        return {
          fn,
          params: [p],
          says: 'takes the color of a traffic light and returns the next color: green goes to yellow, yellow goes to red, and red goes to green',
          body: chain(b, c, a),
          broken: [chain(c, a, b), chain(b, a, a), chain(a, b, c)],
          inputs: [[q(a)], [q(b)], [q(c)]],
          bugs: [
            {
              line: 1, text: `  ${q(b)}`, why: WHY.noReturn, explain: `It needs return: return ${q(b)}`,
            },
            {
              line: 0, text: `if(${p} = ${q(a)}){`, why: WHY.assign, explain: `It should be if(${p} == ${q(a)}){`,
            },
          ],
        };
      },
    },
    {
      id: 'pass-or-fail',
      make(r) {
        const fn = r.pick(['passOrFail', 'checkScore', 'gradeIt']);
        const p = r.pick(['score', 'points', 'grade']);
        const t = r.pick([60, 65, 70, 75]);
        const body = (op, yes, no) => [`if(${p} ${op} ${t}){`, `  return ${q(yes)}`, '}', 'else{', `  return ${q(no)}`, '}'];
        return {
          fn,
          params: [p],
          says: `takes a score and returns "pass" when it is at least ${t}, and "fail" otherwise`,
          body: body('>=', 'pass', 'fail'),
          broken: [body('>', 'pass', 'fail'), body('>=', 'fail', 'pass'), body('<=', 'pass', 'fail')],
          inputs: [[t - 20], [t - 5], [t], [t + 5], [t + 20]],
          bugs: [
            {
              line: 1, text: `  ${q('pass')}`, why: WHY.noReturn, explain: `It needs return: return ${q('pass')}`,
            },
            {
              line: 0, text: `if(${p} < ${t}){`, why: WHY.backwards, explain: `It should be if(${p} >= ${t}){`,
            },
          ],
        };
      },
    },
    {
      id: 'ticket-price',
      make(r) {
        const fn = r.pick(['ticketPrice', 'priceFor', 'admission']);
        const p = r.pick(['age', 'guestAge', 'howOld']);
        const kid = r.pick([10, 12, 13]);
        const senior = r.pick([60, 65, 70]);
        const [low, mid, high] = r.pick([[5, 7, 10], [4, 6, 9], [6, 8, 12]]);
        const body = (op, first, second, third) => [
          `if(${p} ${op} ${kid}){`, `  return ${first}`, '}',
          `else if(${p} >= ${senior}){`, `  return ${second}`, '}',
          'else{', `  return ${third}`, '}',
        ];
        return {
          fn,
          params: [p],
          says: `takes an age and returns the ticket price: ${low} for anyone under ${kid}, ${mid} for anyone ${senior} or older, and ${high} for everyone else`,
          body: body('<', low, mid, high),
          broken: [body('<=', low, mid, high), body('<', mid, low, high), body('>', low, mid, high)],
          inputs: [[kid - 5], [kid], [kid + 3], [senior - 5], [senior], [senior + 10]],
          bugs: [
            {
              line: 4, text: `  ${mid}`, why: WHY.noReturn, explain: `It needs return: return ${mid}`,
            },
            {
              line: 3, text: `else if(${p} <= ${senior}){`, why: WHY.backwards, explain: `It should be else if(${p} >= ${senior}){`,
            },
          ],
        };
      },
    },
    {
      id: 'is-a-teen',
      make(r) {
        const fn = r.pick(['isTeen', 'teenCheck', 'checkTeen']);
        const p = r.pick(['age', 'guestAge', 'howOld']);
        const body = (op, low, high) => [`if(${p} >= ${low} ${op} ${p} <= ${high}){`, '  return true', '}', 'else{', '  return false', '}'];
        return {
          fn,
          params: [p],
          says: 'takes an age and returns true for ages 13 through 19, and false otherwise',
          body: body('&&', 13, 19),
          broken: [body('||', 13, 19), body('&&', 14, 19), body('&&', 13, 18)],
          inputs: [[10], [12], [13], [15], [19], [20], [40]],
          bugs: [
            {
              line: 0, text: `if(${p} >= 13 || ${p} <= 19){`, why: WHY.needsAnd, explain: `It should use &&: if(${p} >= 13 && ${p} <= 19){`,
            },
            {
              line: 1, text: '  true', why: WHY.noReturn, explain: 'It needs return: return true',
            },
          ],
        };
      },
    },
    {
      id: 'bigger-of-two',
      make(r) {
        const fn = r.pick(['biggerOf', 'larger', 'maxOfTwo']);
        const [a, b] = r.pick([['a', 'b'], ['x', 'y'], ['first', 'second']]);
        const body = (op, yes, no) => [`if(${a} ${op} ${b}){`, `  return ${yes}`, '}', 'else{', `  return ${no}`, '}'];
        return {
          fn,
          params: [a, b],
          says: 'takes two numbers and returns the bigger one',
          body: body('>', a, b),
          broken: [body('<', a, b), body('>', a, a), body('>', b, a)],
          inputs: [[3, 8], [9, 2], [5, 5], [12, 7], [1, 20]],
          bugs: [
            {
              line: 1, text: `  ${a}`, why: WHY.noReturn, explain: `It needs return: return ${a}`,
            },
            {
              line: 0, text: `if(${a} < ${b}){`, why: WHY.backwards, explain: `It should be if(${a} > ${b}){`,
            },
          ],
        };
      },
    },
    {
      id: 'can-ride',
      make(r) {
        const fn = r.pick(['canRide', 'rideCheck', 'mayRide']);
        const h = r.pick(['height', 'inches', 'tallness']);
        const a = r.pick(['age', 'years', 'howOld']);
        const tall = r.pick([44, 48, 52]);
        const old = r.pick([10, 12, 14]);
        const body = (op, yes, no) => [`if(${h} >= ${tall} ${op} ${a} >= ${old}){`, `  return ${q(yes)}`, '}', 'else{', `  return ${q(no)}`, '}'];
        return {
          fn,
          params: [h, a],
          says: `takes a height and an age. It returns "ride" when the height is at least ${tall} or the age is at least ${old}, and "wait" otherwise`,
          body: body('||', 'ride', 'wait'),
          broken: [body('&&', 'ride', 'wait'), body('||', 'wait', 'ride')],
          inputs: [[tall + 4, old + 2], [tall + 4, old - 2], [tall - 4, old + 2], [tall - 4, old - 2], [tall, old - 3]],
          bugs: [
            {
              line: 0, text: `if(${h} >= ${tall} && ${a} >= ${old}){`, why: WHY.needsOr, explain: `It should use ||: if(${h} >= ${tall} || ${a} >= ${old}){`,
            },
            {
              line: 4, text: `  ${q('wait')}`, why: WHY.noReturn, explain: `It needs return: return ${q('wait')}`,
            },
          ],
        };
      },
    },
  ];

  const header = (s) => `function ${s.fn}(${s.params.join(', ')}){`;
  const indent = (lines) => lines.map((line) => `  ${line}`);
  const source = (s, body) => [header(s)].concat(indent(body || s.body), ['}']);
  const callText = (s, args) => `${s.fn}(${args.join(', ')})`;

  const resultOf = (s, body, args) => {
    const logs = kit.printed(source(s, body).concat([`console.log(${callText(s, args)})`]));
    return logs[0];
  };

  // Every broken version must really behave differently on at least one input.
  const usefulBroken = (s) => s.broken.filter((body) => s.inputs.some((args) => resultOf(s, body, args) !== resultOf(s, s.body, args)));

  const eachSpec = (build) => SPECS.map((spec) => ({ id: spec.id, make: (r) => build(r, spec.make(r)) }));

  const matchSlot = {
    id: 'matchPrompt',
    skill: 'concepts',
    concept: 'Choosing the function that does what a prompt asks',
    patterns: eachSpec((r, s) => kit.choiceQuestion(r, {
      prompt: 'Which function does what this prompt asks?',
      rule: `${s.fn} ${s.says}.`,
      correct: source(s).join('\n'),
      wrong: usefulBroken(s).map((body) => source(s, body).join('\n')),
      codeOptions: true,
      explain: 'Try a few inputs on each one, especially values right on the edge of a condition.',
    })),
  };

  const testsSlot = {
    id: 'testTable',
    skill: 'flow',
    concept: 'Testing a function with different inputs',
    patterns: eachSpec((r, s) => {
      const outputs = Array.from(new Set(s.inputs.map((args) => resultOf(s, s.body, args))));
      // Keep picking until the chosen calls don't all give the same answer.
      let inputs;
      do {
        inputs = r.sample(s.inputs, Math.min(4, s.inputs.length));
      } while (new Set(inputs.map((args) => resultOf(s, s.body, args))).size < 2);
      const shown = (text) => (Number.isNaN(Number(text)) && text !== 'true' && text !== 'false' ? `"${text}"` : text);
      return kit.rowsQuestion({
        prompt: 'What does the function return for each call?',
        code: source(s),
        columns: ['Call'],
        rows: inputs.map((args) => ({ cells: [callText(s, args)], answer: outputs.indexOf(resultOf(s, s.body, args)) })),
        options: outputs.map((text) => ({ text: shown(text) })),
        explain: 'Put each input into the parameter, and follow the conditions until one returns a value.',
      });
    }),
  };

  function outOfSpec(r, s) {
    for (let tries = 0; tries < 50; tries++) {
      const body = r.pick(usefulBroken(s));
      const fails = s.inputs.filter((args) => resultOf(s, body, args) !== resultOf(s, s.body, args));
      const passes = s.inputs.filter((args) => resultOf(s, body, args) === resultOf(s, s.body, args));
      if (fails.length && passes.length >= 2) return { body, fails, passes };
    }
    throw new Error(`No useful broken version for ${s.fn}`);
  }

  const findInputSlot = {
    id: 'findInput',
    skill: 'concepts',
    concept: 'Finding a test input that shows a bug',
    patterns: eachSpec((r, s) => {
      const { body, fails, passes } = outOfSpec(r, s);
      const bad = r.pick(fails);
      return kit.choiceQuestion(r, {
        prompt: `${s.fn} should work this way: it ${s.says}. This version has a bug. Which call shows the bug by giving a wrong answer?`,
        code: source(s, body),
        correct: callText(s, bad),
        wrong: r.sample(passes, Math.min(3, passes.length)).map((args) => callText(s, args)),
        codeOptions: true,
        explain: `${callText(s, bad)} gives ${resultOf(s, body, bad)}, but it should give ${resultOf(s, s.body, bad)}. Testing right at the edges of a condition finds a lot of bugs.`,
      });
    }),
  };

  const flowSlot = {
    id: 'lines',
    skill: 'flow',
    concept: 'Seeing which lines run for a given input',
    patterns: eachSpec((r, s) => kit.buildFlow(r, () => {
      const args = r.pick(s.inputs);
      return source(s).concat(['', `console.log(${callText(s, args)})`]);
    }, 'The conditions are checked in order. Once a return runs, the function is over.', { minHits: 2 })),
  };

  const sumSlot = {
    id: 'useResults',
    skill: 'flow',
    concept: 'Using what functions return',
    patterns: [
      {
        id: 'add-two-prices',
        make(r) {
          const s = SPECS[2].make(r);
          const [x, y] = r.sample(s.inputs, 2);
          return kit.printedNumber({
            prompt: 'What number does this code print?',
            code: source(s).concat(['', `console.log(${callText(s, x)} + ${callText(s, y)})`]),
            explain: 'Work out what each call returns, and then add them.',
          });
        },
      },
      {
        id: 'bigger-of-bigger',
        make(r) {
          const s = SPECS[4].make(r);
          const nums = r.sample([3, 5, 8, 11, 14, 19, 22], 3);
          return kit.printedNumber({
            prompt: 'What number does this code print?',
            code: source(s).concat(['', `console.log(${s.fn}(${s.fn}(${nums[0]}, ${nums[1]}), ${nums[2]}))`]),
            explain: 'Start with the inner call. Its answer goes into the outer call.',
          });
        },
      },
      {
        id: 'store-then-adjust',
        make(r) {
          const s = SPECS[2].make(r);
          const args = r.pick(s.inputs);
          const name = r.pick(['total', 'cost', 'bill']);
          const fee = r.int(1, 4);
          return kit.printedNumber({
            prompt: 'What number does this code print?',
            code: source(s).concat(['', `let ${name} = ${callText(s, args)}`, `${name} = ${name} + ${fee}`, `console.log(${name})`]),
            explain: `${name} holds what the function returns, and then ${fee} gets added.`,
          });
        },
      },
    ],
  };

  const FIND_BUG = 'Tap the line with the bug, then choose why it is wrong.';
  const REASONS = [WHY.noReturn, WHY.assign, WHY.backwards, WHY.needsAnd, WHY.needsOr, WHY.elseLast];

  const bugSlot = {
    id: 'bug',
    skill: 'flow',
    concept: 'Finding and explaining bugs in a function',
    patterns: eachSpec((r, s) => {
      const bug = r.pick(s.bugs);
      const code = source(s);
      code[bug.line + 1] = `  ${bug.text}`;
      const tests = s.inputs.map((args) => `console.log(${callText(s, args)})`);
      return kit.bugQuestion(r, {
        prompt: `${s.fn} should work this way: it ${s.says}. ${FIND_BUG}`,
        code,
        bugLines: [bug.line + 1],
        why: bug.why,
        others: r.sample(REASONS.filter((reason) => reason !== bug.why && !isOpposite(reason, bug.why)), 3),
        fixed: source(s),
        spec: { kind: 'snippet', hiddenSuffix: tests, vectors: [{}] },
        explain: bug.explain,
      });
    }),
  };

  function isOpposite(a, b) {
    return (a === WHY.needsAnd && b === WHY.needsOr) || (a === WHY.needsOr && b === WHY.needsAnd);
  }

  // Turns the words students should know in a line of code into pieces that can be blanked out.
  const WORDS = /\b(return|else if|else|if)\b|(&&|\|\||==|>=|<=|>|<)/g;
  function piecesOf(line) {
    const parts = [];
    let last = 0;
    let match = WORDS.exec(line);
    while (match) {
      if (match.index > last) parts.push(line.slice(last, match.index));
      const word = match[0];
      parts.push(match[1] ? tok(word, word === 'return' ? 'ret' : 'kw') : tok(word, word === '&&' || word === '||' ? 'conn' : 'op'));
      last = match.index + word.length;
      match = WORDS.exec(line);
    }
    if (last < line.length) parts.push(line.slice(last));
    return parts;
  }

  const blanksSlot = {
    id: 'blanks',
    skill: 'build',
    concept: 'Completing a function from its description',
    patterns: eachSpec((r, s) => {
      const lines = source(s).map(piecesOf);
      const tests = s.inputs.map((args) => `console.log(${callText(s, args)})`);

        must: ['ret'],
        count: 3,
        pools: {
          ret: ['console.log', 'let'], kw: ['if', 'else if', 'else'], op: ['>', '<', '>=', '<=', '=='], conn: ['&&', '||'],
        },
        spec: { kind: 'snippet', hiddenSuffix: tests, vectors: [{}] },
        explain: `Here is one way to write it:\n${source(s).join('\n')}`,
      });
    }),
  };

  const parsonsSlot = {
    id: 'parsons',
    skill: 'build',
    concept: 'Putting a function together from its description',
    patterns: eachSpec((r, s) => {
      const tests = s.inputs.map((args) => `console.log(${callText(s, args)})`);

        prompt: `Put these lines in order so ${s.fn} ${s.says}.`,
        prefix: [{ text: header(s) }],
        movable: s.body,
        suffix: [{ text: '}' }],
        spec: { kind: 'snippet', hiddenSuffix: tests, vectors: [{}] },
        explain: 'Each return goes right after the condition it belongs to, inside that branch.',
      });
    }),
  };

  CC.defineLesson({
    id: 'U2LA3.3',
    title: 'Functions with Purpose',
    unit: 2,
    source: 'curriculum/02-unit-2/10-U2LA3.3-Functions-with-Purpose.md',
    defaults: {
      minutes: 20, questions: 12, attempts: 2, practice: false,
    },
    notYetTaught: [
      [/mouseIsPressed|mousePressed|keyIsPressed/, 'clicks and keys (U2LA4.2 and U2LA5.1)'],
      [/\bfor\b\s*\(|\bwhile\b\s*\(/, 'loops (Unit 3)'],
      [/\[/, 'arrays (Unit 3)'],
    ],
    slots: [matchSlot, findInputSlot, testsSlot, sumSlot, flowSlot, bugSlot, blanksSlot, parsonsSlot],
    priority: ['parsons', 'testTable', 'findInput', 'blanks', 'matchPrompt', 'bug', 'lines', 'useResults'],
  });
})(CodeCheck);

var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const {
    tok, chainLines, numberedRules, WHY,
  } = kit;

  // Rectangles with tidy edges, on a canvas with room around them.
  function pickRect(r) {
    const canvas = r.pick([400, 500, 600]);
    const x = r.pick([50, 100, 150]);
    const y = r.pick([50, 100, 150]);
    const w = r.pick([100, 150, 200]);
    const h = r.pick([50, 100, 150]);
    return {
      canvas, x, y, w, h, right: x + w, bottom: y + h, args: `${x}, ${y}, ${w}, ${h}`,
    };
  }

  const handWritten = (b) => `mouseX > ${b.x} && mouseX < ${b.right} && mouseY > ${b.y} && mouseY < ${b.bottom}`;
  const collideCall = (b) => `collidePointRect(mouseX, mouseY, ${b.args})`;
  const midX = (b) => b.x + 20;
  const midY = (b) => b.y + 20;

  // The lesson's mouseOnRect function, under different names for each student.
  const FUNCTION_NAMES = ['mouseOnRect', 'isOnRect', 'overRect', 'touchingRect', 'hoveringRect'];
  const PARAMETERS = [['x', 'y', 'w', 'h'], ['rectX', 'rectY', 'rectW', 'rectH'], ['boxX', 'boxY', 'boxW', 'boxH'], ['left', 'top', 'wide', 'tall']];

  function pickOnRect(r) {
    const fn = r.pick(FUNCTION_NAMES);
    const [x, y, w, h] = r.pick(PARAMETERS);
    const inside = `mouseX > ${x} && mouseX < ${x} + ${w} && mouseY > ${y} && mouseY < ${y} + ${h}`;
    const head = `function ${fn}(${x}, ${y}, ${w}, ${h}){`;
    return {
      fn,
      x,
      y,
      w,
      h,
      inside,
      head,
      lines: (condition = inside, whenTrue = 'return true') => [head, `  if(${condition}){`, `    ${whenTrue}`, '  }', '  else{', '    return false', '  }', '}'],
    };
  }

  const ON_OFF = [{ text: 'on it' }, { text: 'off it' }];

  function insideRows(r, { b, code, points, explain }) {
    return kit.rowsQuestion({
      prompt: 'Is the mouse on the rectangle or off it at each position?',
      code,
      columns: ['mouseX', 'mouseY'],
      rows: r.shuffle(points).map((p) => ({
        cells: [String(p.mouseX), String(p.mouseY)],
        answer: kit.printed(`console.log(${collideCall(b)})`, p)[0] === 'true' ? 0 : 1,
      })),
      options: ON_OFF,
      explain,
    });
  }

  const insideSlot = {
    id: 'inside',
    skill: 'concepts',
    concept: 'Telling whether a point is inside a rectangle',
    patterns: [

            explain: `The arguments fill in x, y, w, and h in order, so y + h is ${b.y} + ${b.h}.`,
          });
        },

  const REGION_PROMPT = 'Tap every part of the canvas where this condition is true.';
  const cutsOf = (b) => ({ w: b.canvas, h: b.canvas, xs: [b.x, b.right], ys: [b.y, b.bottom] });

  const regionSlot = {
    id: 'region',
    skill: 'concepts',
    concept: 'Finding where a collision check is true on the canvas',
    patterns: [

        id: 'collide-function',

  const functionSlot = {
    id: 'fnTrace',

    concept: 'Following a function that checks for collisions',
    patterns: [
      {
        id: 'what-it-returns',
        make(r) {

          const code = f.lines().concat(['', `console.log(${f.fn}(${b.args}))`]);
          const points = r.shuffle([

            { mouseX: midX(b), mouseY: b.y - 10 },
            { mouseX: b.x, mouseY: midY(b) },
          ]);
          return kit.rowsQuestion({
            prompt: 'What does the call return at each mouse position?',
            code,
            columns: ['mouseX', 'mouseY'],
            rows: points.map((p) => ({
              cells: [String(p.mouseX), String(p.mouseY)],
              answer: kit.printed(code, p)[0] === 'true' ? 0 : 1,
            })),
            options: TRUE_FALSE,
            explain: `On the rectangle means x from ${b.x} to ${b.right} and y from ${b.y} to ${b.bottom}. This function uses > and <, so exactly on an edge counts as off.`,

        },
      },
      {
        id: 'color-from-the-function',
        make(r) {
          const b = pickRect(r);

          const colors = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          const code = f.lines().concat(['', ...chainLines(

          )]);
          return kit.colorRows(r, {
            code,
            varName: V,

      },
      {
        id: 'color-from-collide2d',
        make(r) {

        id: 'two-buttons',

          const V = r.pick(kit.COLOR_VARS.background);

          const code = chainLines(
            [{ cond: `collidePointRect(mouseX, mouseY, ${x1}, 20, 100, 100)`, body: kit.setColor(V, colors[0]) },
              { cond: `collidePointRect(mouseX, mouseY, ${x2}, 20, 100, 100)`, body: kit.setColor(V, colors[1]) }],

  const CHANGE_OPTIONS = ['Only the rectangle changes color', 'Only the circle changes color', 'Both shapes change color', 'Neither shape changes color'];

  // A shape can be a switch for another shape, so students have to read which one gets changed.
  function hoverQuestion(r, hover, changes) {
    const [rectVar, circleVar] = r.sample(['colorA', 'colorB', 'firstColor', 'secondColor'], 2);
    const [c1, c2, c3] = r.sample(kit.COLORS, 3);
    const b = {
      x: r.pick([20, 40, 60]), y: r.pick([30, 50, 70]), w: r.pick([100, 120]), h: r.pick([100, 120]),
    };
    const c = { x: r.pick([300, 320, 340]), y: r.pick([80, 100, 120]), d: r.pick([80, 100]) };
    const target = changes === 'rect' ? rectVar : circleVar;
    const condition = hover === 'rect'
      ? `collidePointRect(mouseX, mouseY, ${b.x}, ${b.y}, ${b.w}, ${b.h})`
      : `collidePointCircle(mouseX, mouseY, ${c.x}, ${c.y}, ${c.d})`;
    const code = ['function draw(){']
      .concat(chainLines([{ cond: condition, body: kit.setColor(target, c1) }], kit.setColor(target, c2), '  '), [
        `  fill(${rectVar})`,
        `  rect(${b.x}, ${b.y}, ${b.w}, ${b.h})`,
        `  fill(${circleVar})`,
        `  ellipse(${c.x}, ${c.y}, ${c.d}, ${c.d})`,
        '}',
      ]);
    const program = [`let ${rectVar} = ${kit.colorCall(c3)}`, `let ${circleVar} = ${kit.colorCall(c3)}`, ...code,
      'function __report(){', `  console.log(${rectVar})`, `  console.log(${circleVar})`, '}'].join('\n');
    const on = hover === 'rect' ? { mouseX: b.x + 10, mouseY: b.y + 10 } : { mouseX: c.x, mouseY: c.y };
    const [rectOn, circleOn] = kit.printed(program, on, 'sketch');
    const [rectOff, circleOff] = kit.printed(program, { mouseX: 200, mouseY: 350 }, 'sketch');
    const rectChanged = rectOn !== rectOff;
    const circleChanged = circleOn !== circleOff;
    let correct = CHANGE_OPTIONS[3];
    if (rectChanged && circleChanged) [, , correct] = CHANGE_OPTIONS;
    else if (rectChanged) [correct] = CHANGE_OPTIONS;
    else if (circleChanged) [, correct] = CHANGE_OPTIONS;
    return kit.choiceQuestion(r, {
      prompt: `What happens when the mouse moves onto the ${hover === 'rect' ? 'rectangle' : 'circle'}?`,
      code,
      correct,
      wrong: CHANGE_OPTIONS.filter((text) => text !== correct),
      explain: 'A shape only reacts because of the code you write. The check can look at one shape and change the variable used by another.',
    });
  }

  const switchSlot = {
    id: 'whichShape',
    skill: 'concepts',
    concept: 'Knowing that hovering on a shape can change something else',
    patterns: [
      ['rect-changes-circle', 'rect', 'circle'],
      ['rect-changes-itself', 'rect', 'rect'],
      ['circle-changes-rect', 'circle', 'rect'],
      ['circle-changes-itself', 'circle', 'circle'],
    ].map(([id, hover, changes]) => ({ id, make: (r) => hoverQuestion(r, hover, changes) })),
  };

  const DOC_PROMPT = 'Here is the documentation for a Collide2D function. Which call checks whether the mouse is on this shape?';

  const docsSlot = {
    id: 'docs',
    skill: 'concepts',
    concept: 'Reading the Collide2D documentation',
    patterns: [
      {
        id: 'rectangle',
        make(r) {
          const b = pickRect(r);
          return kit.choiceQuestion(r, {
            prompt: DOC_PROMPT,
            rule: 'collidePointRect(pointX, pointY, x, y, width, height)',
            code: [`rect(${b.args})`],
            correct: `collidePointRect(mouseX, mouseY, ${b.args})`,
            wrong: [`collidePointRect(${b.args}, mouseX, mouseY)`, `collidePointRect(mouseX, mouseY, ${b.right}, ${b.bottom})`, `collidePointRect(${b.args})`],
            codeOptions: true,
            explain: 'The mouse is the point, so mouseX and mouseY come first. Then come the same four numbers as the shape.',
          });
        },
      },
      {
        id: 'circle',
        make(r) {
          const x = 10 * r.int(16, 30);

            prompt: DOC_PROMPT,
            rule: 'collidePointCircle(pointX, pointY, circleX, circleY, diameter)',
            code: [`ellipse(${x}, ${y}, ${d}, ${d})`],
            correct: `collidePointCircle(mouseX, mouseY, ${x}, ${y}, ${d})`,
            wrong: [`collidePointCircle(${x}, ${y}, ${d}, mouseX, mouseY)`, `collidePointCircle(mouseX, mouseY, ${d}, ${x}, ${y})`, `collidePointCircle(${x}, ${y}, mouseX, mouseY)`],
            codeOptions: true,
            explain: 'The mouse comes first, then the center of the circle, then its diameter.',
          });
        },
      },
      {
        id: 'line',
        make(r) {
          const [x1, y1, x2, y2] = [10 * r.int(1, 15), 10 * r.int(1, 15), 10 * r.int(16, 35), 10 * r.int(16, 35)];
          return kit.choiceQuestion(r, {
            prompt: DOC_PROMPT,
            rule: 'collidePointLine(pointX, pointY, x, y, x2, y2, [buffer])',
            code: [`line(${x1}, ${y1}, ${x2}, ${y2})`],
            correct: `collidePointLine(mouseX, mouseY, ${x1}, ${y1}, ${x2}, ${y2})`,
            wrong: [`collidePointLine(${x1}, ${y1}, ${x2}, ${y2}, mouseX, mouseY)`, `collidePointLine(mouseX, mouseY, ${x1}, ${x2}, ${y1}, ${y2})`, `collidePointLine(mouseX, ${x1}, ${y1}, ${x2}, ${y2})`],
            codeOptions: true,
            explain: 'Square brackets in documentation mean a value is optional, so the buffer can be left out.',
          });
        },
      },
      {
        id: 'what-it-gives-back',
        make(r) {
          const b = pickRect(r);
          const name = r.pick(['onIt', 'touching', 'hovering']);
          return kit.traceChoice(r, {
            prompt: `The mouse is at mouseX = ${b.x + 10}, mouseY = ${b.y + 10}. What does this code print?`,
            code: [`let ${name} = ${collideCall(b)}`, `console.log(${name})`],
            vec: { mouseX: b.x + 10, mouseY: b.y + 10 },
            wrong: [['true'], ['false'], [String(b.x + 10)], ['undefined']],
            explain: 'Collide2D is a library of boolean functions. They return true or false, so the result can be stored or used in an if.',
          });
        },
      },
    ],
  };

  const FIND_BUG = 'Tap the line with the bug, then choose why it is wrong.';
  const EDGE_WHY = 'The far edge of a rectangle is its position plus its size, not just its size.';
  const REASONS = [EDGE_WHY, WHY.needsAnd, WHY.noReturn, WHY.argOrder, WHY.assign];
  const others = (r, why) => r.sample(REASONS.filter((reason) => reason !== why), 3);
  const checks = (b) => [
    { mouseX: midX(b), mouseY: midY(b) },
    { mouseX: b.right - 10, mouseY: b.bottom - 10 },
    { mouseX: b.x - 20, mouseY: midY(b) },
    { mouseX: b.right + 20, mouseY: midY(b) },
    { mouseX: midX(b), mouseY: b.y - 20 },
    { mouseX: midX(b), mouseY: b.bottom + 20 },
    { mouseX: b.x - 20, mouseY: b.y - 20 },
  ];

  function functionBug(r, {
    f, b, condition, whenTrue, line, why, explain,
  }) {
    const call = `console.log(${f.fn}(${b.args}))`;
    return kit.bugQuestion(r, {
      prompt: `${f.fn} should return true only when the mouse is on the rectangle. ${FIND_BUG}`,
      code: f.lines(condition, whenTrue).concat([call]),
      bugLines: [line],
      why,
      others: others(r, why),
      fixed: f.lines().concat([call]),
      spec: { kind: 'snippet', vectors: checks(b) },
      explain,
    });
  }

  const bugSlot = {
    id: 'bug',
    skill: 'flow',
    concept: 'Finding and explaining bugs in collision code',
    patterns: [
      {
        id: 'size-as-the-far-edge',
        make(r) {
          const f = pickOnRect(r);
          const across = r.chance(0.5);
          const condition = across
            ? `mouseX > ${f.x} && mouseX < ${f.w} && mouseY > ${f.y} && mouseY < ${f.y} + ${f.h}`
            : `mouseX > ${f.x} && mouseX < ${f.x} + ${f.w} && mouseY > ${f.y} && mouseY < ${f.h}`;
          return functionBug(r, {
            f,
            b: pickRect(r),
            condition,
            line: 1,
            why: EDGE_WHY,
            explain: across ? `It should be mouseX < ${f.x} + ${f.w}.` : `It should be mouseY < ${f.y} + ${f.h}.`,
          });
        },
      },
      {
        id: 'or-instead-of-and',
        make(r) {
          const f = pickOnRect(r);
          return functionBug(r, {
            f,
            b: pickRect(r),
            condition: `mouseX > ${f.x} || mouseX < ${f.x} + ${f.w} || mouseY > ${f.y} || mouseY < ${f.y} + ${f.h}`,
            line: 1,
            why: WHY.needsAnd,
            explain: 'The mouse must pass all four comparisons to be on the rectangle, so they need &&.',
          });
        },
      },
      {
        id: 'never-returns',
        make(r) {
          const f = pickOnRect(r);
          return functionBug(r, {
            f, b: pickRect(r), whenTrue: 'true', line: 2, why: WHY.noReturn, explain: 'It needs return: return true',
          });
        },
      },
      {
        id: 'arguments-out-of-order',
        make(r) {
          const b = pickRect(r);
          const colors = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          const chain = (cond) => chainLines([{ cond, body: kit.setColor(V, colors[0]) }], kit.setColor(V, colors[1]));
          return kit.bugQuestion(r, {
            prompt: `${V} should turn ${colors[0].name} when the mouse is on rect(${b.args}). The function is collidePointRect(pointX, pointY, x, y, width, height). ${FIND_BUG}`,
            code: chain(`collidePointRect(${b.args}, mouseX, mouseY)`),
            bugLines: [0],
            why: WHY.argOrder,
            others: others(r, WHY.argOrder),
            fixed: chain(collideCall(b)),
            spec: {
              kind: 'snippet',
              hiddenPrefix: [`let ${V}`],
              hiddenSuffix: [`console.log(${V})`],
              vectors: checks(b),
            },
            explain: `The mouse comes first: ${collideCall(b)}`,
          });
        },
      },
    ],
  };

  const OP_POOL = ['>', '<', '=='];

  const blanksSlot = {
    id: 'blanks',
    skill: 'build',
    concept: 'Completing a collision check',
    patterns: [
      {
        id: 'mouse-on-rect',
        make(r) {
          const b = pickRect(r);
          const f = pickOnRect(r);
          const right = `${f.x} + ${f.w}`;
          const bottom = `${f.y} + ${f.h}`;
          return kit.blanksQuestion(r, {
            prompt: `Complete ${f.fn} so it returns true only when the mouse is on the rectangle.`,
            lines: [
              [f.head],
              [`  if(mouseX > ${f.x} `, tok('&&', 'conn'), ' mouseX ', tok('<', 'op'), ' ', tok(right, 'edge'), ` && mouseY > ${f.y} && mouseY `, tok('<', 'op'), ' ', tok(bottom, 'edge'), '){'],
              ['    ', tok('return', 'word'), ' true'],
              ['  }'],
              ['  else{'],
              ['    return false'],
              ['  }'],
              ['}'],
              [`console.log(${f.fn}(${b.args}))`],
            ],
            must: ['edge', 'conn'],
            count: 4,
            pools: {
              conn: ['||'], op: OP_POOL, edge: [f.w, f.h, `${f.x} + ${f.h}`, `${f.y} + ${f.w}`], word: ['console.log', 'let'],
            },
            spec: { kind: 'snippet', vectors: checks(b) },
            explain: `The right edge is ${right}, and the bottom edge is ${bottom}. All four comparisons have to be true.`,
          });
        },
      },
      {
        id: 'numbers-for-this-rectangle',
        make(r) {
          const b = pickRect(r);
          return kit.blanksQuestion(r, {
            prompt: `Complete the condition so it is true only when the mouse is on rect(${b.args}).`,
            lines: [
              ['if(mouseX > ', tok(b.x, 'num'), ' && mouseX < ', tok(b.right, 'num'), ' && mouseY > ', tok(b.y, 'num'), ' && mouseY < ', tok(b.bottom, 'num'), '){'],
              ['  console.log("On it")'],
              ['}'],
            ],
            must: ['num'],
            count: 3,
            pools: { num: [b.w, b.h, b.x + b.h, b.y + b.w, b.right + 50, b.bottom + 50].filter((n) => ![b.x, b.right, b.y, b.bottom].includes(n)) },
            spec: { kind: 'snippet', vectors: checks(b) },
            explain: `x goes from ${b.x} to ${b.x} + ${b.w}. y goes from ${b.y} to ${b.y} + ${b.h}.`,
          });
        },
      },
      {
        id: 'collide-call',
        make(r) {
          const b = pickRect(r);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so ${V} is ${c1.name} when the mouse is on rect(${b.args}), and ${c2.name} otherwise.`,
            lines: [
              ['if(collidePointRect(', tok('mouseX', 'pos'), ', ', tok('mouseY', 'pos'), `, ${b.x}, ${b.y}, `, tok(b.w, 'num'), ', ', tok(b.h, 'num'), ')){'],
              [`  ${kit.setColor(V, c1)}`],
              ['}'],
              [tok('else', 'kw'), '{'],
              [`  ${kit.setColor(V, c2)}`],
              ['}'],
            ],
            must: ['pos', 'num'],
            count: 4,
            pools: {
              pos: ['width', 'height'], num: [b.right, b.bottom].concat(b.w === b.h ? [b.w + 50] : [b.w, b.h]), kw: ['if', 'else if'],
            },
            spec: {
              kind: 'snippet',
              hiddenPrefix: [`let ${V}`],
              hiddenSuffix: [`console.log(${V})`],
              vectors: checks(b),
            },
            explain: `The function takes the point first, then the rectangle: collidePointRect(mouseX, mouseY, ${b.args}).`,
          });
        },
      },
      {
        id: 'circle-call',
        make(r) {
          const x = 100 + 10 * r.int(0, 20);
          const y = 100 + 10 * r.int(0, 20);
          const d = 10 * r.int(4, 15);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so ${V} is ${c1.name} when the mouse is on ellipse(${x}, ${y}, ${d}, ${d}), and ${c2.name} otherwise. The function is collidePointCircle(pointX, pointY, circleX, circleY, diameter).`,
            lines: [
              ['if(collidePointCircle(', tok('mouseX', 'pos'), ', ', tok('mouseY', 'pos'), ', ', tok(x, 'num'), ', ', tok(y, 'num'), ', ', tok(d, 'num'), ')){'],
              [`  ${kit.setColor(V, c1)}`],
              ['}'],
              ['else{'],
              [`  ${kit.setColor(V, c2)}`],
              ['}'],
            ],
            must: ['pos', 'num'],
            count: 4,
            pools: { pos: ['width', 'height'], num: [x + d, y + d, d + 50] },
            spec: {
              kind: 'snippet',
              hiddenPrefix: [`let ${V}`],
              hiddenSuffix: [`console.log(${V})`],
              vectors: [
                { mouseX: x, mouseY: y },
                { mouseX: x + d / 2 - 5, mouseY: y },
                { mouseX: x, mouseY: y + d / 2 - 5 },
                { mouseX: x + d, mouseY: y },
                { mouseX: x, mouseY: y + d },
                { mouseX: x - d, mouseY: y - d },
              ],
            },
            explain: `The mouse comes first, then the center of the circle, then its diameter: collidePointCircle(mouseX, mouseY, ${x}, ${y}, ${d}).`,
          });
        },
      },
    ],
  };

  const scramble = (rules) => `Put these lines in order so the code does this:\n${numberedRules(rules)}`;

  const parsonsSlot = {
    id: 'parsons',
    skill: 'build',
    concept: 'Putting hover code in order',
    patterns: [
      {
        id: 'hover-color',
        make(r) {
          const b = pickRect(r);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `If the mouse is on rect(${b.args}), make ${V} ${c1.name}. Otherwise, make it ${c2.name}.`,
              `Fill with ${V}, and draw the rectangle.`,
            ]),
            prefix: [{ text: 'function draw(){' }],
            movable: chainLines([{ cond: collideCall(b), body: kit.setColor(V, c1) }], kit.setColor(V, c2)).concat([`fill(${V})`, `rect(${b.args})`]),
            suffix: [{ text: '}' }],
            spec: { kind: 'sketch', hiddenPrefix: [`let ${V}`], vectors: checks(b) },
            explain: 'Each color goes right after its condition. fill() has to come before rect(), since it sets the color of the next shape.',
          });
        },
      },
      {
        id: 'function-with-returns',
        make(r) {
          const b = pickRect(r);
          const f = pickOnRect(r);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              'If the mouse is inside the rectangle, return true.',
              'Otherwise, return false.',
              `After the function, print what it returns for rect(${b.args}).`,
            ]),
            prefix: [{ text: f.head }],
            movable: [`if(${f.inside}){`, 'return true', '}', 'else{', 'return false', '}', '}', `console.log(${f.fn}(${b.args}))`],
            spec: { kind: 'snippet', vectors: checks(b) },
            explain: 'Each return goes in its own branch. The call comes after the function is closed.',
          });
        },
      },
      {
        id: 'a-different-shape-changes',
        make(r) {
          const b = pickRect(r);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.background);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `If the mouse is on rect(${b.args}), make ${V} ${c1.name}. Otherwise, make it ${c2.name}.`,
              `Paint the background with ${V}.`,
              'Draw the rectangle on top of the background.',
            ]),
            prefix: [{ text: 'function draw(){' }],
            movable: chainLines([{ cond: collideCall(b), body: kit.setColor(V, c1) }], kit.setColor(V, c2)).concat([`background(${V})`, `rect(${b.args})`]),
            suffix: [{ text: '}' }],
            spec: { kind: 'sketch', hiddenPrefix: [`let ${V}`], vectors: checks(b) },
            explain: 'A shape can be a switch for something else. background() has to come before rect(), or it covers the rectangle.',
          });
        },
      },
      {
        id: 'circle-hover',
        make(r) {
          const x = 100 + 10 * r.int(0, 20);
          const y = 100 + 10 * r.int(0, 20);
          const d = 10 * r.int(6, 15);
          const [small, big] = r.pick([[2, 10], [1, 8], [3, 12]]);
          const V = r.pick(['lineWeight', 'edgeWeight', 'thickness']);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `If the mouse is on the circle at (${x}, ${y}) with a diameter of ${d}, make ${V} ${big}. Otherwise, make it ${small}.`,
              `Set the stroke weight to ${V}, and draw the circle.`,
            ]),
            prefix: [{ text: 'function draw(){' }],
            movable: chainLines([{ cond: `collidePointCircle(mouseX, mouseY, ${x}, ${y}, ${d})`, body: `${V} = ${big}` }], `${V} = ${small}`).concat([`strokeWeight(${V})`, `ellipse(${x}, ${y}, ${d}, ${d})`]),
            suffix: [{ text: '}' }],
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${V}`],
              vectors: [{ mouseX: x, mouseY: y }, { mouseX: x + d, mouseY: y + d }, { mouseX: x, mouseY: y + d }],
            },
            explain: 'The variable gets its value first. strokeWeight() has to come before ellipse(), since it sets up the next shape.',
          });
        },
      },
    ],
  };

  CC.defineLesson({
    id: 'U2LA4.1',
    title: 'Collision Functions && Collide2D',
    unit: 2,
    source: 'curriculum/02-unit-2/11-U2LA4.1-Collision-Functions-and-Collide2D.md',
    defaults: {
      minutes: 20, questions: 12, attempts: 2, practice: false,
    },
    notYetTaught: [
      [/mouseIsPressed|mousePressed|keyIsPressed/, 'clicks and keys (U2LA4.2 and U2LA5.1)'],
      [/\bfor\b\s*\(|\bwhile\b\s*\(/, 'loops (Unit 3)'],
      [/\[(?!buffer\])/, 'arrays (Unit 3)'],
    ],
    slots: [insideSlot, regionSlot, switchSlot, docsSlot, edgesSlot, functionSlot, bugSlot, blanksSlot, parsonsSlot],
    priority: ['region', 'fnTrace', 'parsons', 'docs', 'blanks', 'inside', 'bug', 'whichShape', 'edges'],
  });
})(CodeCheck);


// ---- src/lessons/u2la4-2.js ----
// U2LA4.2: Mouse Clicks && Shapes as Buttons
// curriculum/02-unit-2/12-U2LA4.2-Mouse-Clicks-and-Shapes-as-Buttons.md
//
// Students at this point have seen: everything through U2LA4.1, plus the variable mouseIsPressed,
// the callback function mousePressed(), and using them with collide2D to make shapes into
// buttons. The Light Switch Game mini project is about buttons controlling several lights.
// They have NOT seen: keyIsPressed, loops, or arrays.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const {
    tok, chainLines, ifBlock, numberedRules, WHY, log,
  } = kit;

  const COUNTERS = ['score', 'clicks', 'points', 'tally'];
  const report = (expr) => `function __report(){\n  console.log(${expr})\n}`;
  const lift = { mouseIsPressed: false };
  const press = (x, y) => ({ mouseX: x, mouseY: y, mouseIsPressed: true });
  // One full click: the button goes down on one frame and comes back up on the next.
  const clickAt = (x, y) => [press(x, y), lift];
  const held = (x, y, n) => Array.from({ length: n }, () => press(x, y));

  function pickCircle(r) {
    return { x: 100 + 10 * r.int(0, 20), y: 100 + 10 * r.int(0, 20), d: 10 * r.int(6, 12) };
  }
  const onCircle = (c, r) => ({ x: c.x + 10 * r.int(-2, 2), y: c.y + 10 * r.int(-1, 1) });
  const circleCall = (c) => `collidePointCircle(mouseX, mouseY, ${c.x}, ${c.y}, ${c.d})`;
  const rectCall = (b) => `collidePointRect(mouseX, mouseY, ${b.x}, ${b.y}, ${b.w}, ${b.h})`;
  function pickButton(r) {
    return { x: r.pick([20, 40, 60]), y: r.pick([20, 40, 60]), w: r.pick([100, 120, 150]), h: r.pick([60, 80, 100]) };
  }
  const onButton = (b) => ({ x: b.x + 20, y: b.y + 20 });
  const offButton = (b) => ({ x: b.x + b.w + 50, y: b.y + b.h + 50 });

  // ---- mouseIsPressed or mousePressed()? ----

  const VARIABLE = 'mouseIsPressed';
  const CALLBACK = 'mousePressed()';
  const SCENARIOS = [
    ['Add 1 to a score each time the circle gets clicked', 1],
    ['Keep a shape red only while the button is held down', 0],
    ['Count how many times a light switch has been pressed', 1],
    ['Draw with the mouse only while the button is held down', 0],
    ['Move to the next level once per click', 1],
    ['Grow a circle a little more on every frame the button is down', 0],
    ['Flip a light on or off once per click', 1],
    ['Make the background flash while the button is down', 0],
  ];

  const whichSlot = {
    id: 'pressedOrCallback',
    skill: 'concepts',
    concept: 'Choosing between mouseIsPressed and mousePressed()',
    patterns: [
      {
        id: 'situations',
        make(r) {
          const once = r.sample(SCENARIOS.filter((s) => s[1] === 1), 2);
          const hold = r.sample(SCENARIOS.filter((s) => s[1] === 0), 2);
          return kit.rowsQuestion({
            prompt: 'Which one fits each situation best?',
            columns: ['Situation'],
            rows: r.shuffle(once.concat(hold)).map(([text, answer]) => ({ cells: [text], answer })),
            options: [{ text: VARIABLE }, { text: CALLBACK }],
            explain: 'mouseIsPressed is checked on every frame, so it fits anything that lasts while the button is held down. mousePressed() runs once per click, so it fits counting.',
          });
        },
      },
      {
        id: 'what-each-one-is',
        make(r) {
          const name = r.pick(COUNTERS);
          return kit.choiceQuestion(r, {
            prompt: `What is the difference between these two?`,
            code: ['if(mouseIsPressed){', `  ${name} = ${name} + 1`, '}', '', 'function mousePressed(){', `  ${name} = ${name} + 1`, '}'],
            correct: 'mouseIsPressed is a variable that is true while the button is down, and mousePressed() is a function that runs once per click',
            wrong: [
              'They are two names for the same thing, so they always behave the same',
              'mousePressed() is a variable that is true while the button is down, and mouseIsPressed is a function that runs once per click',
              'mouseIsPressed only works inside setup(), and mousePressed() only works inside draw()',
            ],
            explain: 'The if goes inside draw(), which runs many times while a finger is on the button. mousePressed() sits outside setup() and draw(), and p5 calls it once for each click.',
          });
        },
      },
      {
        id: 'where-it-goes',
        make(r) {
          const name = r.pick(COUNTERS);
          return kit.choiceQuestion(r, {
            prompt: 'Where in a sketch does this function belong?',
            code: ['function mousePressed(){', `  ${name} = ${name} + 1`, '}'],
            correct: 'On its own, outside of both setup() and draw()',
            wrong: ['Inside draw(), so it can run on every frame', 'Inside setup(), so p5 can find it when the sketch starts', 'Inside an if statement that checks mouseIsPressed'],
            explain: 'It has to stand on its own at the top level, like setup() and draw(). p5 calls it for you when the mouse is pressed.',
          });
        },
      },
      {
        id: 'type-of-the-variable',
        make(r) {
          const name = r.pick(['pressed', 'isDown', 'holding']);
          return kit.traceChoice(r, {
            prompt: 'The button is being held down. What does this code print?',
            code: [`let ${name} = mouseIsPressed`, `console.log(typeof ${name})`, `console.log(${name})`],
            vec: { mouseIsPressed: true },
            wrong: [['boolean', 'true'], ['boolean', 'false'], ['string', 'true'], ['number', '1']],
            explain: 'mouseIsPressed holds a boolean: true while the button is down, and false the rest of the time.',
          });
        },
      },
    ],
  };

  // ---- Counting across frames ----

  const countSlot = {
    id: 'counting',
    skill: 'flow',
    concept: 'Predicting what a click does across frames',
    patterns: [
      {
        id: 'held-with-the-variable',
        make(r) {
          const name = r.pick(COUNTERS);
          const c = pickCircle(r);
          const n = r.int(3, 6);
          const code = [`let ${name} = 0`, '', 'function draw(){', `  if(${circleCall(c)} && mouseIsPressed){`, `    ${name} = ${name} + 1`, '  }', '}'];
          const spot = onCircle(c, r);
          return kit.printedNumber({
            prompt: `The mouse is held down on the circle for ${n} frames. What does ${name} hold now?`,
            code,
            run: `${code.join('\n')}\n${report(name)}`,
            vec: { mouseX: 0, mouseY: 0, frames: held(spot.x, spot.y, n) },
            kind: 'sketch',
            explain: 'draw() runs on every frame, and mouseIsPressed stays true the whole time. That is why the score jumps when you use the variable.',
          });
        },
      },
      {
        id: 'held-with-the-callback',
        make(r) {
          const name = r.pick(COUNTERS);
          const c = pickCircle(r);
          const n = r.int(3, 6);
          const code = [`let ${name} = 0`, '', 'function mousePressed(){', `  if(${circleCall(c)}){`, `    ${name} = ${name} + 1`, '  }', '}'];
          const spot = onCircle(c, r);

              fn: WORD_POOL.fn, call: ['collidePointRect', 'mousePressed'], name: ['mouseX', 'frameCount'], num: [2, 0, 10],
            },
            spec: {
              kind: 'sketch',
              hiddenSuffix: [report(name)],
              vectors: [
                { mouseX: 0, mouseY: 0, frames: [...clickAt(spot.x, spot.y), ...clickAt(spot.x, spot.y)] },
                { mouseX: 0, mouseY: 0, frames: clickAt(c.x + c.d + 30, c.y + c.d + 30) },
                { mouseX: 0, mouseY: 0, frames: held(spot.x, spot.y, 3) },
              ],
            },
            explain: 'mousePressed() runs once per click, and the if checks that the click landed on the circle.',
          });
        },
      },
      {
        id: 'change-while-held',
        make(r) {
          const b = pickButton(r);
          const spot = onButton(b);
          const name = r.pick(['lineWeight', 'edgeWeight', 'thickness']);
          const [low, high] = r.pick([[2, 10], [1, 8], [3, 12]]);
          return kit.blanksQuestion(r, {
            prompt: `Complete draw() so ${name} is ${high} only while the rectangle is being pressed, and ${low} the rest of the time.`,
            lines: [
              [`let ${name} = ${low}`],
              ['function draw(){'],
              [`  if(${rectCall(b)} `, tok('&&', 'conn'), ' ', tok('mouseIsPressed', 'word'), '){'],
              [`    ${name} = `, tok(high, 'num')],
              ['  }'],
              ['  ', tok('else', 'kw'), '{'],
              [`    ${name} = `, tok(low, 'num')],
              ['  }'],
              ['}'],
            ],
            must: ['conn', 'word'],
            count: 4,
            pools: {
              conn: WORD_POOL.conn, word: ['mousePressed', 'mouseX'], num: [low + 1, high + 1], kw: ['if', 'else if'],
            },
            spec: {
              kind: 'sketch',
              hiddenSuffix: [report(name)],
              vectors: [
                { mouseX: 0, mouseY: 0, frames: [press(spot.x, spot.y)] },
                { mouseX: 0, mouseY: 0, frames: [press(spot.x, spot.y), lift] },
                { mouseX: spot.x, mouseY: spot.y, frames: [{}] },
                { mouseX: 0, mouseY: 0, frames: [press(b.x + b.w + 30, b.y)] },
              ],
            },
            explain: 'The rectangle check and mouseIsPressed both have to be true, and the else sets the value back.',
          });
        },
      },
      {
        id: 'nested-button',
        make(r) {
          const b = pickButton(r);
          const spot = onButton(b);
          const [c1, c2, c3] = r.sample(kit.COLORS, 3);
          const V = r.pick(kit.COLOR_VARS.shape);
          return kit.blanksQuestion(r, {
            prompt: `Complete the nested conditionals. On the rectangle, ${V} is ${c1.name} while pressed and ${c2.name} otherwise. Off the rectangle, it is ${c3.name}.`,
            lines: [
              ['if(', tok('collidePointRect', 'call'), `(mouseX, mouseY, ${b.x}, ${b.y}, ${b.w}, ${b.h})){`],
              ['  if(', tok('mouseIsPressed', 'word'), '){'],
              [`    ${kit.setColor(V, c1)}`],
              ['  }'],
              ['  ', tok('else', 'kw'), '{'],
              [`    ${kit.setColor(V, c2)}`],
              ['  }'],
              ['}'],
              [tok('else', 'kw'), '{'],
              [`  ${kit.setColor(V, c3)}`],
              ['}'],
            ],
            must: ['word', 'kw'],
            count: 3,
            pools: { call: ['collidePointCircle', 'mousePressed'], word: ['mousePressed', 'mouseY'], kw: ['if', 'else if'] },
            spec: {
              kind: 'snippet',
              hiddenPrefix: [`let ${V}`],
              hiddenSuffix: [`console.log(${V})`],
              vectors: [
                { mouseX: spot.x, mouseY: spot.y, mouseIsPressed: true },
                { mouseX: spot.x, mouseY: spot.y, mouseIsPressed: false },
                { mouseX: b.x + b.w + 40, mouseY: b.y + b.h + 40, mouseIsPressed: true },
                { mouseX: b.x + b.w + 40, mouseY: b.y + b.h + 40, mouseIsPressed: false },
              ],
            },
            explain: 'The inner if and else only get checked when the mouse is on the rectangle.',
          });
        },
      },
      {
        id: 'light-switch',
        make(r) {
          const name = r.pick(LIGHTS_NAMES);
          const [a, b] = r.pick(ROOMS);
          const button = pickButton(r);
          const spot = onButton(button);
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so each click on the rectangle turns ${name}.${a} on and ${name}.${b} off.`,
            lines: [
              [`let ${name} = {`],
              [`  ${a}: "off",`],
              [`  ${b}: "on"`],
              ['}'],
              ['function ', tok('mousePressed', 'fn'), '(){'],
              [`  if(${rectCall(button)}){`],
              ['    ', tok(name, 'obj'), '.', tok(a, 'key'), ' = ', tok('"on"', 'state')],
              ['    ', tok(name, 'obj'), '.', tok(b, 'key'), ' = ', tok('"off"', 'state')],
              ['  }'],
              ['}'],
            ],
            must: ['fn', 'state'],
            count: 3,
            pools: {
              fn: WORD_POOL.fn, obj: [a, 'switch'], key: [a, b], state: ['on', 'off', '"on"', '"off"'],
            },
            spec: {
              kind: 'sketch',
              hiddenSuffix: [report(`${name}.${a}, ${name}.${b}`)],
              vectors: [
                { mouseX: 0, mouseY: 0, frames: clickAt(spot.x, spot.y) },
                { mouseX: 0, mouseY: 0, frames: clickAt(button.x + button.w + 30, button.y) },
              ],
            },
            explain: 'mousePressed() runs once per click. Words like "on" are strings, so they need quotation marks.',
          });
        },
      },
    ],
  };

  const scramble = (rules) => `Put these lines in order so the code does this:\n${numberedRules(rules)}`;

  const parsonsSlot = {
    id: 'parsons',
    skill: 'build',
    concept: 'Putting click code in order',
    patterns: [
      {
        id: 'count-and-show',
        make(r) {
          const name = r.pick(COUNTERS);
          const c = pickCircle(r);
          const spot = onCircle(c, r);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `In draw(), paint a gray background and draw the circle at (${c.x}, ${c.y}) with a diameter of ${c.d}.`,
              `Make a separate mousePressed() function. If the click is on the circle, add 1 to ${name}.`,
            ]),
            prefix: [{ text: `let ${name} = 0` }, { text: 'function draw(){' }],
            movable: ['background(220)', `ellipse(${c.x}, ${c.y}, ${c.d}, ${c.d})`, '}', 'function mousePressed(){', `if(${circleCall(c)}){`, `${name} = ${name} + 1`, '}'],
            suffix: [{ text: '}' }],
            spec: {
              kind: 'sketch',
              hiddenSuffix: [report(name)],
              vectors: [
                { mouseX: 0, mouseY: 0, frames: [...clickAt(spot.x, spot.y), ...clickAt(c.x + c.d + 30, c.y)] },
                { mouseX: 0, mouseY: 0, frames: held(spot.x, spot.y, 3) },
              ],
            },
            explain: 'draw() has to close before mousePressed() starts, since mousePressed() must stand on its own.',
          });
        },
      },
      {
        id: 'color-while-held',
        make(r) {
          const b = pickButton(r);
          const spot = onButton(b);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `While the rectangle is being pressed, make ${V} ${c1.name}. Otherwise, make it ${c2.name}.`,
              `Fill with ${V}, and draw the rectangle.`,
            ]),
            prefix: [{ text: 'function draw(){' }],
            movable: chainLines([{ cond: `${rectCall(b)} && mouseIsPressed`, body: kit.setColor(V, c1) }], kit.setColor(V, c2)).concat([`fill(${V})`, `rect(${b.x}, ${b.y}, ${b.w}, ${b.h})`]),
            suffix: [{ text: '}' }],
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${V}`],
              vectors: [
                { mouseX: spot.x, mouseY: spot.y, mouseIsPressed: true },
                { mouseX: spot.x, mouseY: spot.y, mouseIsPressed: false },
                { mouseX: b.x + b.w + 40, mouseY: b.y, mouseIsPressed: true },
              ],
            },
            explain: 'Each color goes right after its condition. fill() has to come before rect().',
          });
        },
      },
      {
        id: 'nested-button',
        make(r) {
          const b = pickButton(r);
          const spot = onButton(b);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              'Use one if inside another.',
              `If the mouse is on the rectangle and pressed, make ${V} ${c1.name}.`,
              `If it is on the rectangle but not pressed, make ${V} ${c2.name}.`,
            ]),
            prefix: [{ text: `if(${rectCall(b)}){` }],
            movable: ['if(mouseIsPressed){', kit.setColor(V, c1), '}', 'else{', kit.setColor(V, c2), '}'],
            suffix: [{ text: '}' }],
            spec: {
              kind: 'snippet',
              hiddenPrefix: [`let ${V} = "none"`],
              hiddenSuffix: [`console.log(${V})`],
              vectors: [
                { mouseX: spot.x, mouseY: spot.y, mouseIsPressed: true },
                { mouseX: spot.x, mouseY: spot.y, mouseIsPressed: false },
                { mouseX: b.x + b.w + 40, mouseY: b.y, mouseIsPressed: true },
              ],
            },
            explain: 'The inner if and its else both go inside the outer if.',
          });
        },
      },
      {
        id: 'light-switch',
        make(r) {
          const name = r.pick(LIGHTS_NAMES);
          const [a, b, c] = r.pick(ROOMS);
          const button = pickButton(r);
          const spot = onButton(button);
          return kit.parsonsQuestion(r, {
            prompt: scramble([
              `Make ${name} an object where ${a}, ${b}, and ${c} all start as "off".`,
              `In mousePressed(), if the click is on the rectangle, turn ${a} and ${c} on.`,
            ]),
            prefix: [{ text: `let ${name} = {` }, { text: `${a}: "off",` }, { text: `${b}: "off",` }],
            movable: [`${c}: "off"`, '}', 'function mousePressed(){', `if(${rectCall(button)}){`, `${name}.${a} = "on"`, `${name}.${c} = "on"`, '}'],
            suffix: [{ text: '}' }],
            spec: {
              kind: 'sketch',
              hiddenSuffix: [report(`${name}.${a}, ${name}.${b}, ${name}.${c}`)],
              vectors: [
                { mouseX: 0, mouseY: 0, frames: clickAt(spot.x, spot.y) },
                { mouseX: 0, mouseY: 0, frames: clickAt(button.x + button.w + 30, button.y) },
              ],
            },
            explain: 'The object closes before the function starts. The changes go inside the if, so only a click on the rectangle makes them.',
          });
        },
      },
    ],
  };

  CC.defineLesson({
    id: 'U2LA4.2',
    title: 'Mouse Clicks && Shapes as Buttons',
    unit: 2,
    source: 'curriculum/02-unit-2/12-U2LA4.2-Mouse-Clicks-and-Shapes-as-Buttons.md',
    defaults: {
      minutes: 20, questions: 12, attempts: 2, practice: false,
    },
    notYetTaught: [
      [/keyIsPressed/, 'key presses (U2LA5.1)'],
      [/\bfor\b\s*\(|\bwhile\b\s*\(/, 'loops (Unit 3)'],
      [/\[/, 'arrays (Unit 3)'],
    ],
    slots: [whichSlot, countSlot, lastingSlot, statesSlot, lightsSlot, flowSlot, bugSlot, blanksSlot, parsonsSlot],
    priority: ['counting', 'pressedOrCallback', 'parsons', 'staysOrResets', 'blanks', 'buttonStates', 'bug', 'lightSwitch', 'lines'],
  });
})(CodeCheck);


// ---- src/lessons/u2la5-1.js ----
// U2LA5.1: Key Presses && Nested Conditionals
// curriculum/02-unit-2/14-U2LA5.1-Key-Presses-and-Nested-Conditionals.md
//
// Students at this point have seen: everything through U2LA4.2, plus keyIsPressed, key, nesting
// a specific key check inside a keyIsPressed check, += and -=, and using && to keep a value
// from getting too big or too small.
// They have NOT seen: loops or arrays. keyCode and keyPressed() are optional extras, so they
// are left out here.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const { tok, log, numberedRules, WHY } = kit;

  const LETTERS = ['b', 's', 'r', 'g', 'c', 'x', 'p', 'w'];
  const OBJECT_NAMES = ['theCircle', 'myCircle', 'dot'];
  const report = (expr) => `function __report(){\n  console.log(${expr})\n}`;
  const q = (letter) => `'${letter}'`;
  const down = (letter) => ({ keyIsPressed: true, key: letter });
  // key keeps holding the last letter after it is let go, as p5's key variable does.
  const up = { keyIsPressed: false };
  const repeat = (frame, n) => Array.from({ length: n }, () => frame);
  const framesWord = (n) => `${n} frame${n === 1 ? '' : 's'}`;

  // ---- Which key does what ----

  function keyRows(r, {
    code, varName, colors, cases, explain,
  }) {
    const program = `let ${varName}\n${code.join('\n')}\nconsole.log(${varName})`;
    const keys = colors.map(kit.colorKey);
    return kit.rowsQuestion({
      prompt: `Pick the color ${varName} ends up with in each case.`,
      code,
      columns: ['keyIsPressed', 'key'],
      rows: r.shuffle(cases).map(([pressed, letter]) => ({
        cells: [String(pressed), q(letter)],
        answer: keys.indexOf(kit.printed(program, { keyIsPressed: pressed, key: letter })[0]),
      })),
      options: colors.map((c) => ({ text: c.name, swatch: kit.colorCss(c) })),
      explain,
    });
  }

  const keysSlot = {
    id: 'keyRows',
    skill: 'flow',
    concept: 'Predicting what nested key checks do',
    patterns: [
      {
        id: 'two-keys-and-nothing-pressed',
        make(r) {
          const [a, b, other] = r.sample(LETTERS, 3);
          const colors = r.sample(kit.COLORS, 3);
          const V = r.pick(kit.COLOR_VARS.shape);
          return keyRows(r, {
            code: ['if(keyIsPressed){', `  if(key == ${q(a)}){`, `    ${kit.setColor(V, colors[0])}`, '  }', `  else if(key == ${q(b)}){`, `    ${kit.setColor(V, colors[1])}`, '  }', '}', 'else{', `  ${kit.setColor(V, colors[2])}`, '}'],
            varName: V,
            colors,
            cases: [[true, a], [true, b], [false, a], [false, other]],
            explain: 'The inner checks only run when keyIsPressed is true. key still holds the last letter after it is let go, so the outer check matters.',
          });
        },
      },
      {
        id: 'any-other-key',
        make(r) {
          const [a, other] = r.sample(LETTERS, 2);
          const colors = r.sample(kit.COLORS, 3);
          const V = r.pick(kit.COLOR_VARS.background);
          return keyRows(r, {
            code: ['if(keyIsPressed){', `  if(key == ${q(a)}){`, `    ${kit.setColor(V, colors[0])}`, '  }', '  else{', `    ${kit.setColor(V, colors[1])}`, '  }', '}', 'else{', `  ${kit.setColor(V, colors[2])}`, '}'],
            varName: V,
            colors,
            cases: [[true, a], [true, other], [false, a]],
            explain: 'There are two different elses. The inner else is for any other key. The outer else is for no key at all.',
          });
        },
      },
      {
        id: 'capital-letters-count',
        make(r) {
          const [a, b] = r.sample(LETTERS, 2);
          const colors = r.sample(kit.COLORS, 3);
          const V = r.pick(kit.COLOR_VARS.shape);
          return keyRows(r, {
            code: ['if(keyIsPressed){', `  if(key == ${q(a)}){`, `    ${kit.setColor(V, colors[0])}`, '  }', `  else if(key == ${q(b.toUpperCase())}){`, `    ${kit.setColor(V, colors[1])}`, '  }', '  else{', `    ${kit.setColor(V, colors[2])}`, '  }', '}'],
            varName: V,
            colors,
            cases: [[true, a], [true, a.toUpperCase()], [true, b.toUpperCase()], [true, b]],
            explain: `Capital letters count, so ${q(a)} and ${q(a.toUpperCase())} are different keys.`,
          });
        },
      },
      {
        id: 'and-instead-of-nesting',
        make(r) {
          const [a, b] = r.sample(LETTERS, 2);
          const colors = r.sample(kit.COLORS, 3);
          const V = r.pick(kit.COLOR_VARS.shape);
          return keyRows(r, {
            code: kit.chainLines(
              [{ cond: `keyIsPressed && key == ${q(a)}`, body: kit.setColor(V, colors[0]) },
                { cond: `keyIsPressed && key == ${q(b)}`, body: kit.setColor(V, colors[1]) }],
              kit.setColor(V, colors[2]),
            ),
            varName: V,
            colors,
            cases: [[true, a], [true, b], [false, a], [false, b]],
            explain: 'With &&, both have to be true. A letter only counts while a key is being pressed.',
          });
        },
      },
    ],
  };

  // ---- Growing and shrinking ----

  function sizeCode(name, start, grow, shrink, a, b, withParent = true) {
    const inner = [`if(key == ${q(a)}){`, `  ${name}.size += ${grow}`, '}', `else if(key == ${q(b)}){`, `  ${name}.size -= ${shrink}`, '}'];
    const body = withParent
      ? ['  if(keyIsPressed){'].concat(inner.map((l) => `    ${l}`), ['  }'])
      : inner.map((l) => `  ${l}`);
    return [`let ${name} = {`, `  size: ${start}`, '}', '', 'function draw(){'].concat(body, ['}']);
  }

  const sizeSlot = {
    id: 'sizeTrace',
    skill: 'flow',
    concept: 'Working out a value that changes while keys are held',
    patterns: [
      {
        id: 'hold-one-key',
        make(r) {
          const name = r.pick(OBJECT_NAMES);
          const [a, b] = r.sample(LETTERS, 2);
          const start = 10 * r.int(2, 10);
          const grow = 5 * r.int(1, 3);
          const shrink = 5 * r.int(1, 3);
          const n = r.int(2, 5);
          const code = sizeCode(name, start, grow, shrink, a, b);
          return kit.printedNumber({
            prompt: `The ${a} key is held down for ${framesWord(n)}. What does ${name}.size hold now?`,
            code,
            run: `${code.join('\n')}\n${report(`${name}.size`)}`,
            vec: { frames: repeat(down(a), n) },
            kind: 'sketch',
            explain: `draw() runs once per frame, so += ${grow} happens ${n} times.`,
          });
        },
      },
      {
        id: 'hold-one-then-the-other',
        make(r) {
          const name = r.pick(OBJECT_NAMES);
          const [a, b] = r.sample(LETTERS, 2);
          const start = 10 * r.int(5, 12);
          const grow = 5 * r.int(1, 3);
          const shrink = 5 * r.int(1, 3);
          const n = r.int(2, 4);
          const m = r.int(1, 3);
          const code = sizeCode(name, start, grow, shrink, a, b);
          return kit.printedNumber({
            prompt: `The ${a} key is held down for ${framesWord(n)}, and then the ${b} key is held down for ${framesWord(m)}. What does ${name}.size hold now?`,
            code,
            run: `${code.join('\n')}\n${report(`${name}.size`)}`,
            vec: { frames: repeat(down(a), n).concat(repeat(down(b), m)) },
            kind: 'sketch',
            explain: `Start at ${start}. Add ${grow} on each of ${framesWord(n)}, then subtract ${shrink} on each of ${framesWord(m)}.`,
          });
        },
      },
      {
        id: 'let-go-for-a-while',
        make(r) {
          const name = r.pick(OBJECT_NAMES);
          const [a, b] = r.sample(LETTERS, 2);
          const start = 10 * r.int(2, 10);
          const grow = 5 * r.int(1, 3);
          const n = r.int(2, 4);
          const rest = r.int(2, 4);
          const code = sizeCode(name, start, grow, 5, a, b);
          return kit.printedNumber({
            prompt: `The ${a} key is held down for ${framesWord(n)}, and then no keys are pressed for ${framesWord(rest)}. What does ${name}.size hold now?`,
            code,
            run: `${code.join('\n')}\n${report(`${name}.size`)}`,
            vec: { frames: repeat(down(a), n).concat(repeat(up, rest)) },
            kind: 'sketch',
            explain: 'keyIsPressed is false once the key is let go, so nothing inside the outer if runs anymore.',
          });
        },
      },
      {
        id: 'stopped-by-a-limit',
        make(r) {
          const name = r.pick(OBJECT_NAMES);
          const [a] = r.sample(LETTERS, 1);
          const limit = 10 * r.int(10, 20);
          const grow = 10;
          const start = limit - grow * r.int(1, 2);
          const n = r.int(4, 6);
          const code = [`let ${name} = {`, `  size: ${start}`, '}', '', 'function draw(){', '  if(keyIsPressed){', `    if(key == ${q(a)} && ${name}.size < ${limit}){`, `      ${name}.size += ${grow}`, '    }', '  }', '}'];
          return kit.printedNumber({
            prompt: `The ${a} key is held down for ${framesWord(n)}. What does ${name}.size hold now?`,
            code,
            run: `${code.join('\n')}\n${report(`${name}.size`)}`,
            vec: { frames: repeat(down(a), n) },
            kind: 'sketch',
            explain: `Once ${name}.size reaches ${limit}, the && is false, so it stops growing.`,
          });
        },
      },
    ],
  };

  const parentSlot = {
    id: 'whyTheOuterIf',
    skill: 'flow',
    concept: 'Seeing why key checks go inside keyIsPressed',
    patterns: [
      {
        id: 'no-outer-if-keeps-going',
        make(r) {
          const name = r.pick(OBJECT_NAMES);
          const [a, b] = r.sample(LETTERS, 2);
          const start = 10 * r.int(2, 8);
          const grow = 5 * r.int(1, 3);
          const n = r.int(1, 3);
          const rest = r.int(2, 4);
          const code = sizeCode(name, start, grow, 5, a, b, false);
          return kit.printedNumber({
            prompt: `The ${a} key is held down for ${framesWord(n)}, and then no keys are pressed for ${framesWord(rest)}. What does ${name}.size hold now?`,
            code,
            run: `${code.join('\n')}\n${report(`${name}.size`)}`,
            vec: { frames: repeat(down(a), n).concat(repeat(up, rest)) },
            kind: 'sketch',
            explain: `key keeps the last letter pressed, even after it is let go. With no keyIsPressed check, the size grows on all ${n + rest} frames.`,
          });
        },
      },
      {
        id: 'with-the-outer-if',
        make(r) {
          const name = r.pick(OBJECT_NAMES);
          const [a, b] = r.sample(LETTERS, 2);
          const start = 10 * r.int(2, 8);
          const grow = 5 * r.int(1, 3);
          const n = r.int(1, 3);
          const rest = r.int(2, 4);
          const code = sizeCode(name, start, grow, 5, a, b, true);
          return kit.printedNumber({
            prompt: `The ${a} key is held down for ${framesWord(n)}, and then no keys are pressed for ${framesWord(rest)}. What does ${name}.size hold now?`,
            code,
            run: `${code.join('\n')}\n${report(`${name}.size`)}`,
            vec: { frames: repeat(down(a), n).concat(repeat(up, rest)) },
            kind: 'sketch',
            explain: 'The outer if only lets the inner code run while a key is down.',
          });
        },
      },
      {
        id: 'what-key-holds',
        make(r) {
          const [a, b] = r.sample(LETTERS, 2);
          return kit.traceChoice(r, {

        button.setAttribute('aria-label', value === undefined ? `Blank ${i + 1}, empty` : `Blank ${i + 1}: ${value}`);
        button.setAttribute('aria-pressed', active === i ? 'true' : 'false');
        if (ctx.review) {
          const right = fullCredit || value === q.blanks[i].answer;
          button.classList.add(right ? 'blank-right' : 'blank-wrong');
        }
      });
      clearButton.disabled = ctx.locked || active === null || tokens[active] === undefined;
    };

    const nextEmpty = (from) => {
      for (let step = 1; step <= q.blanks.length; step++) {
        const i = (from + step) % q.blanks.length;
        if (tokens[i] === undefined) return i;
      }
      return null;
    };

    const clearButton = h('button', {
      type: 'button',
      class: 'chip chip-clear',
      onclick: () => {
        delete tokens[active];
        ctx.onChange({ ...tokens });
        refresh();
      },
    }, 'Clear blank');

    const lines = q.lines.map((line) => h('div', { class: 'code-line' }, codeText(indentOf(line.parts[0].text || ''), line.parts.map((part, n) => {
      if (part.blank === undefined) return codeSpans(n === 0 ? part.text.trimStart() : part.text);
      const i = part.blank;
      const button = h('button', {
        type: 'button',
        class: 'blank',
        disabled: ctx.locked,
        onclick: () => {
          active = i;
          refresh();
        },
      });
      blankButtons[i] = button;
      return button;
    }))));

    const chips = q.bank.map((token) => h('button', {
      type: 'button',
      class: 'chip',
      disabled: ctx.locked,
      onclick: () => {
        if (active === null) active = nextEmpty(-1);
        if (active === null) return;
        tokens[active] = token;
        ctx.onChange({ ...tokens });
        active = nextEmpty(active);
        refresh();
      },
    }, h('code', { class: 'code-inline' }, codeSpans(token))));

    if (!ctx.locked) active = nextEmpty(-1);
    refresh();

    const parts = [
      promptBlock(q),
      h('div', { class: 'code' }, lines),
      ctx.locked ? null : h('p', { class: 'hint' }, 'Tap a blank, then tap a word to put in it. Words can be used more than once.'),
      ctx.locked ? null : h('div', { class: 'bank', role: 'group', 'aria-label': 'Word bank' }, chips, clearButton),
    ];
    if (ctx.review && !fullCredit) {
      parts.push(h('p', { class: 'sub-prompt' }, 'A correct answer:'), codePanel(CC.blanksDisplayLines(q, CC.blanksKey(q))));
    }
    return parts;
  }

  // ---- Parsons: put scrambled lines in order ----

  function renderParsons(q, ctx) {
    let order = (ctx.answer || q.order).slice();
    const prefixTexts = q.prefix.map((l) => l.text);
    const suffixTexts = q.suffix.map((l) => l.text);
    const live = h('div', { class: 'sr-only', 'aria-live': 'polite' });

    const indented = (text, level) => h('span', { class: 'indented', style: `--level:${level}` }, codeSpans(text));

    const list = h('div', { class: 'sortable', role: 'list' });
    const suffixBox = h('div', { class: 'code fixed-code' });
    const prefixBox = h('div', { class: 'code fixed-code' });

    const repaint = () => {
      const texts = prefixTexts.concat(order.map((id) => q.lines[id].text), suffixTexts);
      const levels = CC.kit.indentLevels(texts);
      prefixBox.replaceChildren(...prefixTexts.map((text, i) => h('div', { class: 'code-line' }, indented(text, levels[i]))));
      Array.from(list.children).forEach((row, i) => {
        const slot = row.querySelector('.line-text');
        slot.replaceChildren(indented(q.lines[order[i]].text, levels[prefixTexts.length + i]));
        row.querySelector('.line-number').textContent = i + 1;
        const up = row.querySelector('.move-up');
        const down = row.querySelector('.move-down');
        if (up) up.disabled = i === 0;
        if (down) down.disabled = i === order.length - 1;
      });
      const start = prefixTexts.length + order.length;
      suffixBox.replaceChildren(...suffixTexts.map((text, i) => h('div', { class: 'code-line' }, indented(text, levels[start + i]))));
    };

    const syncOrder = () => {
      order = Array.from(list.children).map((row) => Number(row.dataset.id));
      repaint();
    };

    // Rows always move by shifting their neighbors. Moving the row itself would detach
    // it from the page for an instant, which ends a drag and loses keyboard focus.
    const stepUp = (row) => list.insertBefore(row.previousElementSibling, row.nextElementSibling);
    const stepDown = (row) => list.insertBefore(row.nextElementSibling, row);

    const move = (row, delta) => {
      if (delta < 0 && !row.previousElementSibling) return;
      if (delta > 0 && !row.nextElementSibling) return;
      if (delta < 0) stepUp(row);
      else stepDown(row);
      syncOrder();
      ctx.onChange(order.slice());
      live.textContent = `Moved to line ${Array.from(list.children).indexOf(row) + 1} of ${order.length}.`;
    };

    const startDrag = (row, event) => {
      if (event.target.closest('button')) return;
      if (event.pointerType !== 'mouse' && !event.target.closest('.grip')) return;
      event.preventDefault();
      row.setPointerCapture(event.pointerId);
      row.classList.add('dragging');
      const onMove = (e) => {
        let moved = false;
        for (;;) {
          const above = row.previousElementSibling;
          const below = row.nextElementSibling;
          const midpoint = (el) => {
            const box = el.getBoundingClientRect();
            return box.top + box.height / 2;
          };
          if (above && e.clientY < midpoint(above)) stepUp(row);
          else if (below && e.clientY > midpoint(below)) stepDown(row);
          else break;
          moved = true;
        }
        if (moved) syncOrder();
        if (e.clientY < 70) window.scrollBy(0, -12);
        else if (e.clientY > window.innerHeight - 70) window.scrollBy(0, 12);
      };
      const onEnd = () => {
        row.classList.remove('dragging');
        row.removeEventListener('pointermove', onMove);
        row.removeEventListener('pointerup', onEnd);
        row.removeEventListener('pointercancel', onEnd);
        syncOrder();
        ctx.onChange(order.slice());
      };
      row.addEventListener('pointermove', onMove);
      row.addEventListener('pointerup', onEnd);
      row.addEventListener('pointercancel', onEnd);
    };

    order.forEach((id) => {
      const text = q.lines[id].text;
      const row = h('div', {
        class: `sort-row ${ctx.locked ? 'locked' : ''}`,
        role: 'listitem',
        tabindex: ctx.locked ? null : 0,
        'aria-label': `Code line: ${text}. Use the up and down arrow keys to move it.`,
        'data-id': id,
      },
      ctx.locked ? null : h('span', { class: 'grip', 'aria-hidden': 'true' }, '⋮⋮'),
      h('span', { class: 'line-number', 'aria-hidden': 'true' }),
      h('span', { class: 'line-text' }),
      ctx.locked ? null : h('span', { class: 'move-buttons' },
        h('button', {
          type: 'button', class: 'move move-up', 'aria-label': 'Move line up', onclick: () => move(row, -1),
        }, '↑'),
        h('button', {
          type: 'button', class: 'move move-down', 'aria-label': 'Move line down', onclick: () => move(row, 1),
        }, '↓')));
      if (!ctx.locked) {
        row.addEventListener('pointerdown', (e) => startDrag(row, e));
        row.addEventListener('keydown', (e) => {
          if (e.target !== row) return;
          if (e.key === 'ArrowUp') { e.preventDefault(); move(row, -1); }
          if (e.key === 'ArrowDown') { e.preventDefault(); move(row, 1); }
        });
      }
      list.append(row);
    });
    repaint();

    const lineArea = [
      prefixTexts.length ? prefixBox : null,
      list,
      suffixTexts.length ? suffixBox : null,
      live,
    ];
    if (ctx.review && CC.grade(q, order).credit < 1) {
      const solution = prefixTexts.concat(q.solution.map((id) => q.lines[id].text), suffixTexts);
      const levels = CC.kit.indentLevels(solution);
      lineArea.push(
        h('p', { class: 'sub-prompt' }, 'A correct order:'),
        h('div', { class: 'code' }, solution.map((text, i) => h('div', { class: 'code-line' }, indented(text, levels[i])))),
      );
    }
    return [
      h('div', { class: 'parsons-instructions' },
        promptBlock(q),
        ctx.locked ? null : h('p', { class: 'hint' }, 'Drag the lines, or use the arrows. The indenting updates by itself as you go.')),
      h('div', { class: 'parsons-lines' }, lineArea),
    ];
  }

  const RENDERERS = {
    choice: renderChoice,
    number: renderNumber,
    rows: renderRows,
    region: renderRegion,
    lines: renderLines,
    bug: renderBug,
    blanks: renderBlanks,
    parsons: renderParsons,
  };

  // ctx: { answer, onChange, locked, review }
  const SPLIT_TYPES = ['choice', 'number', 'rows', 'bug', 'region'];

  CC.renderQuestion = function (q, ctx) {
    const split = SPLIT_TYPES.includes(q.type) && q.code ? ' split' : '';
    return h('div', { class: `question q-${q.type}${split}` }, RENDERERS[q.type](q, ctx));
  };

  // Shown after a practice question is checked.
  CC.renderFeedback = function (q, answer) {
    const { credit } = CC.grade(q, answer);
    const heading = credit === 1 ? 'Correct!' : credit === 0.5 ? 'Close: half credit' : 'Not quite';
    const tone = credit === 1 ? 'good' : credit === 0.5 ? 'close' : 'miss';
    return h('div', { class: `feedback feedback-${tone}`, role: 'status' },
      h('strong', {}, heading),
      q.explain ? h('p', { class: 'explain' }, q.explain) : null);
  };
})(CodeCheck);

// The on-screen text size and dark mode controls. Choices are remembered on this device,
// and changing them never touches a student's answers, timer, or test flags.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const { h, Store } = CC;
  const KEY = 'cc.display';
  const SIZES = [0.9, 1, 1.15, 1.3, 1.5, 1.75, 2];

  const systemTheme = () => (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

  // theme stays empty until a student picks one, so the device's own setting is the default.
  const saved = Store.get(KEY, {}) || {};
  const state = {
    scale: SIZES.includes(saved.scale) ? saved.scale : 1,
    theme: saved.theme === 'dark' || saved.theme === 'light' ? saved.theme : null,
  };

  function apply() {
    const root = document.documentElement;
    root.setAttribute('data-theme', state.theme || systemTheme());
    root.style.setProperty('--text-scale', String(state.scale));
  }

  function save() {
    const toSave = { scale: state.scale };
    if (state.theme) toSave.theme = state.theme;
    Store.set(KEY, toSave);
  }

  apply();

  // Controls are redrawn with each screen, so every copy reads the current state.
  CC.displayControls = function () {
    const percent = h('button', {
      type: 'button',
      class: 'display-btn display-size',
      onclick: () => setScale(1),
    });
    const smaller = h('button', {
      type: 'button',
      class: 'display-btn',
      'aria-label': 'Make text smaller',
      title: 'Make text smaller',
      onclick: () => setScale(SIZES[SIZES.indexOf(state.scale) - 1]),
    }, 'A−');
    const bigger = h('button', {
      type: 'button',
      class: 'display-btn',
      'aria-label': 'Make text bigger',
      title: 'Make text bigger',
      onclick: () => setScale(SIZES[SIZES.indexOf(state.scale) + 1]),
    }, 'A+');
    const theme = h('button', {
      type: 'button',
      class: 'display-btn display-theme',
      onclick: () => {
        state.theme = currentTheme() === 'dark' ? 'light' : 'dark';
        apply();
        save();
        refresh();
      },
    });
    const live = h('span', { class: 'sr-only', 'aria-live': 'polite' });

    function currentTheme() {
      return document.documentElement.getAttribute('data-theme');
    }

    function setScale(scale) {
      state.scale = scale;
      apply();
      save();
      refresh();
      live.textContent = `Text size ${Math.round(scale * 100)} percent.`;
    }

    function refresh() {
      const index = SIZES.indexOf(state.scale);
      const label = `${Math.round(state.scale * 100)}%`;
      percent.textContent = label;
      percent.setAttribute('aria-label', `Text size is ${label}. Reset to 100%.`);
      percent.title = 'Reset text size to 100%';
      smaller.disabled = index === 0;
      bigger.disabled = index === SIZES.length - 1;
      const isDark = currentTheme() === 'dark';
      theme.textContent = isDark ? '☀ Light' : '☾ Dark';
      theme.setAttribute('aria-label', isDark ? 'Switch to light mode' : 'Switch to dark mode');
    }

    refresh();
    return h('div', { class: 'display-controls', role: 'group', 'aria-label': 'Text size and color mode' },
      smaller, percent, bigger, theme, live);
  };
})(CodeCheck);

(function (CC) {

  const PENDING_KEY = 'cc.pending';
  const backend = CC.backend();
  const root = () => document.getElementById('app');

  let config = null;
  let run = null;

  // Screens with a colored band keep the display controls there. All others get a top bar.
  function show(...nodes) {
    const list = nodes.flat(Infinity).filter(Boolean);
    const hasBand = list.some((node) => node.classList && node.classList.contains('band'));
    if (!hasBand) list.unshift(h('div', { class: 'top-bar' }, CC.displayControls()));
    root().replaceChildren(...list);
    window.scrollTo(0, 0);
  }

  const pageHeader = (title, onBack) => h('header', { class: 'page-header' },
    onBack ? h('button', { type: 'button', class: 'btn btn-quiet', onclick: onBack }, '← Back') : null,
    h('h1', {}, title));

  const field = (label, control, help) => h('label', { class: 'field' },
    h('span', { class: 'field-label' }, label),
    control,
    help ? h('span', { class: 'field-help' }, help) : null);

  // Shown on every test and results screen, so the student and teacher can check the lesson.
  const lessonName = (test) => `${test.lessonId}: ${test.title}`;

  const formatClock = (seconds) => {
    const s = Math.max(0, Math.ceil(seconds));
    return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
  };

  // lessons the page knows are offered. Without a connection, practice still works.

  const knownLessons = () => config.lessons
    .filter((l) => CC.lessons[l.id])
    .sort((a, b) => CC.lessonOrder.indexOf(a.id) - CC.lessonOrder.indexOf(b.id));

  async function loadConfig() {
    try {
      config = await backend.getConfig();
    } catch (err) {
      // After a dropped connection, what was loaded earlier is still worth using.
      if (!config || config.loadError) {
        config = { loadError: 'Practice still works, but the test could not connect. Try reloading.', lessons: [], classes: [] };
      }
    }
  }

  const practiceLessons = () => (config && !config.loadError
    ? knownLessons().filter((l) => l.practice)

      id, title: CC.lessons[id].title, open: false, practice: true,

      h('main', { class: 'home' },

            h('strong', {}, 'Take the test'),

        practiceOnly ? h('p', { class: 'notice' }, 'This page is for practice only. Tests happen in class, on the link your teacher gives you. Practice here includes every lesson, so pick the one your class is on.') : null,
        config && config.loadError ? h('p', { class: 'notice notice-warn' }, config.loadError) : null,
        h('section', { class: 'rules home-tips' },
          h('h2', {}, 'Tips'),
          h('ul', {},
            h('li', {}, 'You may use AI for your work, but not on a test. If AI helps you, change the code and test it until you can explain how it works.'),
            h('li', {}, 'Practice until you can explain why an answer is right. Practice gives you new questions each time.'),
            h('li', {}, 'On a test, check that the lesson and your name at the top of the screen are right.'),
            h('li', {}, 'Questions come in a mixed order, and your test is different from your neighbors\' tests. If a question is slowing you down, mark it for review and move on.'),
            h('li', {}, 'After a test, practice the concepts it says to review. If you have a retake, your higher score counts.'))),
        offline && !practiceOnly ? h('button', { type: 'button', class: 'btn btn-quiet teacher-link', onclick: showTeacherGate }, 'Teacher settings') : null),
    );
  }

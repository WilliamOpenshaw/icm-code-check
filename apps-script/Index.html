        return kit.numberQuestion({ prompt: `On a ${w} by ${h} canvas, what is the x value of the ellipse's center?`, code, answer: args[0], explain: `width/2 is ${w}/2.` });
      },
      follows(r) {
        const mx = at(r, 2, 30); const my = at(r, 2, 30); const n = at(r, 1, 9);
        const code = [`rect(mouseX + ${n}, mouseY, 40, 40)`];
        const args = U.shapesOf(code, canvasVec(400, 400, mx, my)).shapes[0][1];
        return kit.numberQuestion({ prompt: `The mouse is at (${mx}, ${my}). What is the x value of the rectangle's corner?`, code, answer: args[0], explain: `mouseX + ${n}.` });
      },
      anchored(r) {
        const mx = at(r, 2, 30); const my = at(r, 5, 30);
        const code = ['triangle(mouseX, mouseY, mouseX+25, mouseY-40, mouseX+50, mouseY)'];
        const args = U.shapesOf(code, canvasVec(400, 400, mx, my)).shapes[0][1];
        return kit.numberQuestion({ prompt: `The mouse is at (${mx}, ${my}). What is the y value of the triangle's second corner?`, code, answer: args[3], explain: `mouseY - 40: the corners stay a set distance from the mouse.` });
      },
    }),
    slot('bug', 'flow', 'Finding bugs with system variables', {
      capital(r) {
        const s = at(r, 2, 9); const a = `ellipse(mouseX, mouseY, ${s}, ${s})`;
        return U.bug(r, { prompt: 'The ellipse should follow the mouse.', code: ['background(220)', `ellipse(mousex, mouseY, ${s}, ${s})`], fixed: ['background(220)', a], line: 1, why: 2, vectors: [{ mouseX: at(r, 2, 30), mouseY: 50 }], explain: 'The variable is mouseX, with a capital X.' });
      },
      swapped(r) {
        const [w, h] = r.pick([[600, 400], [800, 600], [500, 300]]);
        const s = at(r, 2, 9);
        return U.bug(r, { prompt: 'The ellipse should be in the center of the canvas.', code: ['background(220)', `ellipse(height/2, width/2, ${s}, ${s})`], fixed: ['background(220)', `ellipse(width/2, height/2, ${s}, ${s})`], line: 1, why: 0, vectors: [canvasVec(w, h, 0, 0)], explain: 'x comes first, so width/2 goes first.' });
      },
      stretch(r) {
        const code = (b) => [`triangle(mouseX, mouseY, ${b}, mouseX+50, mouseY)`];
        const dx = at(r, 2, 4); const dy = at(r, 2, 4);
        return U.bug(r, { prompt: 'The whole triangle should follow the mouse, but a corner stays put.', code: code(`${at(r, 5, 20)}, ${at(r, 1, 9)}`), fixed: code(`mouseX+${dx}, mouseY-${dy}`), line: 0, why: 5, vectors: [{ mouseX: 100, mouseY: 100 }, { mouseX: 230, mouseY: 310 }], explain: 'Every corner has to use the mouse variables.' });
      },
    }),
    slot('blanks', 'build', 'Completing code with system variables', {
      centered(r) {
        return kit.blanksQuestion(r, { prompt: 'Complete the code so the ellipse is always in the center of the canvas.', lines: [['ellipse(', tok('width', 'v'), '/', tok(2, 'n'), ', ', tok('height', 'v'), '/2, 50, 50)']], must: ['v'], count: 2, pools: { v: ['mouseX', 'mouseY'], n: [3, 4] }, spec: U.spec([canvasVec(600, 400, 10, 20), canvasVec(800, 300, 30, 40)]), explain: 'Half of width and half of height is the center.' });
      },
      follow(r) {
        const s = at(r, 3, 9);
        return kit.blanksQuestion(r, { prompt: `Complete the code so a rectangle ${s} wide and tall follows the mouse.`, lines: [['rect(', tok('mouseX', 'v'), ', ', tok('mouseY', 'v'), `, ${s}, ${s})`]], must: ['v'], count: 2, pools: { v: ['width', 'height'] }, spec: U.spec([canvasVec(600, 400, 10, 20), canvasVec(800, 300, 70, 40)]), explain: 'mouseX and mouseY hold the mouse\'s position.' });
      },
      third(r) {
        const [d, word] = r.pick([[3, 'one third'], [4, 'one quarter'], [5, 'one fifth']]);
        return kit.blanksQuestion(r, { prompt: `Complete the code so the ellipse is ${word} of the way across the canvas, halfway down.`, lines: [['ellipse(', tok('width', 'v'), '/', tok(d, 'n'), ', ', tok('height', 'v'), '/2, 50, 50)']], must: ['v', 'n'], count: 3, pools: { v: ['mouseX', 'mouseY'], n: [d + 3, d + 6] }, spec: U.spec([canvasVec(600, 400, 10, 20), canvasVec(900, 300, 30, 40)]), explain: `Across is width, so divide it by ${d}.` });
      },
    }),
    slot('parsons', 'build', 'Putting code with system variables in order', {
      followers(r) {
        return U.drawParsons(r, { rules: ['Paint a gray background on every frame.', 'Draw a rectangle at the mouse.', 'Draw a circle at the center of the canvas.', 'Print the width.', 'Print the height.'], lines: [`background(${r.pick([180, 200, 220])})`, 'rect(mouseX, mouseY, 40, 40)', 'ellipse(width/2, height/2, 40, 40)', 'console.log(width)', 'console.log(height)'], explain: 'They run in the order written.' });
      },
      mouseSize(r) {
        return U.drawParsons(r, { rules: ['Paint a gray background.', 'Draw an ellipse whose width is mouseX.', 'Draw a rectangle whose height is mouseY.', 'Print mouseX.', 'Print mouseY.'], lines: ['background(220)', `ellipse(100, 100, mouseX, ${at(r, 3, 9)})`, `rect(200, 100, ${at(r, 3, 9)}, mouseY)`, 'console.log(mouseX)', 'console.log(mouseY)'], explain: 'A variable can go anywhere a number can.' });
      },
      corners(r) {
        const s = at(r, 2, 5);
        return U.drawParsons(r, { rules: ['Paint a gray background.', 'Draw a square in the top-left corner.', 'Draw one in the bottom-right corner.', 'Draw a circle at the center.', 'Draw a line from the center to the mouse.'], lines: ['background(200)', `rect(0, 0, ${s}, ${s})`, `rect(width-${s}, height-${s}, ${s}, ${s})`, `ellipse(width/2, height/2, ${s}, ${s})`, 'line(width/2, height/2, mouseX, mouseY)'], explain: 'Subtracting the size keeps the square on the canvas.' });
      },
    }),
  ]);

  const NAMES = ['circleY', 'ellipseSize', 'boxX', 'score', 'lineTop', 'faceX'];

  U.lesson('U1LA3.2', 'Creating Custom Variables', '11-U1LA3.2-Creating-Custom-Variables.md', 20, 12, noFunctions, [
    slot('steps', 'concepts', 'Knowing how variables are created', {
      threeSteps(r) {
        const name = r.pick(NAMES); const n = at(r, 2, 30);
        const rows = r.shuffle([[`let ${name}`, 0], [`${name} = ${n}`, 1], [`ellipse(${name}, 100, 50, 50)`, 2]]);
        return kit.rowsQuestion({ prompt: 'Which step is each line?', columns: ['Code'], rows: rows.map(([text, answer]) => ({ cells: [text], answer })), options: ['declare', 'initialize', 'use'].map((text) => ({ text })), explain: 'Declare names it, initialize gives it a value, and then you use it.' });
      },
      why(r) {
        return choice(r, 'Five ellipses all use the same y value. Why use a variable for it?', 'Changing one value moves all of them', ['It makes the ellipses rounder', 'p5 requires one for every ellipse', 'It keeps the ellipses from overlapping'], 'A variable keeps a repeated value in one place.');
      },
      goodName(r) {
        const [good, bad] = r.pick([['circleY', 'q'], ['ellipseSize', 'zz'], ['boxX', 'thing']]);
        return choice(r, 'Which is the most useful name for a variable?', good, [bad, 'x1x1', 'aaa'], 'A clear name helps you keep track of what it holds.');
      },
    }),
    slot('scope', 'concepts', 'Understanding scope', {
      global(r) {
        const name = r.pick(NAMES);
        return choice(r, `${name} is declared above setup(). Where can it be used?`, 'In any function', ['Only in setup()', 'Only in draw()', 'Only on the line after it'], 'A variable declared outside of a function is global.', { code: [`let ${name}`, 'function setup(){', `  ${name} = 60`, '}'] });
      },
      local(r) {
        const name = r.pick(NAMES);
        return choice(r, `${name} is declared inside setup(). Where can it be used?`, 'Only inside setup()', ['In any function', 'Only inside draw()', 'Anywhere after setup() in the file'], 'A variable declared in a function is local to it.', { code: ['function setup(){', `  let ${name} = 60`, '}'] });
      },
      setupOnce(r) {
        const name = r.pick(NAMES);
        return choice(r, `Why give ${name} its starting value in setup() and not draw()?`, 'setup() runs once, while draw() runs over and over', ['setup() runs faster than draw()', 'draw() can\'t read variables', 'Only setup() can change a value'], 'A value set in draw() is reset on every frame.');
      },
    }),
    slot('trace', 'flow', 'Tracing a variable that changes', {
      add(r) {
        const name = r.pick(NAMES); const a = r.int(2, 30); const b = r.int(2, 30);
        return kit.printedNumber({ prompt: 'What number does this print?', code: [`let ${name} = ${a}`, `${name} = ${name} + ${b}`, `console.log(${name})`], explain: 'The right side is worked out first, and then stored.' });
      },
      twoVars(r) {
        const a = r.int(2, 30); const b = r.int(2, 30);
        return kit.printedNumber({ prompt: 'What number does this print?', code: [`let first = ${a}`, `let second = ${b}`, 'first = second', 'second = first + 1', 'console.log(second)'], explain: 'Follow the lines one at a time. Each variable holds only its latest value.' });
      },
      overwritten(r) {
        const name = r.pick(NAMES); const a = r.int(2, 30); const b = r.int(31, 60); const c = r.int(2, 9);
        return kit.printedNumber({ prompt: 'What number does this print?', code: [`let ${name} = ${a}`, `${name} = ${b}`, `${name} = ${name} * ${c}`, `console.log(${name})`], explain: 'A new value replaces the old one.' });
      },
    }),
    slot('anchor', 'flow', 'Using one variable to move a design', {
      offset(r) {
        const x = at(r, 5, 30); const d = at(r, 2, 9);
        const code = [`let circleX = ${x}`, 'ellipse(circleX, 60, 60, 60)', `ellipse(circleX + ${d}, 60, 60, 60)`];
        return kit.numberQuestion({ prompt: 'What is the x value of the second ellipse?', code, answer: U.shapesOf(code).shapes[1][1][0], explain: `circleX + ${d}.` });
      },
      changed(r) {
        const x = at(r, 5, 30); const m = at(r, 2, 9); const d = at(r, 2, 9);
        const code = [`let boxX = ${x}`, `boxX = boxX + ${m}`, `rect(boxX + ${d}, 20, 30, 30)`];
        return kit.numberQuestion({ prompt: 'What is the x value of the rectangle?', code, answer: U.shapesOf(code).shapes[0][1][0], explain: 'Work out boxX, and then add the offset.' });
      },
      howMany(r) {
        const d = at(r, 1, 9);
        return choice(r, `To move this whole design ${d} to the right, what do you need to change?`, `Only the value of circleX, adding ${d}`, ['Every number in every ellipse', 'The width of the canvas', 'Nothing, since variables move by themselves'], 'Every shape is placed relative to circleX.', { code: ['let circleX = 120', 'ellipse(circleX, 60, 60, 60)', 'ellipse(circleX + 80, 60, 60, 60)', 'ellipse(circleX + 160, 60, 60, 60)'] });
      },
    }),
    slot('bug', 'flow', 'Finding bugs in variable code', {
      notInitialized(r) {
        const name = r.pick(NAMES); const v = at(r, 2, 20);
        return U.bug(r, { prompt: `${name} should hold ${v} when it gets printed.`, code: [`let ${name}`, `console.log(${name})`, `${name} = ${v}`], fixed: [`let ${name}`, `${name} = ${v}`, `console.log(${name})`], line: [1, 2], why: 3, explain: 'Give it a value before you use it.' });
      },
      misspelled(r) {
        const v = at(r, 2, 20);
        return U.bug(r, { prompt: 'This should print the value of boxX.', code: [`let boxX = ${v}`, 'console.log(boxx)'], fixed: [`let boxX = ${v}`, 'console.log(boxX)'], line: 1, why: 2, explain: 'Variable names have to match exactly, including capitals.' });
      },
      declaredTwice(r) {
        const a = at(r, 2, 20); const b = at(r, 21, 40);
        return U.bug(r, { prompt: `This should change score to ${b}.`, code: [`let score = ${a}`, `let score = ${b}`, 'console.log(score)'], fixed: [`let score = ${a}`, `score = ${b}`, 'console.log(score)'], line: 1, why: 5, explain: 'let is only for creating a variable. To change one, leave let out.' });
      },
    }),
    slot('blanks', 'build', 'Completing variable code', {
      make(r) {
        const v = at(r, 2, 20);
        return kit.blanksQuestion(r, { prompt: `Complete the code so circleY holds ${v}, and both ellipses use it.`, lines: [[tok('let', 'k'), ' circleY'], ['circleY ', tok('=', 'o'), ' ', tok(v, 'n')], ['ellipse(100, ', tok('circleY', 'v'), ', 50, 50)'], ['ellipse(200, ', tok('circleY', 'v'), ', 50, 50)']], must: ['k', 'v'], count: 3, pools: { k: ['if', 'function'], o: ['=='], n: [v + 10], v: ['width', 'mouseY'] }, spec: U.spec([{ mouseY: 7 }]), explain: 'Declare it, give it a value, and use it where the number was.' });
      },
      offset(r) {
        const x = at(r, 5, 30); const d = at(r, 2, 9);
        return kit.blanksQuestion(r, { prompt: `Complete the code so the second ellipse is always ${d} to the right of the first.`, lines: [[`let circleX = ${x}`], ['ellipse(', tok('circleX', 'v'), ', 60, 60, 60)'], ['ellipse(', tok('circleX', 'v'), ' + ', tok(d, 'n'), ', 60, 60, 60)']], must: ['v', 'n'], count: 3, pools: { v: ['circleY', 'width'], n: [d + 10, x] }, spec: U.spec([{ width: 400 }]), explain: 'Base the second position on the first, with the distance added.' });
      },
      update(r) {
        const name = r.pick(NAMES); const a = r.int(2, 30); const b = r.int(2, 30);
        return kit.blanksQuestion(r, { prompt: `Complete the code so ${name} goes up by ${b}, and then gets printed.`, lines: [[`let ${name} = ${a}`], [tok(name, 'v'), ' = ', tok(name, 'v'), ' + ', tok(b, 'n')], ['console.log(', tok(name, 'v'), ')']], must: ['v'], count: 3, pools: { v: ['width', 'height'], n: [b + 1] }, spec: U.spec([{ width: 400, height: 400 }]), explain: 'Use the old value on the right, and store the new one on the left.' });
      },
    }),
    slot('parsons', 'build', 'Putting variable code in order', {
      globalFlow(r) {
        const n = at(r, 2, 20);
        return kit.parsonsQuestion(r, {
          prompt: `Put these lines in order so the code does this:\n${kit.numberedRules(['Declare circleY outside of the functions.', `Give it a value of ${n} in setup().`, 'Use it to draw an ellipse in draw().'])}`,
          prefix: [{ text: 'let circleY' }],
          movable: ['function setup(){', `circleY = ${n}`, '}', 'function draw(){', 'ellipse(100, circleY, 50, 50)'],
          suffix: [{ text: '}' }],
          spec: { kind: 'sketch', vectors: [{}] },
          explain: 'setup() runs once to give it a value, and then draw() can use it.',
        });
      },
      trace(r) {
        const a = r.int(2, 20); const b = r.int(2, 9);
        return kit.parsonsQuestion(r, {
          prompt: `Put these lines in order so the code does this:\n${kit.numberedRules([`Make total hold ${a}, and print it.`, `Add ${b} to total, and print it.`, 'Double total, and print it.'])}`,
          prefix: [],
          movable: [`let total = ${a}`, 'console.log(total)', `total = total + ${b}`, 'console.log(total)', 'total = total * 2', 'console.log(total)'],
          suffix: [],
          spec: U.spec(),
          explain: 'A variable has to exist before you can print or change it.',
        });
      },
      design(r) {
        const x = at(r, 5, 20); const y = at(r, 5, 20);
        return kit.parsonsQuestion(r, {
          prompt: `Put these lines in order so the code does this:\n${kit.numberedRules([`Make faceX hold ${x}, and faceY hold ${y}.`, 'Draw the head at (faceX, faceY).', 'Then draw the left eye, and then the right eye, on top of it.'])}`,
          prefix: [],
          movable: [`let faceX = ${x}`, `let faceY = ${y}`, 'ellipse(faceX, faceY, 100, 100)', 'ellipse(faceX - 20, faceY, 10, 10)', 'ellipse(faceX + 20, faceY, 10, 10)'],
          suffix: [],
          spec: U.spec(),
          explain: 'Variables come first, and the head goes under the eyes.',
        });
      },
    }),
  ]);
})(CodeCheck);


// ---- src/lessons/u1la4.js ----
// U1LA4.1 to U1LA4.4 and U1LA5.1: abstraction, function calls, custom functions, random(),
// and function libraries. Students have NOT seen: conditionals, return values, or loops.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const U = CC.u1;
  const { tok } = kit;
  const { slot, choice, at } = U;
  const noLogic = U.NO_LOGIC;

  const TASKS = [
    ['washHands', ['turnOnSink', 'getSoap', 'sudsHands', 'rinseHands', 'dryHands'], 'wash your hands'],
    ['brushTeeth', ['getBrush', 'addToothpaste', 'scrubTeeth', 'rinseMouth', 'putBrushAway'], 'brush your teeth'],
    ['smileyFace', ['drawHead', 'drawLeftEye', 'drawRightEye', 'drawNose', 'drawMouth'], 'draw a smiley face'],
    ['makeToast', ['getBread', 'loadToaster', 'pressLever', 'removeToast', 'spreadButter'], 'make toast'],
  ];
  const stubs = (names) => names.map((n) => `function ${n}(){\n  console.log("${n}")\n}`);

  // ---- U1LA4.1 ----
  U.lesson('U1LA4.1', 'What is Abstraction?', '12-U1LA4.1-What-is-Abstraction.md', 12, 8, noLogic.concat([[/\brandom\(/, 'random (U1LA4.4)']]), [
    slot('define', 'concepts', 'Defining abstraction', {
      meaning(r) {
        return choice(r, 'What does abstraction mean in computer science?', 'A simplified version of something that hides the technical details', ['Making code as long and detailed as possible', 'Adding color and style to a drawing', 'Fixing errors in a program'], 'An abstraction lets you use something without handling every detail.');
      },
      generalize(r) {
        return choice(r, 'What does it mean to generalize a process?', 'To make it more widely applicable', ['To make it work for just one case', 'To delete it from a program', 'To rename it'], 'General processes can be reused in many situations.');
      },
      procedural(r) {
        return choice(r, 'What is procedural abstraction?', 'Giving a repeated process a name so that it can be reused', ['Drawing a process on paper', 'Running a process only once', 'Writing a process in a different language'], 'You call the name, rather than retyping every step.');
      },
    }),
    slot('examples', 'concepts', 'Recognizing abstractions in code', {
      lineFn(r) {
        const v = () => at(r, 2, 38);
        return choice(r, 'Why is this function call an abstraction?', 'It hides the code needed to draw a line behind one name', ['It draws abstract art', 'It has no parameters', 'It only works on one canvas size'], 'line() was written by a programmer and included in the p5.js library.', { code: [`line(${v()}, ${v()}, ${v()}, ${v()})`] });
      },
      steps(r) {
        const [name, steps] = r.pick(TASKS);
        return choice(r, 'Which one is the abstraction here?', `${name}()`, [`The first step inside of it, ${r.pick(steps)}()`, 'A comment at the end of the program', 'The canvas'], 'The name stands for all of the steps.', { code: [`${name}()`] });
      },
      benefit(r) {
        return choice(r, 'A program draws the same face in four places. What does a function named drawFace give you?', 'One place to write the steps, and a short name to reuse them', ['Four different faces with no code', 'A bigger canvas', 'Faster typing of every step, four times'], 'Functions reduce repetition.');
      },
    }),
    slot('algorithm', 'flow', 'Following the steps behind an abstraction', {
      firstStep(r) {
        const [name, steps] = r.pick(TASKS);
        const code = stubs(steps).concat([`function ${name}(){`], steps.map((s) => `  ${s}()`), ['}', `${name}()`]);
        return choice(r, `What gets printed first when ${name}() is called?`, kit.printed(code)[0], steps.slice(1, 4), 'The steps run from top to bottom.', { code: [`function ${name}(){`].concat(steps.map((s) => `  ${s}()`), ['}', `${name}()`]) });
      },
      count(r) {
        const [name, steps] = r.pick(TASKS); const calls = r.int(2, 4);
        const code = stubs(steps).concat([`function ${name}(){`], steps.map((s) => `  ${s}()`), ['}'], Array.from({ length: calls }, () => `${name}()`));
        return kit.numberQuestion({ prompt: `Each step prints one line. How many lines get printed in total?`, code: [`function ${name}(){`].concat(steps.map((s) => `  ${s}()`), ['}'], Array.from({ length: calls }, () => `${name}()`)), answer: kit.printed(code).length, explain: `${steps.length} steps for each of ${calls} calls.` });
      },
      neverCalled(r) {
        const [name, steps] = r.pick(TASKS);
        const shown = [`function ${name}(){`].concat(steps.map((s) => `  ${s}()`), ['}']);
        return kit.numberQuestion({ prompt: 'Each step prints one line. How many lines get printed by this whole program?', code: shown, answer: kit.printed(stubs(steps).concat(shown)).length, explain: 'Defining a function doesn\'t run it. It only runs when it is called.' });
      },
    }),
    slot('parsons', 'build', 'Writing the algorithm behind an abstraction', ...[{
      task0(r) { return order(r, 0); },
      task1(r) { return order(r, 1); },
      task2(r) { return order(r, 2); },
      task3(r) { return order(r, 3); },
    }]),
  ]);

  function order(r, i) {
    const [name, steps, words] = TASKS[i];
    return kit.parsonsQuestion(r, {
      prompt: `Put these lines in order so ${name} is an algorithm to ${words}. Choose the order that makes sense in real life.`,
      prefix: [{ text: `function ${name}(){` }],
      movable: steps.map((s) => `${s}()`),
      suffix: [{ text: '}' }, { text: `${name}()` }],
      spec: { kind: 'snippet', hiddenPrefix: stubs(steps).join('\n').split('\n'), vectors: [{}] },
      explain: 'The steps of an algorithm have to run in a sensible order.',
    });
  }

  // ---- U1LA4.2 ----
  const SAMPLE_CALLS = (r) => [
    `rect(${at(r, 2, 30)}, ${at(r, 2, 30)}, ${at(r, 2, 10)}, ${at(r, 2, 10)})`,
    `ellipse(${at(r, 2, 30)}, ${at(r, 2, 30)}, ${at(r, 2, 10)}, ${at(r, 2, 10)})`,
    `line(${at(r, 2, 30)}, ${at(r, 2, 30)}, ${at(r, 2, 30)}, ${at(r, 2, 30)})`,
  ];
  const WASH = (r) => {
    const [name, a, b] = r.pick([['washHands', 'brand', 'time'], ['makeTea', 'flavor', 'minutes'], ['paintWall', 'color', 'coats']]);
    return { name, a, b };
  };

  U.lesson('U1LA4.2', 'Intro to Functions && Function Calls', '13-U1LA4.2-Intro-to-Functions-and-Function-Calls.md', 12, 8, noLogic.concat([[/\brandom\(/, 'random (U1LA4.4)']]), [
    slot('terms', 'concepts', 'Telling calls, parameters, and arguments apart', {
      parts(r) {
        const { name, a, b } = WASH(r); const n = r.int(1, 9);
        const rows = r.shuffle([[`${a}, ${b}`, 0], [`"soap", ${n}`, 1], [name, 2]]);
        return kit.rowsQuestion({ prompt: 'What is each part of this code?', code: [`function ${name}(${a}, ${b}){`, '}', `${name}("soap", ${n})`], columns: ['Part'], rows: rows.map(([text, answer]) => ({ cells: [text], answer })), options: ['parameters', 'arguments', 'function name'].map((text) => ({ text })), explain: 'Parameters are named in the definition, and arguments are the values in the call.' });
      },
      whatIsCall(r) {
        return choice(r, 'What does calling a function do?', 'It runs the steps the function stands for', ['It deletes the function', 'It renames the function', 'It only checks the spelling of the function'], 'A call is the function\'s name, with parentheses, to run it.');
      },
      whyParams(r) {
        return choice(r, 'Why do functions have parameters?', 'So the same function can behave differently each time it is called', ['So that the function can only run once', 'To make the function name longer', 'To keep the function from being called'], 'Parameters are the inputs that you control.');
      },
    }),
    slot('spot', 'concepts', 'Identifying function calls in code', {
      howManyCalls(r) {

  } = kit;

  const TRUE_FALSE = [{ text: 'true' }, { text: 'false' }];
  const COMPARE_PROMPT = 'For each row, decide whether the expression is true or false.';
  const ALL_OPS = ['>', '<', '>=', '<=', '==', '!='];

  function expressionRows(r, { code, expressions, vars, explain }) {
    return kit.rowsQuestion({
      prompt: COMPARE_PROMPT,
      code,
      columns: ['Expression'],
      rows: r.shuffle(expressions).map((expr) => ({ cells: [expr], answer: CC.evalExpr(expr, vars || {}) ? 0 : 1 })),
      options: TRUE_FALSE,

    });

  // A mix that always has both kinds of answer, but not always the same split.
  const pickTruths = (r) => r.shuffle(r.pick([
    [true, true, false, false],
    [true, true, true, false],
    [true, false, false, false],
  ]));

  // sameSides makes both numbers match, for the row that checks > versus >=.
  function compareExpression(r, want, makeLeft, makeRight, sameSides) {
    for (let tries = 0; tries < 200; tries++) {
      const left = makeLeft();
      const op = r.pick(ALL_OPS);
      let right = makeRight();
      if (sameSides) right = left;
      else if (right === left) continue;
      const expr = `${left} ${op} ${right}`;
      if (!!CC.evalExpr(expr, {}) === want) return expr;
    }
    throw new Error('Could not build a comparison');
  }

                return expr;
              }
            }

            const change = s.a.step * r.int(2, 6);
            return [`let ${n} = ${r.pick(kit.valuesOf(s.a))}`, `${n} = ${n} + ${change}`].concat(
              chainLines([{ cond: A.text, body: log(s.outcomes[0]) }], log(s.outcomes[1])),
            );
          }, 'Code runs from top to bottom, so the if checks the new value.');
        },
      },
      {
        id: 'inside-a-function',
        make(r) {
          const fn = r.pick(kit.FUNCTION_NAMES);
          return kit.buildFlow(r, () => {
            const s = kit.pickScene(r);
            const A = side(s.a, pickOp(r), r.pick(s.a.thresholds));
            return [`function ${fn}(${s.a.name}){`].concat(
              chainLines([{ cond: A.text, body: log(s.outcomes[0]) }], log(s.outcomes[1]), '  '),
              ['}', '', log('Starting'), `${fn}(${r.pick(kit.valuesOf(s.a))})`],
            );
          }, 'The function\'s code only runs when it is called, using the value passed in.');
        },
      },
    ],
  };

  const OTHER_REASONS = [WHY.elseNoCondition, WHY.quotes, WHY.assign, WHY.backwards, WHY.bracket];
  const others = (r, why) => r.sample(OTHER_REASONS.filter((reason) => reason !== why), 3);

  const bugSlot = {
    id: 'bug',
    skill: 'flow',
    concept: 'Finding and explaining bugs in an if and else',
    patterns: [
      {
        id: 'equals-sign',
        make(r) {
          const s = kit.pickScene(r);
          const n = s.a.name;
          const t = s.a.t;
          const lets = [`let ${n} = ${r.pick(kit.valuesOf(s.a))}`];
          const rest = (cond) => chainLines([{ cond, body: log(s.outcomes[0]) }], log(s.outcomes[1]));
          return kit.bugQuestion(r, {
            prompt: `This code should print "${s.outcomes[0]}" only when ${s.a.noun} is exactly ${t}. Tap the line with the bug, then choose why it is wrong.`,
            code: lets.concat(rest(`${n} = ${t}`)),
            bugLines: [1],
            why: WHY.assign,
            others: others(r, WHY.assign),
            fixed: lets.concat(rest(`${n} == ${t}`)),
            spec: { kind: 'snippet', vectors: kit.sceneVectors([side(s.a, '==', t)]) },
            explain: `It should be if(${n} == ${t}){`,
          });
        },
      },
      {
        id: 'word-without-quotes',
        make(r) {
          const w = kit.pickWordVar(r);
          const target = r.pick(w.values);
          const [m1, m2] = kit.pickScene(r).outcomes;
          const lets = [`let ${w.name} = ${lit(r.pick(w.values))}`];
          const rest = (cond) => chainLines([{ cond, body: log(m1) }], log(m2));
          return kit.bugQuestion(r, {
            prompt: `This code should print "${m1}" only when ${w.noun} is ${target}. Tap the line with the bug, then choose why it is wrong.`,
            code: lets.concat(rest(`${w.name} == ${target}`)),
            bugLines: [1],
            why: WHY.quotes,
            others: others(r, WHY.quotes),
            fixed: lets.concat(rest(`${w.name} == "${target}"`)),
            spec: { kind: 'snippet', vectors: kit.sceneVectors([side(w, '==', target)]) },
            explain: `It should be if(${w.name} == "${target}"){`,
          });
        },
      },
      {
        id: 'comparison-backwards',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, r.pick(['>', '<']), s.a.t);
          const lets = [`let ${s.a.name} = ${r.pick(kit.valuesOf(s.a))}`];
          const rest = (cond) => chainLines([{ cond, body: log(s.outcomes[0]) }], log(s.outcomes[1]));
          return kit.bugQuestion(r, {
            prompt: `This code should print "${s.outcomes[0]}" only when ${say(A)}. Tap the line with the bug, then choose why it is wrong.`,
            code: lets.concat(rest(kit.flipSide(A).text)),
            bugLines: [1],
            why: WHY.backwards,
            others: others(r, WHY.backwards),
            fixed: lets.concat(rest(A.text)),
            spec: { kind: 'snippet', vectors: kit.sceneVectors([A]) },
            explain: `It should be if(${A.text}){`,
          });
        },
      },
      {
        id: 'else-with-a-condition',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, r.pick(['>', '<']), s.a.t);
          const lets = [`let ${s.a.name} = ${r.pick(kit.valuesOf(s.a))}`];
          const [m1, m2] = s.outcomes;
          return kit.bugQuestion(r, {
            prompt: `This code should print "${m1}" when ${say(A)}, and "${m2}" otherwise. Tap the line with the bug, then choose why it is wrong.`,
            code: lets.concat(ifBlock(A.text, log(m1)), [`else(${kit.flipSide(A).text}){`, `  ${log(m2)}`, '}']),
            bugLines: [4],
            why: WHY.elseNoCondition,
            others: others(r, WHY.elseNoCondition),
            fixed: lets.concat(chainLines([{ cond: A.text, body: log(m1) }], log(m2))),
            spec: { kind: 'snippet', vectors: kit.sceneVectors([A]) },
            explain: 'else runs whenever the if is false, so it is written with no condition: else{',
          });
        },
      },
    ],
  };

  const blankIf = (variable, op, value) => ['if(', tok(variable, 'var'), ' ', tok(op, 'op'), ' ', tok(value, 'num'), '){'];
  const blankBody = (message) => ['  console.log(', tok(lit(message), 'msg'), ')'];

  const blanksSlot = {
    id: 'blanks',
    skill: 'build',
    concept: 'Completing an if and else',
    patterns: [
      {
        id: 'number',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, pickOp(r), s.a.t);
          const [m1, m2] = s.outcomes;
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so it prints "${m1}" when ${say(A)}. Otherwise, it should print "${m2}".`,
            lines: [
              { text: `let ${s.a.name} = ${s.a.t}`, run: `let ${s.a.name} = __in.${s.a.name}` },
              blankIf(s.a.name, A.op, s.a.t),
              blankBody(m1),
              { text: '}' },
              [tok('else', 'kw'), '{'],
              blankBody(m2),
              { text: '}' },
            ],
            must: ['op'],
            count: 3,
            pools: {
              op: ['>', '<', '>=', '<=', '=='], var: [s.a.name, s.b.name], num: s.a.thresholds, kw: ['if', 'else'], msg: s.outcomes.map(lit),
            },
            spec: { kind: 'snippet', vectors: kit.sceneVectors([A]) },
            explain: `if(${A.text}){ runs the first message, and else runs the other one.`,
          });
        },
      },
      {
        id: 'word',
        make(r) {
          const w = kit.pickWordVar(r);
          const target = r.pick(w.values);
          const [m1, m2, m3] = kit.pickScene(r).outcomes;
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so it prints "${m1}" when ${w.noun} is ${target}. Otherwise, it should print "${m2}".`,
            lines: [
              { text: `let ${w.name} = "${target}"`, run: `let ${w.name} = __in.${w.name}` },
              ['if(', tok(w.name, 'var'), ' ', tok('==', 'op'), ' ', tok(`"${target}"`, 'str'), '){'],
              blankBody(m1),
              { text: '}' },
              [tok('else', 'kw'), '{'],
              blankBody(m2),
              { text: '}' },
            ],
            must: ['op', 'str'],
            count: 3,
            pools: {
              op: ['=', '!='], var: [w.name, 'word'], str: [target].concat(w.values.filter((v) => v !== target).map(lit)), kw: ['if', 'else'], msg: [m1, m2, m3].map(lit),
            },
            spec: { kind: 'snippet', vectors: kit.sceneVectors([side(w, '==', target)]) },
            explain: `Comparing uses ==, and a word needs quotation marks: if(${w.name} == "${target}"){`,
          });
        },
      },
      {
        id: 'mouse-color',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          const isX = r.chance(0.5);
          const up = r.chance(0.5);
          const where = isX ? (up ? 'on the right side' : 'on the left side') : (up ? 'in the bottom half' : 'in the top half');
          const cut = isX ? c.cx : c.cy;
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so ${V} turns ${c1.name} when the mouse is ${where} of ${kit.canvasName(c)}, and ${c2.name} otherwise.`,
            lines: [
              ['if(', tok(isX ? 'mouseX' : 'mouseY', 'var'), ' ', tok(up ? '>' : '<', 'op'), ' ', tok(cut, 'num'), '){'],
              { text: `  ${kit.setColor(V, c1)}` },
              { text: '}' },
              [tok('else', 'kw'), '{'],
              { text: `  ${kit.setColor(V, c2)}` },
              { text: '}' },
            ],
            must: ['op'],
            count: 3,
            pools: {
              op: ['>', '<', '=='], var: ['mouseX', 'mouseY'], num: [cut, cut + 50, cut + 100], kw: ['if', 'else'],
            },
            spec: {
              kind: 'snippet',
              hiddenPrefix: [`let ${V} = "none"`],
              hiddenSuffix: [`console.log(${V})`],
              vectors: kit.mouseVectors(c.w, c.h, [c.cx], [c.cy]),
            },
            explain: `mouseX gets bigger going right, and mouseY gets bigger going down. So it should be if(${isX ? 'mouseX' : 'mouseY'} ${up ? '>' : '<'} ${cut}){`,
          });
        },
      },
      {
        id: 'anything-except',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, '!=', s.a.t);
          const [m1, m2] = s.outcomes;
          return kit.blanksQuestion(r, {
            prompt: `Complete the code so it prints "${m1}" when ${s.a.noun} is anything except ${s.a.t}. If it is exactly ${s.a.t}, it should print "${m2}".`,
            lines: [
              { text: `let ${s.a.name} = ${s.a.t}`, run: `let ${s.a.name} = __in.${s.a.name}` },
              blankIf(s.a.name, '!=', s.a.t),
              blankBody(m1),
              { text: '}' },
              [tok('else', 'kw'), '{'],
              blankBody(m2),
              { text: '}' },
            ],
            must: ['op'],
            count: 3,
            pools: {
              op: ['==', '>', '<'], var: [s.a.name, s.b.name], num: s.a.thresholds, kw: ['if', 'else'], msg: s.outcomes.map(lit),
            },
            spec: { kind: 'snippet', vectors: kit.sceneVectors([side(s.a, '==', s.a.t)]) },
            explain: `!= means "not the same as": if(${A.text}){`,
          });
        },
      },
    ],
  };

  const SCRAMBLE_PROMPT = 'Put these lines in order so the code does this:';
  const DRAW_PREFIX = [{ text: 'function draw(){' }];
  const DRAW_SUFFIX = [{ text: '}' }];

  const parsonsSlot = {
    id: 'parsons',
    skill: 'build',
    concept: 'Putting scrambled if and else code in order',
    patterns: [
      {
        id: 'number-if-else',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, pickOp(r), s.a.t);
          const [m1, m2] = s.outcomes;
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              `If ${say(A)}, print "${m1}".`,
              `Otherwise, print "${m2}".`,
              'At the very end, always print "Finished".',
            ])}`,
            prefix: [{ text: `let ${s.a.name} = ${s.a.t}`, run: `let ${s.a.name} = __in.${s.a.name}` }],
            movable: chainLines([{ cond: A.text, body: log(m1) }], log(m2)).concat([log('Finished')]),
            spec: { kind: 'snippet', vectors: kit.sceneVectors([A]) },
            explain: 'The if comes first, then its else. "Finished" goes after both, so it always prints.',
          });
        },
      },
      {
        id: 'word-if-else',
        make(r) {
          const w = kit.pickWordVar(r);
          const target = r.pick(w.values);
          const [m1, m2] = kit.pickScene(r).outcomes;
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              'First, always print "Checking".',
              `If ${w.noun} is ${target}, print "${m1}".`,
              `Otherwise, print "${m2}".`,
            ])}`,
            prefix: [{ text: `let ${w.name} = "${target}"`, run: `let ${w.name} = __in.${w.name}` }],
            movable: [log('Checking')].concat(chainLines([{ cond: `${w.name} == "${target}"`, body: log(m1) }], log(m2))),
            spec: { kind: 'snippet', vectors: kit.sceneVectors([side(w, '==', target)]) },
            explain: 'Code runs top to bottom, so "Checking" goes before the if.',
          });
        },
      },
      {
        id: 'circle-color',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const [c1, c2] = r.sample(kit.COLORS, 2);
          const V = r.pick(kit.COLOR_VARS.shape);
          const op = r.pick(['>', '<']);
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              'Paint a gray background behind everything.',
              `On ${kit.canvasName(c)}, if the mouse is on the ${op === '>' ? 'right' : 'left'} side, make ${V} ${c1.name}. Otherwise, make it ${c2.name}.`,
              `Fill with ${V} and draw the circle on top of the background.`,
            ])}`,
            prefix: DRAW_PREFIX,
            movable: ['background(220)'].concat(
              chainLines([{ cond: `mouseX ${op} ${c.cx}`, body: kit.setColor(V, c1) }], kit.setColor(V, c2)),
              [`fill(${V})`, `ellipse(${c.cx}, ${c.cy}, 100, 100)`],
            ),
            suffix: DRAW_SUFFIX,
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${V}`, 'function setup(){', `  createCanvas(${c.w}, ${c.h})`, `  ${V} = color(255, 255, 255)`, '}'],
              vectors: kit.mouseVectors(c.w, c.h, [c.cx], []),
            },
            explain: 'background() goes before ellipse(), or it paints over the circle. Each color goes right after its condition.',
          });
        },
      },
      {
        id: 'shape-appears',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const op = r.pick(['>', '<']);
          return kit.parsonsQuestion(r, {
            prompt: `${SCRAMBLE_PROMPT}\n${numberedRules([
              'Paint a gray background behind everything.',
              `On ${kit.canvasName(c)}, draw the circle only when the mouse is in the ${op === '>' ? 'bottom' : 'top'} half.`,
              'Always draw the square on top of the background.',
            ])}`,
            prefix: DRAW_PREFIX,
            movable: ['background(220)'].concat(
              ifBlock(`mouseY ${op} ${c.cy}`, `ellipse(${c.cx}, ${c.cy}, 80, 80)`),
              ['rect(10, 10, 50, 50)'],
            ),
            suffix: DRAW_SUFFIX,
            spec: {
              kind: 'sketch',
              hiddenPrefix: ['function setup(){', `  createCanvas(${c.w}, ${c.h})`, '}'],
              vectors: kit.mouseVectors(c.w, c.h, [], [c.cy]),
            },
            explain: 'Only the circle goes inside the if. The square stays outside it, so it always draws.',
          });
        },
      },
    ],
  };

  CC.defineLesson({
    id: 'U2LA1.1',
    title: 'Conditionals and If Statements',
    unit: 2,
    source: 'curriculum/02-unit-2/02-U2LA1.1-Conditionals-and-If-Statements.md',
    defaults: {
      minutes: 15, questions: 9, attempts: 2, practice: true,
    },
    notYetTaught: [
      [/else if/, 'else if (U2LA1.2)'],
      [/&&|\|\|/, '&& and || (U2LA1.3)'],
      [/\breturn\b/, 'return values (U2LA3.2)'],
      [/\bfor\b\s*\(|\bwhile\b\s*\(/, 'loops (Unit 3)'],
      [/\[/, 'arrays (Unit 3)'],
    ],
    slots: [compareSlot, ruleSlot, regionSlot, traceSlot, mouseSlot, flowSlot, bugSlot, blanksSlot, parsonsSlot],
    priority: ['parsons', 'traceIf', 'compare', 'blanks', 'region', 'lines', 'bug', 'rule', 'mouseRows'],
  });
})(CodeCheck);


// ---- src/lessons/u2la1-2.js ----
// U2LA1.2: Conditionals and if, else if, and else statements
// curriculum/02-unit-2/03-U2LA1.2-Conditionals-and-if-else-if-and-else-statements.md
//
// Students at this point have seen: variables, functions with parameters, mouseX/mouseY,
// color(), comparing with == != < > <= >=, if, else if, and else.
// They have NOT seen: && or ||, return values, loops, arrays, or objects.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const {
    side, tok, log, chainLines, ifBlock, numberedRules, WHY, lit,
  } = kit;

  // Three dividing values, biggest first.
  const pickThree = (r, v) => r.sample(v.thresholds.length >= 3 ? v.thresholds : v.thresholds.concat(v.hi - v.step), 3).sort((a, b) => b - a);

  // A chain of tiers such as: at least 90, at least 70, at least 50, otherwise.
  function tiers(r) {
    const s = kit.pickScene(r);
    const v = s.a;
    const [t1, t2, t3] = pickThree(r, v);
    return {
      v, t1, t2, t3, messages: s.outcomes.slice(0, 4),
    };
  }

  const chainOf = (conds, messages) => chainLines(
    conds.map((cond, i) => ({ cond, body: log(messages[i]) })),
    log(messages[conds.length]),
  );

  const FIRST_TRUE = 'The program checks each condition in order. It runs the first true one, then skips the rest of the chain.';

  const traceSlot = {
    id: 'chainTrace',
    skill: 'flow',
    concept: 'Following if / else if / else: the first true condition wins',
    patterns: [
      {
        id: 'at-least-tiers',
        make(r) {
          const {
            v, t1, t2, t3, messages,
          } = tiers(r);
          const value = r.pick(kit.valuesOf(v));
          const [m1, m2, m3, m4] = messages;
          return kit.traceChoice(r, {
            code: [`let ${v.name} = ${value}`].concat(chainOf([`${v.name} >= ${t1}`, `${v.name} >= ${t2}`, `${v.name} >= ${t3}`], messages)),
            wrong: [[m1], [m2], [m3], [m4], [m1, m2], [m2, m3]],
            explain: FIRST_TRUE,
          });
        },
      },
      {
        id: 'below-tiers',
        make(r) {
          const {
            v, t1, t2, t3, messages,
          } = tiers(r);
          const value = r.pick(kit.valuesOf(v));
          const [m1, m2, m3, m4] = messages;
          return kit.traceChoice(r, {
            code: [`let ${v.name} = ${value}`].concat(chainOf([`${v.name} < ${t3}`, `${v.name} < ${t2}`, `${v.name} < ${t1}`], messages)),
            wrong: [[m1], [m2], [m3], [m4], [m1, m2], [m2, m3]],
            explain: FIRST_TRUE,
          });
        },
      },
      {
        id: 'matching-words',
        make(r) {
          const w = kit.pickWordVar(r);
          const [a, b, c] = r.sample(w.values, 3);
          const value = r.pick(w.values);
          const [m1, m2, m3, m4] = kit.pickScene(r).outcomes;
          return kit.traceChoice(r, {
            code: [`let ${w.name} = ${lit(value)}`].concat(chainOf([`${w.name} == ${lit(a)}`, `${w.name} == ${lit(b)}`, `${w.name} == ${lit(c)}`], [m1, m2, m3, m4])),
            wrong: [[m1], [m2], [m3], [m4]],
            explain: 'Only one of these can match. If none of them do, the else runs.',
          });
        },
      },
      {
        id: 'two-variables',
        make(r) {
          const s = kit.pickScene(r);
          const values = kit.sceneValues(r, s)();
          const [m1, m2, m3] = s.outcomes;
          const A = side(s.a, kit.pickOp(r), s.a.t);
          const B = side(s.b, kit.pickOp(r), s.b.t);
          return kit.traceChoice(r, {
            code: kit.letLines(values).concat(chainOf([A.text, B.text], [m1, m2, m3])),
            wrong: [[m1], [m2], [m3], [m1, m2], []],
            explain: `${FIRST_TRUE} If the first condition is true, the else if never gets checked.`,
          });
        },
      },
    ],
  };

  const WHICH_PROMPT = (name, message) => `Which value of ${name} makes this code print "${message}"?`;

  function satisfyQuestion(r, { name, code, message, values, branchOf, target, show }) {
    const hits = values.filter((n) => branchOf(n) === target);
    const misses = r.sample(values.filter((n) => branchOf(n) !== target), 3);
    const correct = r.pick(hits);
    return kit.choiceQuestion(r, {
      prompt: WHICH_PROMPT(name, message),
      code,
      correct: show(correct),
      wrong: misses.map(show),
      codeOptions: true,
      explain: `With ${name} = ${show(correct)}, the chain ends up at "${message}". Try each value, checking the conditions from the top.`,
    });
  }

  const satisfySlot = {
    id: 'satisfy',
    skill: 'concepts',
    concept: 'Working out what value satisfies a condition',
    patterns: [
      {
        id: 'at-least-tiers',
        make(r) {
          const {
            v, t1, t2, messages,
          } = tiers(r);
          const conds = [`${v.name} >= ${t1}`, `${v.name} >= ${t2}`];
          const target = r.int(0, 2);
          const trio = messages.slice(0, 3);
          return satisfyQuestion(r, {
            name: v.name,
            code: chainOf(conds, trio),
            message: trio[target],
            values: kit.valuesOf(v),
            branchOf: (n) => kit.firstTrue(conds, { [v.name]: n }),
            target,
            show: String,
          });
        },
      },
      {
        id: 'below-tiers',
        make(r) {
          const {
            v, t1, t2, messages,
          } = tiers(r);
          const conds = [`${v.name} < ${t2}`, `${v.name} < ${t1}`];
          const target = r.int(0, 2);
          const trio = messages.slice(0, 3);
          return satisfyQuestion(r, {
            name: v.name,
            code: chainOf(conds, trio),
            message: trio[target],
            values: kit.valuesOf(v),
            branchOf: (n) => kit.firstTrue(conds, { [v.name]: n }),
            target,
            show: String,
          });
        },
      },
      {
        id: 'matching-words',
        make(r) {
          const w = kit.pickWordVar(r);
          const [a, b] = r.sample(w.values, 2);
          const conds = [`${w.name} == ${lit(a)}`, `${w.name} == ${lit(b)}`];
          const trio = kit.pickScene(r).outcomes.slice(0, 3);
          const target = r.int(0, 1);
          return satisfyQuestion(r, {
            name: w.name,
            code: chainOf(conds, trio),
            message: trio[target],
            values: w.values,
            branchOf: (n) => kit.firstTrue(conds, { [w.name]: n }),
            target,
            show: lit,
          });
        },
      },
      {
        id: 'mouse-position',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const conds = [`mouseX > ${c.cx}`, `mouseX < ${c.cx}`];

  // Each version of the code has to really behave differently from the right one.
  function orderQuestion(r, { rule, correct, wrong, spec, explain }) {
    const run = (lines) => [].concat(kit.fromInputs(spec.names, spec.lets), lines).join('\n');
    wrong.forEach((lines) => {
      if (CC.sameBehavior(spec, run(correct), run(lines))) throw new Error(`A wrong version works:\n${lines.join('\n')}`);
    });
    return kit.choiceQuestion(r, {
      prompt: 'Which version of the code follows this rule?',
      rule,
      correct: correct.join('\n'),
      wrong: wrong.map((lines) => lines.join('\n')),
      codeOptions: true,
      explain,
    });

  const KW_POOL = ['if', 'else if', 'else'];
  const blankChain = (branches, elseBody) => {
    const lines = [];
    branches.forEach((b, i) => {
      lines.push((i === 0 ? ['if('] : [tok('else if', 'kw'), '(']).concat(b.cond, ['){']));
      lines.push(['  '].concat(b.body));
      lines.push({ text: '}' });
    });
    lines.push([tok('else', 'kw'), '{']);
    lines.push(['  '].concat(elseBody));
    lines.push({ text: '}' });

  };
  const comparePiece = (name, op, value) => [tok(name, 'var'), ' ', tok(op, 'op'), ' ', tok(value, 'num')];
  const printPiece = (message) => ['console.log(', tok(lit(message), 'msg'), ')'];
  const followRules = (rules) => `Complete the code so it follows these rules, in this order:\n${numberedRules(rules)}`;

  const blanksSlot = {
    id: 'blanks',
    skill: 'build',
    concept: 'Completing an if / else if / else chain',
    patterns: [
      {

            count: 4,

              [{ cond: comparePiece('mouseX', '>', c.cx), body: [kit.setColor(V, c1)] }, { cond: comparePiece('mouseX', '<', c.cx), body: [kit.setColor(V, c2)] }],

  const SCRAMBLE_PROMPT = 'Put these lines in order so the code does this:';

            prompt: scrambleRules([`If ${w.noun} is ${a}, print "${m1}".`, `Otherwise, if it is ${b}, print "${m2}".`, `In every other case, print "${m3}".`]),
            prefix: [{ text: `let ${w.name} = ${lit(a)}`, run: `let ${w.name} = __in.${w.name}` }],
            movable: chainOf([`${w.name} == ${lit(a)}`, `${w.name} == ${lit(b)}`], [m1, m2, m3]),
            spec: { kind: 'snippet', vectors: kit.sceneVectors([side(w, '==', a)]) },

        id: 'mouse-sketch',

              `On ${kit.canvasName(c)}, if the mouse is on the right side, make ${V} ${c1.name}.`,

              `In every other case, make ${V} ${c3.name}.`,
              `Paint the background with ${V}.`,

            prefix: [{ text: 'function draw(){' }],
            movable: chainLines(
              [{ cond: `mouseX > ${c.cx}`, body: kit.setColor(V, c1) }, { cond: `mouseX < ${c.cx}`, body: kit.setColor(V, c2) }],
              kit.setColor(V, c3),

            suffix: [{ text: '}' }],
            spec: {
              kind: 'sketch',
              hiddenPrefix: [`let ${V}`, 'function setup(){', `  createCanvas(${c.w}, ${c.h})`, `  ${V} = color(255, 255, 255)`, '}'],
              vectors: kit.mouseVectors(c.w, c.h, [c.cx], [], [{ mouseX: c.cx, mouseY: 10 }]),

  CC.defineLesson({

// ---- src/lessons/u2la1-3.js ----
// U2LA1.3: Logical Operators And/Or
// curriculum/02-unit-2/04-U2LA1.3-Logical-Operators-And-Or.md
//
// Twelve question slots. Each slot has several structurally different patterns of about
// the same difficulty, and each pattern randomizes names, numbers, and messages.
//
// Students at this point have seen: variables, functions with parameters, mouseX/mouseY,
// color(), if / else if / else, ==, !=, <, >, <=, >=, && and ||.
// They have NOT seen: return values, boolean variables, ! (not), mixing && with || in one
// condition, loops, or arrays. Do not use those here.
var CodeCheck = typeof CodeCheck !== 'undefined' ? CodeCheck : {};

(function (CC) {
  'use strict';

  const kit = CC.kit;
  const {
    lit, side, flipSide, say, tok, log, chainLines, pickOp, join, yesNo, pickRange, firstTrue, chainMatters, ifBlock, numberedRules, letLines, sceneValues,
  } = kit;

  const OP_RULE = {
    '&&': '&& is true only when BOTH sides are true.',
    '||': '|| is true when AT LEAST ONE side is true.',
  };

  // Sides for "if(A1 op1 B1) ... else if(A2 op2 B2) ... else".
  function pickChainSides(r, s, op1, op2) {
    for (let tries = 0; tries < 500; tries++) {
      const A1 = side(s.a, pickOp(r), s.a.t);
      const B1 = side(s.b, pickOp(r), s.b.t);
      const A2 = side(s.a, pickOp(r), r.pick(s.a.thresholds));
      const B2 = side(s.b, pickOp(r), r.pick(s.b.thresholds));
      const vectors = kit.sceneVectors([A1, B1, A2, B2]);
      if (chainMatters([join(A1, op1, B1), join(A2, op2, B2)], vectors)) return { A1, B1, A2, B2, vectors };
    }
    throw new Error('Could not find a meaningful chain');
  }

  // ---- Slot: is the whole condition true or false? ----

  const TRUTH_OPTIONS = [{ text: 'true' }, { text: 'false' }];
  const TRUTH_PROMPT = 'For each row, decide whether the whole condition is true or false.';
  const ALL_COMBOS = [[true, true], [true, false], [false, true], [false, false]];

  function truthFromTwoSides(r, A, B, op) {
    const expr = join(A, op, B);
    for (let tries = 0; tries < 300; tries++) {
      const combos = [0, 1, 2, 3].map(() => r.pick(ALL_COMBOS));
      if (new Set(combos).size < 3) continue;
      const values = combos.map(([ta, tb]) => [kit.sideValue(r, A, ta), kit.sideValue(r, B, tb)]);

      // Every version has one value sitting exactly on its dividing value when it can.
      const edges = [];
      values.forEach((_, i) => {
        if (kit.isEdgeable(A) && kit.edgeTruth(A) === combos[i][0]) edges.push([i, 0, A]);
        if (kit.isEdgeable(B) && kit.edgeTruth(B) === combos[i][1]) edges.push([i, 1, B]);
      });
      if (edges.length) {
        const [i, col, s] = r.pick(edges);
        values[i][col] = s.t;
      }

      if (new Set(values.map(String)).size < 4) continue;
      const outcomes = values.map(([a, b]) => !!CC.evalExpr(expr, { [A.v.name]: a, [B.v.name]: b }));
      if (outcomes.every(Boolean) || outcomes.every((o) => !o)) continue;

      const notes = values.map(([a, b], i) => `${A.v.name} = ${lit(a)}, ${B.v.name} = ${lit(b)}: `
        + `${A.text} is ${yesNo(kit.sideTrue(A, a))}, ${B.text} is ${yesNo(kit.sideTrue(B, b))}, `
        + `so the condition is ${yesNo(outcomes[i])}.`);
      return kit.rowsQuestion({
        prompt: TRUTH_PROMPT,
        code: [expr],
        columns: [A.v.name, B.v.name],
        rows: values.map((cells, i) => ({ cells: cells.map(lit), answer: outcomes[i] ? 0 : 1 })),
        options: TRUTH_OPTIONS,
        explain: `${OP_RULE[op]}\n${notes.join('\n')}`,
      });
    }
    throw new Error(`Could not build rows for ${expr}`);
  }

  function truthFromRange(r, v, lowOp, highOp, op) {
    const { lo, hi } = pickRange(r, v);
    const A = side(v, lowOp, lo);
    const B = side(v, highOp, hi);
    const expr = join(A, op, B);
    const inside = kit.valuesOf(v).filter((n) => n > lo && n < hi);
    const below = kit.valuesOf(v).filter((n) => n < lo);
    const above = kit.valuesOf(v).filter((n) => n > hi);
    const values = r.shuffle([r.pick(below), r.pick(inside), r.pick([lo, hi]), r.pick(above)]);
    const outcomes = values.map((n) => !!CC.evalExpr(expr, { [v.name]: n }));
    const notes = values.map((n, i) => `${v.name} = ${n}: ${A.text} is ${yesNo(kit.sideTrue(A, n))}, `
      + `${B.text} is ${yesNo(kit.sideTrue(B, n))}, so the condition is ${yesNo(outcomes[i])}.`);
    return kit.rowsQuestion({
      prompt: TRUTH_PROMPT,
      code: [expr],
      columns: [v.name],
      rows: values.map((n, i) => ({ cells: [String(n)], answer: outcomes[i] ? 0 : 1 })),
      options: TRUTH_OPTIONS,
      explain: `${OP_RULE[op]}\n${notes.join('\n')}`,
    });
  }

  const truthSlot = {
    id: 'truth',
    skill: 'concepts',
    concept: 'Deciding whether && and || conditions are true or false',
    patterns: [
      {
        id: 'and-two-variables',
        make(r) {
          const s = kit.pickScene(r);
          return truthFromTwoSides(r, side(s.a, pickOp(r), s.a.t), side(s.b, pickOp(r), s.b.t), '&&');
        },
      },
      {
        id: 'or-two-variables',
        make(r) {
          const s = kit.pickScene(r);

        },
      },
      {
        id: 'and-inside-range',
        make(r) {
          const s = kit.pickScene(r);
          return truthFromRange(r, s.a, r.pick(['>', '>=']), r.pick(['<', '<=']), '&&');
        },
      },
      {
        id: 'or-outside-range',
        make(r) {
          const s = kit.pickScene(r);
          return truthFromRange(r, s.a, r.pick(['<', '<=']), r.pick(['>', '>=']), '||');
        },
      },
      {
        id: 'word-and-number',
        make(r) {
          const s = kit.pickScene(r);
          const w = kit.pickWordVar(r);
          const op = r.pick(['&&', '||']);
          return truthFromTwoSides(r, side(w, '==', r.pick(w.values)), side(s.a, pickOp(r), s.a.t), op);
        },
      },
      {
        id: 'mouse-position',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const op = r.pick(['&&', '||']);
          const A = side(kit.mouseVar('mouseX', c.w, c.cx), r.pick(['>', '<']), c.cx);
          const B = side(kit.mouseVar('mouseY', c.h, c.cy), r.pick(['>', '<']), c.cy);
          return truthFromTwoSides(r, A, B, op);
        },
      },
    ],
  };

  // ---- Slot: which condition matches this rule? ----

  const RULE_PROMPT = 'Which condition matches this rule?';

  const translateSlot = {
    id: 'translate',
    skill: 'concepts',
    concept: 'Choosing && or || to match a rule in words',
    patterns: [
      {
        id: 'both-true',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, pickOp(r), s.a.t);
          const B = side(s.b, pickOp(r), s.b.t);
          return kit.choiceQuestion(r, {
            prompt: RULE_PROMPT,
            rule: `The code should run only when ${say(A)} and ${say(B)}.`,
            correct: join(A, '&&', B),
            wrong: [join(A, '||', B), join(flipSide(A), '&&', B), join(A, '&&', flipSide(B))],
            exprOptions: true,
            explain: `The rule needs both things to be true, so it uses &&. Each comparison also has to point the same way as the rule: "${say(A)}" is ${A.text}.`,
          });
        },
      },
      {
        id: 'at-least-one',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, pickOp(r), s.a.t);
          const B = side(s.b, pickOp(r), s.b.t);
          return kit.choiceQuestion(r, {
            prompt: RULE_PROMPT,
            rule: `The code should run when at least one of these is true: ${say(A)}, or ${say(B)}.`,
            correct: join(A, '||', B),
            wrong: [join(A, '&&', B), join(flipSide(A), '||', B), join(A, '||', flipSide(B))],
            exprOptions: true,
            explain: `Only one of them has to be true, so the rule uses ||. "${say(B)}" is ${B.text}.`,
          });
        },
      },
      {
        id: 'between-two-values',
        make(r) {
          const v = kit.pickScene(r).a;
          const { lo, hi } = pickRange(r, v);
          const n = v.name;
          return kit.choiceQuestion(r, {
            prompt: RULE_PROMPT,
            rule: `The code should run only when ${v.noun} is above ${lo} and also below ${hi}.`,
            correct: `${n} > ${lo} && ${n} < ${hi}`,
            wrong: [`${n} > ${lo} || ${n} < ${hi}`, `${n} < ${lo} && ${n} > ${hi}`, `${n} < ${lo} || ${n} > ${hi}`],
            exprOptions: true,
            explain: `Being between two values means both comparisons must be true at once, so it uses &&: ${n} > ${lo} && ${n} < ${hi}. With ||, every number would pass.`,
          });
        },
      },
      {
        id: 'outside-two-values',
        make(r) {
          const v = kit.pickScene(r).a;
          const { lo, hi } = pickRange(r, v);
          const n = v.name;
          return kit.choiceQuestion(r, {
            prompt: RULE_PROMPT,
            rule: `The code should run when ${v.noun} is below ${lo} or above ${hi}.`,
            correct: `${n} < ${lo} || ${n} > ${hi}`,
            wrong: [`${n} < ${lo} && ${n} > ${hi}`, `${n} > ${lo} && ${n} < ${hi}`, `${n} > ${lo} || ${n} < ${hi}`],
            exprOptions: true,
            explain: `A number can't be below ${lo} and above ${hi} at the same time, so && would never be true. The rule needs ||.`,
          });
        },
      },
      {
        id: 'part-of-canvas',
        make(r) {
          const c = r.pick(kit.CANVASES);
          const name = r.pick(kit.quadrantNames);
          const q = kit.QUADRANTS[name];
          const flip = (op) => (op === '>' ? '<' : '>');
          return kit.choiceQuestion(r, {

            rule: `On ${kit.canvasName(c)}, the code should run only when the mouse is in the ${name} part of the canvas.`,
            correct: `mouseX ${q.x} ${c.cx} && mouseY ${q.y} ${c.cy}`,
            wrong: [
              `mouseX ${q.x} ${c.cx} || mouseY ${q.y} ${c.cy}`,

              `mouseX ${flip(q.x)} ${c.cx} && mouseY ${q.y} ${c.cy}`,
            ],
            exprOptions: true,
            explain: `mouseX gets bigger to the right and mouseY gets bigger going DOWN the canvas. One part of the canvas needs both comparisons to be true, so it uses &&.`,
          });
        },
      },
    ],
  };

  // ---- Slot: what does this condition mean? ----

  const EXPLAIN_PROMPT = 'When does the code inside this if statement run?';

  const explainSlot = {
    id: 'explain',
    skill: 'concepts',
    concept: 'Reading a condition in plain English',
    patterns: [
      {
        id: 'canvas-and',

          const yWord = q.y === '>' ? 'bottom half' : 'top half';

            prompt: `${EXPLAIN_PROMPT} The canvas is ${c.w} by ${c.h}.`,

          const flip = (op) => (op === '>' ? '<' : '>');
          const corner = (x, y) => `${y === '>' ? 'bottom' : 'top'}-${x === '>' ? 'right' : 'left'}`;
          return kit.choiceQuestion(r, {
            prompt: `${EXPLAIN_PROMPT} The canvas is ${c.w} by ${c.h}.`,

            wrong: [
              `Only when the mouse is in the ${corner(xOp, yOp)} part of the canvas`,
              `Only when the mouse is in the ${corner(flip(xOp), flip(yOp))} part of the canvas`,

          });
        },
      },
      {
        id: 'variables-and',
        make(r) {
          const s = kit.pickScene(r);
          const A = side(s.a, pickOp(r), s.a.t);
          const B = side(s.b, pickOp(r), s.b.t);
          return kit.choiceQuestion(r, {
            prompt: EXPLAIN_PROMPT,
            code: ifBlock(join(A, '&&', B), log(s.outcomes[0])),
            correct: `Only when ${say(A)} and ${say(B)}`,
            wrong: [
              `When at least one is true: ${say(A)}, or ${say(B)}`,
              `Only when ${say(flipSide(A))} and ${say(B)}`,
              `Only when ${say(A)} and ${say(flipSide(B))}`,
            ],
            explain: `&& means both comparisons must be true at the same time.`,
          });
        },
      },
      {
        id: 'variables-or',

          const s = kit.pickScene(r);
          const A = side(s.a, pickOp(r), s.a.t);
          const B = side(s.b, pickOp(r), s.b.t);
          return kit.choiceQuestion(r, {
            prompt: EXPLAIN_PROMPT,
            code: ifBlock(join(A, '||', B), log(s.outcomes[0])),
            correct: `When at least one is true: ${say(A)}, or ${say(B)}`,
            wrong: [
              `Only when ${say(A)} and ${say(B)}`,
              `When at least one is true: ${say(flipSide(A))}, or ${say(B)}`,
              `When at least one is true: ${say(A)}, or ${say(flipSide(B))}`,

        id: 'range',
        make(r) {

          return kit.choiceQuestion(r, {
            prompt: EXPLAIN_PROMPT,
            code: ifBlock(`${n} >= ${lo} && ${n} <= ${hi}`, log('In range')),

        },

  };

  function pickQuadrantSet(r) {
    return r.shuffle(kit.quadrantNames);
  }

  // ---- Slot: tap where the condition is true ----

  const REGION_PROMPT = 'Tap every part of the canvas where this condition is true.';

  const regionSlot = {

  // ---- Slot: what does this chain print? ----

  // Finds values so the target branch runs and, when possible, a later condition is also
  // true. That way a student who thinks every true branch runs picks a wrong answer.
  function buildChainTrace(r, { makeConds, render, target }) {
    for (let tries = 0; tries < 500; tries++) {
      const { conds, vars, messages, sampleVars, argOrder } = makeConds();
      const values = sampleVars();
      const first = firstTrue(conds, values);
      if (first !== target) continue;
      const later = [];
      for (let i = first + 1; i < conds.length; i++) {
        if (CC.evalExpr(conds[i], values)) later.push(i);
      }
      if (first < conds.length - 1 && !later.length) continue;
      const code = render({ conds, values, messages, vars, argOrder });
      const result = CC.runCode(code.join('\n'), {});
      if (result.error) throw new Error(`Generated code failed: ${result.error}\n${code.join('\n')}`);
      if (result.logs.length !== 1 || result.logs[0] !== messages[first]) {
        throw new Error(`Key mismatch for\n${code.join('\n')}`);
      }
      const walk = conds.map((cond, i) => {
        if (i > first) return null;
        return `${i === 0 ? 'if' : 'else if'}(${cond}) is ${yesNo(i === first)}`;
      }).filter(Boolean);
      const finish = first === conds.length ? 'None were true, so the else runs.' : 'It stops at the first true condition and skips the rest.';
      const extra = first < conds.length
        ? `Both "${messages[first]}" and "${messages[later.length ? later[0] : first + 1]}" print`
        : 'Nothing prints';
      return kit.choiceQuestion(r, {
        prompt: 'What does this code print?',
        code,
        correct: messages[first],
        wrong: messages.filter((m) => m !== messages[first]).concat([extra]),
        explain: `${walk.join('. ')}. ${finish}`,
      });
    }
    throw new Error('Could not build a chain trace');
  }

  const pickTarget = (r) => r.pick([0, 1, 2, 3]);

  const chainBody = (conds, messages, pad) => chainLines(
    conds.map((cond, i) => ({ cond, body: log(messages[i]) })),
    log(messages[conds.length]),
    pad,
  );

  const traceChainSlot = {
    id: 'traceChain',
    skill: 'flow',
    concept: 'Following if / else if / else: the first true condition wins',
    patterns: [
      {

                conds: [join(a(), '&&', b()), join(a(), '||', b()), a().text],

      },

  // ---- Slot: where the mouse is decides the color ----

  const onLineNote = 'Check conditions from the top and stop at the first true one. A mouse exactly on a dividing line is not above or below it, so < and > are both false there.';

  const traceMouseSlot = {

  // ---- Slot: tap each line that runs ----

  const flowSlot = {

            return letLines(values).concat(
              chainLines(
                [{ cond: join(a(), '&&', b()), body: log(s.outcomes[0]) },

              ),
              chainLines([{ cond: join(a(), '||', b()), body: log(s.outcomes[3]) }]),

        },
      },

        id: 'function-called-once',

              chainLines([{ cond: join(a, '||', b()), body: log(s.outcomes[0]) }], log(s.outcomes[1])),

  // ---- Slot: find the bug and say why ----

  const { WHY } = kit;

  const bugSceneSetup = (r) => {
    const s = kit.pickScene(r);
    const A = side(s.a, pickOp(r), s.a.t);
    const B = side(s.b, pickOp(r), s.b.t);

  const bugSlot = {
    id: 'bug',
    skill: 'flow',

    patterns: [
      {
        id: 'or-should-be-and',
